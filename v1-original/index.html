/* ================= camada: painéis, modais ================= */
function fresh(o){return o&&Date.now()-(o.t0||0)<350?'enter':'';}
function chip(act,arg,on,label,role){return `<button type="button" class="chip" role="${role||'radio'}" aria-checked="${!!on}" data-act="${act}" data-arg="${esc(arg)}">${label}</button>`;}
function pNova(p){
  if(p.signed)return pAssinada(p);
  const estMin=p.est==='outra'?(parseInt(p.custom,10)||0):p.est;const can=p.title.trim().length>=3&&estMin>=5;
  let perm='';
  if(p.notify&&S.notifPerm==='default')perm=`<div class="perm">${boss('Sem notificação, só consigo cobrar com a aba aberta.')}<button class="btn btn-ghost btn-sm" data-act="pedirPerm">${ic('bell','ic-s')} Autorizar no navegador</button></div>`;
  else if(p.notify&&S.notifPerm==='granted')perm=`<p class="hint">${ic('check','ic-xs')} Notificações autorizadas neste navegador.</p>`;
  else if(S.ui.permMsg)perm=boss(S.ui.permMsg,{mood:'bravo'});
  return `<div class="scrim ${fresh(p)}" data-act="fecharPainel"></div><div class="panel ${fresh(p)}" role="dialog" aria-modal="true" aria-labelledby="pn-h">
  <div class="panel-head"><span class="label">Nova tarefa</span><button class="btn btn-ghost btn-sm" data-act="fecharPainel">Fechar ${ic('x','ic-s')}</button></div>
  <div class="panel-body">
    <h2 id="pn-h" class="h2">O que você promete?</h2>
    <div class="field"><label for="nt-title">Título</label><input id="nt-title" class="input" data-model="ui.panel.title" data-enter="assinar" value="${esc(p.title)}" placeholder="Ex.: Preparar pauta da reunião" maxlength="80" autocomplete="off"></div>
    <div class="field"><span class="flabel" id="nt-est-l">Estimativa</span><div class="chips" role="radiogroup" aria-labelledby="nt-est-l">${[15,30,45,60,120].map(m=>chip('ntEst',m,p.est===m,fmtMin(m))).join('')}${chip('ntEst','outra',p.est==='outra','outra')}</div>
      ${p.est==='outra'?`<div class="inline"><label class="sr" for="nt-custom">Minutos</label><input id="nt-custom" type="number" min="5" max="480" step="5" class="input input-sm" data-model="ui.panel.custom" value="${esc(p.custom)}" placeholder="90"><span class="sub">minutos</span></div>`:''}
      <p class="hint">${estMin>=5?`Prazo = <b>${fmtMin(estMin)}</b> depois de iniciar.`:'Diga quanto tempo leva.'} Sem data, sem hora, sem desculpa.</p></div>
    <div class="field"><label for="nt-tol">Tolerância de atraso</label><select id="nt-tol" class="input" data-model="ui.panel.tol" data-num>${[10,15,30,45,60].map(v=>`<option value="${v}" ${v===p.tol?'selected':''}>${v===S.settings.tol?'Padrão · ':''}${v} min</option>`).join('')}</select><p class="hint">Folga depois da estimativa. Passou dela, vira cobrança de atraso.</p></div>
    <div class="switch-row"><div><strong id="nt-n-l">Me cobrar por notificação</strong><p>Aviso quando a estimativa acabar e quando a pausa passar.</p></div>${sw('ntNotify',p.notify,'nt-n-l')}</div>
    ${perm}
  </div>
  <div class="panel-foot">${S.pro?`<button class="btn btn-ghost" data-act="rascunho" ${can?'':'disabled'}>Salvar rascunho</button>`:''}<button class="btn btn-pen btn-lg" data-act="assinar" ${can?'':'disabled'}>${ic('pen','ic-s')} Assinar tarefa</button></div></div>`;
}
function pAssinada(p){
  const t=task(p.signed);
  return `<div class="scrim" data-act="fecharPainel"></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="pa-h">
  <div class="panel-head"><span class="label">Nova tarefa</span><button class="btn btn-ghost btn-sm" data-act="fecharPainel">Fechar ${ic('x','ic-s')}</button></div>
  <div class="panel-body"><span class="stamp s-pen big">${ic('lock','ic-xs')} Assinada · ${hhmm(t.signedAt)}</span><h2 id="pa-h" class="h2">Tarefa assinada. Agora é contrato.</h2>
    <dl class="kv"><div class="wide"><dt>Tarefa</dt><dd>${esc(t.title)}</dd></div><div><dt>Estimativa</dt><dd>${fmtMin(t.est)}</dd></div><div><dt>Tolerância</dt><dd>${t.tol} min</dd></div><div><dt>Prazo</dt><dd>${fmtMin(t.est)} depois de iniciar</dd></div><div><dt>Notificação</dt><dd>${t.notify?'ligada':'desligada'}</dd></div></dl>
    <div class="sigline">${Date.now()-(p.st0||0)<1500?SIG:SIG.replace('sig draw','sig')}<span>assinatura do subordinado · ${hhmm(t.signedAt)}</span></div>
    ${boss('O relógio começa quando você começar. Não demore.')}</div>
  <div class="panel-foot"><button class="btn btn-ghost" data-act="nova">Criar outra</button><button class="btn btn-primary btn-lg" data-act="irPressao" data-arg="${t.id}">Ir para o Modo Pressão</button></div></div>`;
}
function pTarefa(p){
  const t=task(p.id);if(!t)return '';
  const done=t.status==='entregue';const pend=t.status==='fila';
  let alert='';
  if(p.alert){
    const opts=p.alert==='estimativa'?[15,30,45,60,90,120,180].filter(v=>v!==t.est):p.alert==='tolerancia'?[10,15,30,45,60].filter(v=>v!==t.tol):[];
    alert=`<div class="alert-box" role="alert">${boss('Contrato é contrato.',{mood:'bravo'})}<strong>${p.alert==='excluir'?'Quer sumir com ela? Então explica direito.':'Quer mais tempo? Então explica direito.'}</strong><p>Vira cobrança <b>mudança no plano</b>, com desculpa formal em 3 passos.</p>
      ${opts.length?`<div class="field"><span class="flabel" id="ne-l">${p.alert==='estimativa'?'Nova estimativa':'Nova tolerância'}</span><div class="chips" role="radiogroup" aria-labelledby="ne-l">${opts.map(v=>chip('lockVal',v,p.val===v,p.alert==='estimativa'?fmtMin(v):v+' min')).join('')}</div></div>`:''}
      <div class="row"><button class="btn btn-primary" data-act="fazerDesculpaMudanca" ${opts.length&&!p.val?'disabled':''}>Fazer desculpa formal</button><button class="btn btn-ghost" data-act="deixa">Deixa como está</button></div></div>`;
  }
  return `<div class="scrim ${fresh(p)}" data-act="fecharPainel"></div><div class="panel ${fresh(p)}" role="dialog" aria-modal="true" aria-labelledby="pt-h">
  <div class="panel-head">${done?`<span class="stamp s-ok">${ic('check','ic-xs')} Entregue às ${hhmm(t.deliveredAt)}</span>`:`<span class="stamp">${ic('lock','ic-xs')} Assinada ${t.origin==='ontem'?'ontem ':''}às ${hhmm(t.signedAt)}</span>`}<button class="btn btn-ghost btn-sm" data-act="fecharPainel">Fechar ${ic('x','ic-s')}</button></div>
  <div class="panel-body"><h2 id="pt-h" class="h2">${esc(t.title)}</h2>
    <dl class="kv"><div><dt>Estimativa ${ic('lock','ic-xs')}</dt><dd>${fmtMin(t.est)}</dd></div><div><dt>Tolerância ${ic('lock','ic-xs')}</dt><dd>${t.tol} min</dd></div>
    ${done?`<div><dt>Real</dt><dd>${fmtMin(t.workMs/MIN)}</dd></div><div><dt>Pomodoros</dt><dd>${t.pomos}</dd></div>`:`<div class="wide"><div class="switch-row"><div><strong id="tn-l" style="font-size:15px">Notificação</strong><p>${t.notify?'ligada':'desligada'}</p></div>${sw('taskNotify',t.notify,'tn-l',t.id)}</div></div>`}</dl>
    ${pend&&!p.alert?boss('Contrato é contrato. Para mexer, só com desculpa formal.'):''}
    ${alert}
  </div>
  ${pend?`<div class="panel-foot"><button class="btn btn-ghost btn-sm" data-act="lockAlert" data-arg="estimativa">Mudar estimativa</button><button class="btn btn-ghost btn-sm" data-act="lockAlert" data-arg="tolerancia">Mudar tolerância</button><button class="btn btn-danger btn-sm" data-act="lockAlert" data-arg="excluir">Excluir</button><button class="btn btn-primary" data-act="irPressao" data-arg="${t.id}">Abrir no Modo Pressão</button></div>`:''}</div>`;
}
function mPaywall(m){
  return `<div class="scrim ${fresh(m)}" data-act="closeModal"></div><div class="modal ${fresh(m)}" role="dialog" aria-modal="true" aria-labelledby="pw-h">
  <div class="modal-head"><span class="label" id="pw-h">PRO · Semana e Mês</span><button class="btn btn-ghost btn-sm" data-act="closeModal">Fechar ${ic('x','ic-s')}</button></div>
  ${boss('Planejar a semana é coisa de gerente. Promoção custa.',{lg:true})}
  <ul class="notes">${['Plano da semana e do mês','Capacidade do dia e aviso “Não cabe”','Rascunhos antes de assinar','Expediente personalizado','Assinatura em lote'].map(x=>`<li><time>${ic('plus','ic-xs')}</time><span>${x}</span></li>`).join('')}</ul>
  <div class="row" style="justify-content:space-between"><span class="label">Preço</span><span class="stamp s-amber">a definir</span></div>
  <div class="row"><button class="btn btn-pen btn-lg" data-act="upgrade">Fazer upgrade</button><button class="btn btn-ghost btn-lg" data-act="closeModal">Fico no plano do dia</button></div>
  <p class="fine">No grátis você continua com tarefas do dia, Modo Pressão, cobranças, ponto e Dossiê. Neste protótipo o upgrade é só uma simulação.</p></div>`;
}
function mNaoCabe(m){
  const d=new Date(keyDate(m.key));const capM=workdayMin();
  return `<div class="scrim ${fresh(m)}" data-act="closeModal"></div><div class="modal modal-sm ${fresh(m)}" role="alertdialog" aria-modal="true" aria-labelledby="nc-h">
  <div style="display:flex;gap:16px;align-items:center">${face('bravo','face face-xl')}<h2 id="nc-h" class="display" style="font-size:56px">Não cabe.</h2></div>
  <p class="lead">${WD[d.getDay()]} ficou com <b>${fmtShort(m.total)}</b> num expediente de ${fmtShort(capM)}. Sobra ${fmtMin(m.total-capM)} de otimismo.</p>
  <div class="row"><button class="btn btn-primary btn-lg" data-act="closeModal">Ajustar</button><button class="btn btn-danger btn-lg" data-act="assumirRisco">Assumir o risco</button></div>
  <p class="fine">Assumir o risco assina mesmo assim e fica anotado no Dossiê.</p></div>`;
}
function mPausar(m){
  return `<div class="scrim ${fresh(m)}" data-act="closeModal"></div><div class="modal ${fresh(m)}" role="dialog" aria-modal="true" aria-labelledby="pz-h">
  ${boss('<span id="pz-h">Pausar? Diga o motivo.</span>',{mood:'cetico',lg:true})}
  <p class="sub">Rápido. O relógio da tarefa para; o meu, não.</p>
  <div class="chips" role="radiogroup" aria-label="Motivo da pausa">${PAUSE_CATS.map(k=>chip('pauseCat',k,m.cat===k,k)).join('')}</div>
  <div class="field"><label for="pz-note">Motivo (opcional)</label><input id="pz-note" class="input" data-model="ui.modal.note" data-enter="pausarConfirm" value="${esc(m.note)}" placeholder="Cliente ligou" maxlength="100" autocomplete="off"></div>
  <p class="hint">Limite de pausa: <b>${S.settings.pauseLimit} min</b>. Passou disso, vira cobrança de excedente.</p>
  <div class="row"><button class="btn btn-primary btn-lg" data-act="pausarConfirm" ${m.cat?'':'disabled'}>${ic('pause','ic-s')} Pausar</button><button class="btn btn-ghost btn-lg" data-act="closeModal">Continuar trabalhando</button></div></div>`;
}
function mRegistro(m){
  const isI=m.tab==='interrupcao';
  return `<div class="scrim ${fresh(m)}" data-act="closeModal"></div><div class="modal modal-sm ${fresh(m)}" role="dialog" aria-modal="true" aria-labelledby="rg-h">
  <div class="modal-head"><h2 id="rg-h" class="h2">Anota e volta.</h2><span class="stamp s-pen">⏱ correndo · <span data-t="${S.run&&S.run.pomo?'block':'elapsed'}"></span></span></div>
  <div class="seg seg-sm" role="tablist"><button role="tab" aria-selected="${isI}" data-act="regTab" data-arg="interrupcao">Interrupção</button><button role="tab" aria-selected="${!isI}" data-act="regTab" data-arg="ideia">Ideia</button></div>
  ${isI?`<div class="chips" role="radiogroup" aria-label="Tipo">${INT_TYPES.map(k=>chip('regType',k,m.type===k,k)).join('')}</div>`:''}
  <div class="field"><label for="rg-note">${isI?'O que foi (opcional)':'Qual a ideia?'}</label><input id="rg-note" class="input" data-model="ui.modal.note" data-enter="registrar" value="${esc(m.note)}" placeholder="${isI?'Rafael do financeiro pediu o arquivo de setembro':'Automatizar o envio do relatório'}" maxlength="140" autocomplete="off"></div>
  ${!isI?`<p class="hint">Fica guardada no Dossiê${S.pro?' e vira rascunho de hoje':''}.</p>`:''}
  <div class="row" style="justify-content:space-between"><p class="quip">O timer não para. Nem eu.</p><button class="btn btn-primary" data-act="registrar" ${!isI&&m.note.trim().length<3?'disabled':''}>Registrar</button></div></div>`;
}
function mHist(m){
  const c=cob(m.id);if(!c)return '';const e=c.excuse||{};
  return `<div class="scrim ${fresh(m)}" data-act="closeModal"></div><div class="modal ${fresh(m)}" role="dialog" aria-modal="true" aria-labelledby="hi-h">
  <div class="modal-head"><span class="stamp ${c.verdict==='tolerada'?'s-ok':c.verdict==='suspeita'?'s-amber':'s-red'} big">${c.verdict}</span><button class="btn btn-ghost btn-sm" data-act="closeModal">Fechar ${ic('x','ic-s')}</button></div>
  <h2 id="hi-h" class="h2">${COB[c.type][0]} · ${esc(c.title)}</h2>
  <dl class="kv"><div><dt>Aberta</dt><dd>${dayLabel(c.at)} ${hhmm(c.at)}</dd></div><div><dt>Categoria</dt><dd>${esc(e.cat)}</dd></div><div class="wide"><dt>Relato</dt><dd style="font-weight:400">${esc(e.relato)}</dd></div>
  <div class="wide"><dt>Da próxima vez</dt><dd style="font-weight:400">${e.se&&e.faco?`Se ${esc(e.se)}, eu ${esc(e.faco)}.`:'Sem plano. Pulou o passo 3.'}</dd></div></dl>
  <p class="fine">Somente leitura. Desculpa entregue não se reescreve.</p></div>`;
}
function mDList(m){
  const k=m.key;let title='',rows=[];
  const ws=weekStats();
  if(k==='pe'){title='Prometido x entregue';rows=ws.filter(d=>d.s).map(d=>[d.label,`${d.s.e} de ${d.s.p} entregues`]);S.tasks.filter(t=>t.day===today()).forEach(t=>rows.push(['Hoje',`${t.title} · ${t.status==='entregue'?'entregue':t.status==='fila'||t.status==='exec'?'na fila':t.status==='amanha'?'levada para amanhã':t.status}`]));}
  if(k==='er'){title='Estimado x real';S.tasks.filter(t=>taskWork(t)>0).forEach(t=>rows.push([t.title,`${fmtShort(t.est)} → ${fmtShort(taskWork(t)/MIN)}`]));ws.filter(d=>d.s&&!d.isToday).forEach(d=>rows.push([d.label,`${fmtShort(d.s.estM)} → ${fmtShort(d.s.realM)}`]));}
  if(k==='pl'){title='Pomodoro x livre';ws.filter(d=>d.s).forEach(d=>rows.push([d.label,`${fmtShort(d.s.pomoM)} com pomodoro · ${fmtShort(d.s.livreM)} livre`]));}
  if(k==='in'){title='Interrupções';S.interrupts.slice().reverse().forEach(i=>rows.push([`${dayLabel(i.at)} ${hhmm(i.at)}`,`${i.type}${i.note?': '+i.note:''}`]));ws.filter(d=>d.s&&!d.isToday).forEach(d=>rows.push([d.label,`${d.s.intr} registradas`]));}
  if(k==='aa'){title='Atrasos e abandonos';S.cobs.filter(c=>c.type==='atraso'||c.type==='abandono').sort((a,b)=>b.at-a.at).forEach(c=>rows.push([`${dayLabel(c.at)} ${hhmm(c.at)}`,`${COB[c.type][0]} · ${c.title} · ${c.status==='aberta'?'aberta':c.verdict}`]));}
  return `<div class="scrim ${fresh(m)}" data-act="closeModal"></div><div class="modal ${fresh(m)}" role="dialog" aria-modal="true" aria-labelledby="dl-h">
  <div class="modal-head"><h2 id="dl-h" class="h2">${title}</h2><button class="btn btn-ghost btn-sm" data-act="closeModal">Fechar ${ic('x','ic-s')}</button></div>
  ${rows.length?`<ul class="notes">${rows.map(r=>`<li><time>${esc(r[0])}</time><span>${esc(r[1])}</span></li>`).join('')}</ul>`:'<p class="fine">Nada registrado ainda.</p>'}</div>`;
}

  ['Fluxo 1 · Prancheta',[['1·5','Prancheta · plano do dia'],['1·6','Nova tarefa'],['1·6n','Permissão de notificação'],['1·8','Tarefa assinada'],['1·9','Edição bloqueada'],['1·5p','Upgrade · paywall'],['1·5s','Semana · Mês (PRO)'],['1·7','“Não cabe”']]],
  ['Fluxo 2A · Modo Pressão',[['2A·10','Fila travada'],['2A·12','Tela de foco'],['2A·13','Estimativa estourou'],['2A·11','Atraso na execução'],['2A·14','Pausa programada'],['2A·14e','Pausa · excedente'],['2A·15','Desculpa rápida'],['2A·16','Tarefa pausada']]],
  ['Fluxo 2B · Registrar e entregar',[['2B·17','Registro rápido'],['2B·18','Entrega'],['2B·18z','Fila zerada'],['2B·19','“Uma de cada vez.”']]],
  ['Fluxo 3 · Central de Desculpas',[['3·20','Cobranças pendentes'],['3·21a','Desculpa formal · 1'],['3·21b','Desculpa formal · 2'],['3·21c','Desculpa formal · 3'],['3·22','Veredito'],['3·23','Histórico']]],
  ['Fluxo 4 · Bater o ponto',[['4·24','Resumo do dia'],['4·25','Não entregues'],['4·26','Bloqueio'],['4·27','Reflexão e veredito'],['4·27b','Ponto batido']]],
  ['Abas',[['28','Dossiê'],['29','Expediente (PRO)']]]

function demoDrawer(){
  return `<div class="scrim" data-act="demoClose" style="background:transparent"></div><aside class="demo ${fresh(S.ui.demo)}" role="dialog" aria-label="Roteiro do protótipo">
  <div class="demo-head"><span>Roteiro do protótipo</span><button class="btn btn-ghost btn-sm" data-act="demoClose" aria-label="Fechar roteiro">${ic('x','ic-s')}</button></div>
  <div class="demo-body">
    <p class="fine">Atalhos para cada tela do flow. Cada um monta um estado de exemplo; os números são fictícios.</p>
    <div class="demo-sec"><span class="label">Relógio de simulação</span><span class="simclock" data-t="simclock"></span>
      <div class="seg seg-sm" role="tablist" aria-label="Velocidade">${[1,10,60].map(v=>`<button role="tab" aria-selected="${S.clock.speed===v}" data-act="speed" data-arg="${v}">${v}×</button>`).join('')}</div>
      <div class="row"><button class="btn btn-ghost btn-sm" data-act="skip" data-arg="5">+5 min</button><button class="btn btn-ghost btn-sm" data-act="skip" data-arg="30">+30 min</button><button class="btn btn-ghost btn-sm" data-act="skip18">Ir para ${S.settings.end}</button></div></div>
    ${SCREENS.map(([g,items])=>`<div class="demo-sec"><span class="label">${g}</span><ul class="demo-list">${items.map(([id,l])=>`<li><button data-act="stage" data-arg="${id}"><code>${id}</code><span>${l}</span></button></li>`).join('')}</ul></div>`).join('')}
    <div class="demo-sec"><button class="btn btn-danger btn-sm" data-act="reset">Reiniciar demonstração</button></div>
  </div></aside>`;
}
function renderLayer(){
  let h='';const u=S.ui;
  if(u.panel){h+=u.panel.kind==='nova'?pNova(u.panel):pTarefa(u.panel);}
  if(u.modal){const k=u.modal.kind;h+=k==='paywall'?mPaywall(u.modal):k==='naocabe'?mNaoCabe(u.modal):k==='pausar'?mPausar(u.modal):k==='registro'?mRegistro(u.modal):k==='hist'?mHist(u.modal):k==='dlist'?mDList(u.modal):'';}
  if(u.corner){const c=cob(u.corner);if(c&&c.status==='aberta')h+=`<div class="corner ${fresh(u.cornerO)}" role="alertdialog" aria-labelledby="cn-h">${boss('Explica agora ou até bater o ponto.',{mood:'bravo'})}<span id="cn-h" class="stamp s-red">Cobrança aberta · atraso</span><div class="row"><button class="btn btn-primary btn-sm" data-act="explicar" data-arg="${c.id}" data-ret="foco">Explicar agora</button><button class="btn btn-ghost btn-sm" data-act="cornerClose">Trabalhar primeiro</button></div></div>`;}
  if(u.browserPrompt)h+=`<div class="bprompt" role="dialog" aria-label="Pedido do navegador (simulado)"><span class="label">Pedido do navegador · simulado</span><p>${ic('bell')}<span><b>bossfyme.app</b> quer mostrar notificações</span></p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="perm" data-arg="denied">Bloquear</button><button class="btn btn-primary btn-sm" data-act="perm" data-arg="granted">Permitir</button></div></div>`;
  if(u.demo)h+=demoDrawer();
  return h;
}

/* ================= render ================= */
function render(){
  const ae=document.activeElement;const fid=ae&&ae.id&&ae!==document.body?ae.id:null;let ss=null,se=null;
  try{if(ae&&'selectionStart' in ae){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
  const pb=$('.panel-body');const pbs=pb?pb.scrollTop:0;
  const onb=S.route==='welcome'||S.route==='regras';
  const app=$('#app');app.className='app'+(onb?' is-onb':'');
  if(!onb){$('#side').innerHTML=renderSide();$('#topbar').innerHTML=renderTop();$('#tabbar').innerHTML=navItems();}
  const main=$('#main');main.innerHTML=(VIEWS[S.route]||vPrancheta)();
  if(S.ui._top){main.scrollTop=0;delete S.ui._top;}
  $('#layer').innerHTML=renderLayer();
  $('#demoBtn').hidden=!!S.ui.demo;
  const pb2=$('.panel-body');if(pb2)pb2.scrollTop=pbs;
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null&&el.setSelectionRange)el.setSelectionRange(ss,se);}catch(e){}}}
  updateTicks();
}
function updateTicks(){
  const n=now();const V={},W={};
  V.hhmm=hhmm(n);
  V.simclock=`${dateLong(n)} · ${hhmm(n)}:${pad(new Date(n).getSeconds())} · ${S.clock.speed}×`;
  const eod=endOfDay()-n;
  V.left=S.closed?'parado':eod>0?`faltam ${fmtShort(Math.ceil(eod/MIN))}`:`+${fmtShort(Math.floor(-eod/MIN))}`;
  const r=S.run;
  if(r){
    const t=task(r.taskId);const w=taskWork(t);const est=t.est*MIN,tol=t.tol*MIN;
    const bl=r.pomo?blockLeft():est-w;
    V.block=clockMs(Math.max(0,bl));
    V['remain-big']=clockMs(est-w);
    V.remain=w<=est?clockMs(est-w):`+${Math.floor((w-est)/MIN)} min`;
    V.prazo=w<=est?`prazo às ${hhmm(n+est-w)}`:w<=est+tol?`tolerância até ${hhmm(n+est+tol-w)}`:`tolerância acabou ${hhmm(n-(w-est-tol))}`;
    V.elapsed=clockMs(w);
    V.overmin=`${Math.max(0,Math.floor((w-est)/MIN))} min`;V.overchip=`+${Math.max(0,Math.floor((w-est)/MIN))} min`;
    V['side-run']=r.phase==='work'?clockMs(Math.max(0,r.pomo?bl:w)):r.phase==='break'?'pausa':'pausada';
    if(r.phase==='break'){const len=breakLen(r.breakKind),el=n-r.phaseStart;V.break=clockMs(len-el);V['break-desc']=`${breakName(r.breakKind)} de ${len/MIN} min · +${minSec(el-len)}`;}
    if(r.phase==='pause'){const lim=S.settings.pauseLimit*MIN,el=n-r.phaseStart;V.plimit=clockMs(lim-el);V['plimit-l']=el<=lim?'restantes':'além do limite · virou cobrança';}
    W.fill=Math.min(100,w/(est+tol)*100);
  }
  document.querySelectorAll('[data-t]').forEach(el=>{const v=V[el.dataset.t];if(v!==undefined&&el.textContent!==v)el.textContent=v;});
  document.querySelectorAll('[data-tw]').forEach(el=>{const v=W[el.dataset.tw];if(v!==undefined)el.style.width=v+'%';});
}

}
function notify(kind,title,body,t){

/* ================= relógio ================= */
let lastSave=0;
function tick(){
  if(!S)return;const n=now();let re=false;const r=S.run;
  if(r&&!S.closed){
    const t=task(r.taskId);
    if(r.phase==='work'){
      const w=taskWork(t);
      if(!r.estWarned&&w>t.est*MIN){r.estWarned=true;re=true;notify('est','A estimativa acabou',`${t.title}: a tolerância de ${t.tol} min começou a correr.`,t);if(S.route!=='foco')toast('Estimativa estourou.','Otimismo não é método.');}
      if(!r.lateCob&&w>(t.est+t.tol)*MIN){r.lateCob=addCob({type:'atraso',taskId:t.id,title:t.title});S.ui.corner=r.lateCob;S.ui.cornerO={t0:Date.now()};re=true;notify('cob','Cobrança aberta · atraso',t.title,t);}
      if(r.pomo&&blockLeft()<=0){toBreak();re=true;notify('pausa','Bloco encerrado',`Pausa de ${breakLen(r.breakKind)/MIN} min. Sem desculpa.`,t);if(S.route!=='foco')toast('Bloco encerrado.','Pausa do pomodoro começou.');}
    }else if(r.phase==='break'){
      const len=breakLen(r.breakKind);
      if(!r.excCob&&n-r.phaseStart>len){r.excCob=addCob({type:'excedente',title:breakName(r.breakKind),kind:r.breakKind,baseMin:len/MIN,amountMs:0,taskId:r.taskId});re=true;notify('pausa','A pausa acabou','Volte ao trabalho. Cada segundo agora vai para as cobranças.',t);}
      if(r.excCob){const c=cob(r.excCob);if(c)c.amountMs=n-r.phaseStart-len;}
    }else if(r.phase==='pause'){
      const lim=S.settings.pauseLimit*MIN;
      if(!r.limitCob&&n-r.phaseStart>lim){r.limitCob=addCob({type:'excedente',title:'Pausa · '+r.pauseCat,baseMin:lim/MIN,amountMs:0,taskId:r.taskId});re=true;toast('Limite de pausa estourado.','Virou cobrança de excedente.','bravo');}
      if(r.limitCob){const c=cob(r.limitCob);if(c)c.amountMs=n-r.phaseStart-lim;}
    }
  }
  if(!S.closed&&S.onboarded&&!S.day.pontoAsked&&n>=endOfDay()){S.day.pontoAsked=true;re=true;notify('ponto','Hora de bater o ponto',`O expediente acabou às ${S.settings.end}.`);toast(`${S.settings.end}. Hora de bater o ponto.`,'O botão está na barra lateral.','bravo');}
  if(re){save();render();}else updateTicks();
  if(Date.now()-lastSave>3000){lastSave=Date.now();save();}
}

function finishExcuse(skip){
  const e=S.ui.exc;const c=cob(e.cobId);if(!c)return;
  if(skip){e.se='';e.faco='';}
  const v=verdictOf(c,e);
  c.status='explicada';c.excuse={cat:e.cat,relato:e.relato.trim(),se:(e.se||'').trim(),faco:(e.faco||'').trim()};c.verdict=v.v;c._rep=v.rep;c.explainedAt=now();

    if(c.change.kind==='estimativa'){applied=`Mudança aplicada: estimativa ${fmtMin(t.est)} → ${fmtMin(c.change.to)}.`;t.est=c.change.to;}
    else if(c.change.kind==='tolerancia'){applied=`Mudança aplicada: tolerância ${t.tol} min → ${c.change.to} min.`;t.tol=c.change.to;}
    else if(c.change.kind==='excluir'){applied='Tarefa excluída do plano.';t.status='excluida';}
  }}
  if(c.pontoMove){const t=task(c.taskId);if(t){t.status='amanha';}if(S.ponto){S.ponto.decisions[c.taskId]='amanha';}applied='Tarefa levada para a fila de amanhã.';}
  S.ui.verd={cobId:c.id,t0:Date.now(),returnTo:e.returnTo,applied};S.ui.exc=null;
  if(S.ui.returnPonto&&!openCobs().length&&S.ponto){S.ponto.step=3;}
  go('veredito');
}
function openPonto(){

  else if(S.ponto.step==='bloqueio'&&!openCobs().length)S.ponto.step=3;
  S.ui.returnPonto=false;S.ui.corner=null;

}

  return n;
}

/* ================= roteiro: montar estados ================= */
function runAt(id,workMs,blockLeftMs,block){
  const t=task(id);t.status='exec';t.startedAt=now()-workMs-4*MIN;t.workMs=workMs;t.pomos=(block||1)-1;
  S.run={taskId:id,pomo:true,block:block||1,blockBase:workMs-(S.settings.pomo[0]*MIN-blockLeftMs),phase:'work',phaseStart:now(),estWarned:workMs>t.est*MIN,lateCob:null,excCob:null,limitCob:null};
  return t;
}
function stage(id){
  S=seed();S.onboarded=true;S.route='prancheta';S.ui={};
  const setClock=(h,m)=>{S.clock.sim=at(h,m);S.clock.real=Date.now();};
  let after=null;
  switch(id){
    case '5·1':S.onboarded=false;S.route='welcome';break;
    case '5·2':S.onboarded=false;S.route='regras';break;
    case '1·5':break;
    case '1·6':S.ui.panel=newPanel({title:'Preparar pauta da reunião',est:45});break;
    case '1·6n':S.ui.panel=newPanel({title:'Preparar pauta da reunião',est:45,notify:true});S.ui.browserPrompt=true;break;
    case '1·8':{const t=createTask('Preparar pauta da reunião',45,30,true);S.ui.panel={kind:'nova',signed:t.id,st0:Date.now()};break;}
    case '1·9':S.ui.panel={kind:'tarefa',id:'t2',alert:'estimativa',val:120,t0:Date.now()};break;
    case '1·5p':S.ui.modal={kind:'paywall',t0:Date.now()};break;
    case '1·5s':S.pro=true;S.route='semana';break;
    case '1·7':{S.pro=true;S.route='semana';const k=today();S.ui.modal={kind:'naocabe',key:k,total:sum(dayItems(k),x=>x.est),t0:Date.now()};break;}
    case '2A·10':S.route='pressao';S.ui.sel='t3';break;
    case '2A·12':setClock(11,16);runAt('t3',31*MIN+51000,14*MIN+9000,2);S.route='foco';break;
    case '2A·13':setClock(11,36);runAt('t3',51*MIN+4000,8*MIN+22000,3);S.route='foco';break;
    case '2A·11':{setClock(12,2);const t=runAt('t3',76*MIN+4000,8*MIN+22000,4);S.run.lateCob=addCob({type:'atraso',taskId:t.id,title:t.title,at:now()-60000});S.ui.corner=S.run.lateCob;S.ui.cornerO={t0:Date.now()};S.route='foco';break;}
    case '2A·14':setClock(11,22);runAt('t3',36*MIN,1000,2);toBreak();S.run.phaseStart=now()-(5*MIN-(3*MIN+41000));S.route='foco';break;
    case '2A·14e':{setClock(11,27);runAt('t3',36*MIN,1000,2);toBreak();S.run.phaseStart=now()-(5*MIN+2*MIN+14000);S.run.excCob=addCob({type:'excedente',title:'Café Expresso',kind:'curta',baseMin:5,amountMs:2*MIN+14000,taskId:'t3',at:now()-134000});S.route='foco';break;}
    case '2A·15':setClock(11,16);runAt('t3',31*MIN+51000,14*MIN+9000,2);S.route='foco';S.ui.modal={kind:'pausar',cat:'Interrupção externa',note:'Cliente ligou',t0:Date.now()};break;
    case '2A·16':setClock(11,20);runAt('t3',31*MIN+51000,14*MIN+9000,2);pauseTask('Interrupção externa','Cliente ligou');S.run.phaseStart=now()-(3*MIN+36000);S.route='foco';break;
    case '2B·17':setClock(11,16);runAt('t3',31*MIN+51000,10*MIN+15000,2);S.route='foco';S.ui.modal={kind:'registro',tab:'interrupcao',type:'Pessoa',note:'Rafael do financeiro pediu o arquivo de setembro',t0:Date.now()};break;
    case '2B·18':{setClock(11,41);const t=task('t3');Object.assign(t,{status:'entregue',workMs:57*MIN,startedAt:at(10,30),deliveredAt:now(),pomos:3,pauseCount:1,pauseMs:3*MIN+36000,intr:1});S.pauses.push({at:at(11,5),cat:'Interrupção externa',note:'Cliente ligou',ms:3*MIN+36000,taskId:'t3'});S.interrupts.push({at:at(10,50),type:'Pessoa',note:'Rafael do financeiro pediu o arquivo de setembro',taskId:'t3'});S.ui.lastDelivered='t3';S.route='entrega';break;}
    case '2B·18z':setClock(16,48);['t1','t2','t3','t4'].forEach((k,i)=>{const t=task(k);Object.assign(t,{status:'entregue',workMs:t.est*MIN*(1+i*.07),startedAt:at(10+i*1,30),deliveredAt:at(11+i,25),pomos:Math.ceil(t.est/25)});});S.route='pressao';break;
    case '2B·19':setClock(11,16);runAt('t3',31*MIN+51000,14*MIN+9000,2);S.route='pressao';after=()=>A.umaDeCada();break;
    case '3·20':case '3·21a':case '3·21b':case '3·21c':case '3·22':{
      setClock(17,20);const t1=task('t1');Object.assign(t1,{status:'entregue',workMs:192*MIN,startedAt:at(10,5),deliveredAt:at(13,30),pomos:7});
      addCob({type:'atraso',taskId:'t1',title:t1.title,at:at(12,35)});
      const t4=task('t4');t4.status='abandonada';addCob({type:'abandono',taskId:'t4',title:t4.title,at:at(16,30)});
      S.route='cobrancas';
      const atr=S.cobs.find(c=>c.type==='atraso'&&c.taskId==='t1');S.ui.cobSel=atr.id;
      if(id!=='3·20'){S.ui.exc={cobId:atr.id,step:1,cat:id==='3·21a'?null:'Interrupção externa',relato:'',se:'',faco:'',returnTo:null};S.route='desculpa';}
      if(id==='3·21b'||id==='3·21c'||id==='3·22'){S.ui.exc.step=2;S.ui.exc.relato='O cliente ligou duas vezes pedindo ajuste no escopo e precisei refazer a seção 3 antes de seguir com o relatório.';}
      if(id==='3·21c'||id==='3·22'){S.ui.exc.step=3;S.ui.exc.se='o cliente ligar no meio do foco';S.ui.exc.faco='anoto, retorno no fim do pomodoro e ajusto a estimativa';}
      if(id==='3·22'){save();finishExcuse(false);return;}
      break;}
    case '3·23':S.route='historico';break;
    case '4·24':case '4·25':case '4·26':case '4·27':case '4·27b':{
      setClock(18,4);S.day.pontoAsked=true;
      [['t3',57],['t1',150]].forEach(([k,m],i)=>{const t=task(k);Object.assign(t,{status:'entregue',workMs:m*MIN,startedAt:at(10+i*2,10),deliveredAt:at(11+i*3,0),pomos:Math.ceil(m/25)});});
      const t2=task('t2');t2.workMs=40*MIN;t2.startedAt=at(15,0);t2.stoppedAt=at(15,40);
      S.breaks.push({at:at(10,35),kind:'curta',ms:5*MIN,excMs:0,taskId:'t3'},{at:at(12,40),kind:'longa',ms:15*MIN,excMs:0,taskId:'t1'});
      S.pauses.push({at:at(11,5),cat:'Interrupção externa',note:'Cliente ligou',ms:3*MIN+36000,taskId:'t3'},{at:at(13,10),cat:'Reunião',note:'',ms:14*MIN,taskId:'t1'});
      S.ponto={step:1,decisions:{},pendCob:{},refl:'',openedAt:now()};S.route='ponto';
      if(id==='4·25')S.ponto.step=2;
      if(id==='4·26'){const ta=task('t4');ta.status='abandonada';addCob({type:'abandono',taskId:'t4',title:ta.title});S.ponto.decisions.t4='abandonada';const t2b=task('t2');t2b.status='amanha';S.ponto.decisions.t2='amanha';S.ponto.step='bloqueio';}
      if(id==='4·27'||id==='4·27b'){S.cobs.forEach(c=>{if(c.status==='aberta'){c.status='explicada';c.verdict='tolerada';c.explainedAt=now();c.excuse={cat:'Interrupção externa',relato:'Explicada durante o dia.',se:'',faco:''};}});task('t2').status='amanha';task('t4').status='amanha';S.ponto.step=3;S.ponto.refl='Manhã perdida com o cliente. A tarde rendeu. Amanhã começo pelo jurídico.';}
      if(id==='4·27b'){const st=statsToday();S.closed={at:at(18,11),p:st.p,e:st.e,verdict:dayVerdict(st).v};S.clock.sim=at(18,11);S.clock.real=Date.now();S.reflections.push({at:now(),text:S.ponto.refl});S.ui.punchT0=Date.now();S.route='batido';}
      break;}
    case '28':S.route='dossie';break;
    case '29':S.pro=true;S.route='expediente';break;
  }
  S.ui._top=true;save();render();if(after)after();
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.disabled||el.getAttribute('aria-disabled')==='true')return;
  const fn=A[el.dataset.act];if(!fn)return;
  e.preventDefault();fn(el.dataset.arg,el,e);
});
document.addEventListener('input',e=>{
  const el=e.target;const path=el.dataset&&el.dataset.model;if(!path)return;
  let v=el.value;if(el.hasAttribute('data-num'))v=Number(v);
  setPath(path,v);render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.ui.browserPrompt){A.perm('denied');return;}
    if(S.ui.demo){A.demoClose();return;}
    if(S.ui.modal){A.closeModal();return;}
    if(S.ui.panel){A.fecharPainel();return;}
    return;
  }
  const t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();const fn=A[t.dataset.enter];if(fn)fn();return;}
  if(e.key==='Enter'&&t.matches&&t.matches('tr[data-act]')){e.preventDefault();A[t.dataset.act](t.dataset.arg,t);return;}
  if(t.closest&&t.closest('input,textarea,select'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.route==='foco'&&S.run&&S.run.phase==='work'&&!S.ui.modal&&!S.ui.panel){
    const k=e.key.toLowerCase();
    if(k==='e'){e.preventDefault();A.entregar();}else if(k==='p'){e.preventDefault();A.desculpa();}else if(k==='i'){e.preventDefault();A.registro();}
  }
});

/* ================= início ================= */
load();
if(!S.onboarded&&S.route!=='regras')S.route='welcome';
if(S.route==='foco'&&!S.run)S.route='pressao';
const hash=(location.hash||'').replace('#','');
if(hash){const all=SCREENS.flatMap(g=>g[1].map(x=>x[0]));const id=all.find(x=>x.replace('·','-').toLowerCase()===hash.toLowerCase());if(id)stage(id);}
render();
setInterval(tick,250);
})();
</script>
