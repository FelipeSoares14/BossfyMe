<title>BOSSFYME</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@1,400;1,500&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: barra lateral escura de relógio de ponto + mesa de papel de escritório; fichas e carimbos de repartição */
:root{
  --paper:#ECEEE8; --sheet:#F9FAF6; --sheet-2:#F1F3ED; --ink:#151A24; --ink-2:#4B5263; --ink-3:#7A8191;
  --rule:#D3D7CE; --rule-2:#B7BCB1;
  --pen:#2442B0; --pen-soft:#DFE5F8; --pen-ink:#FFFFFF;
  --stamp:#C4302A; --stamp-soft:#F7E0DC;
  --amber:#9A6205; --amber-soft:#F5E6C2;
  --ok:#2A7148; --ok-soft:#D9ECDD;
  --manila:#E2C675; --manila-ink:#3B300F;
  --side:#151A24; --side-2:#1F2633; --side-fg:#E6E9E1; --side-dim:#8E96A6; --side-rule:#2D3544;
  --scrim:rgba(21,26,36,.45);
  --shadow:0 1px 0 rgba(21,26,36,.05),0 18px 40px -18px rgba(21,26,36,.38);
  --face-bg:#E2C675; --skin:#E8B793; --skin-2:#D39B76; --hair:#A3A8AF; --hair-dark:#2F343E; --suit:#2B3243; --shirt:#F5F6F1; --frame:#151A24;
  --f-disp:'Archivo','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-voice:'IBM Plex Serif',Georgia,'Times New Roman',serif;
  --f-sign:'Mrs Saint Delafield','Brush Script MT',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141B; --sheet:#181D27; --sheet-2:#1E2430; --ink:#E8EBE4; --ink-2:#AAB1BF; --ink-3:#808899;
    --rule:#2A3140; --rule-2:#3B4354;
    --pen:#93A9FF; --pen-soft:#1F2A52; --pen-ink:#0E1220;
    --stamp:#FF6E60; --stamp-soft:#3A1D1E; --amber:#F0B44A; --amber-soft:#382B12; --ok:#6CCB92; --ok-soft:#14301F;
    --manila:#CDB062;
    --side:#090C11; --side-2:#141922; --side-fg:#E6E9E1; --side-dim:#7F8796; --side-rule:#222936;
    --scrim:rgba(0,0,0,.62); --shadow:0 18px 40px -18px rgba(0,0,0,.8);
    --face-bg:#CDB062; --suit:#3A4357;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141B; --sheet:#181D27; --sheet-2:#1E2430; --ink:#E8EBE4; --ink-2:#AAB1BF; --ink-3:#808899;
  --rule:#2A3140; --rule-2:#3B4354;
  --pen:#93A9FF; --pen-soft:#1F2A52; --pen-ink:#0E1220;
  --stamp:#FF6E60; --stamp-soft:#3A1D1E; --amber:#F0B44A; --amber-soft:#382B12; --ok:#6CCB92; --ok-soft:#14301F;
  --manila:#CDB062;
  --side:#090C11; --side-2:#141922; --side-fg:#E6E9E1; --side-dim:#7F8796; --side-rule:#222936;
  --scrim:rgba(0,0,0,.62); --shadow:0 18px 40px -18px rgba(0,0,0,.8);
  --face-bg:#CDB062; --suit:#3A4357;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pen)}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.app.is-onb{grid-template-columns:minmax(0,1fr)}
.app.is-onb .side,.app.is-onb .topbar,.app.is-onb .tabbar{display:none}
.side{grid-row:1;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:6px;padding-block:22px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.main{grid-row:1;overflow-y:auto;overflow-x:hidden;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px))}
.app.is-onb .main{grid-column:1}
.topbar,.tabbar{display:none}

.wm{font:900 22px/1 var(--f-disp);font-stretch:68%;letter-spacing:.02em;display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
.wm b{font-weight:900;color:var(--stamp);border:2px solid currentColor;border-radius:3px;padding:2px 3px 1px;margin-left:3px;transform:rotate(-5deg);display:inline-block;font-size:.8em;line-height:1}
.side .wm{font-size:26px;color:var(--side-fg)}
.side .wm b{color:var(--stamp)}
.side-boss{display:flex;gap:10px;align-items:center;padding:14px 0 16px;border-bottom:1px solid var(--side-rule);margin-bottom:10px}
.side-boss .face{width:40px;height:40px}
.side-boss strong{display:block;font:600 14px/1.2 var(--f-body)}
.side-boss small{font:500 11px/1.3 var(--f-mono);color:var(--side-dim);display:flex;align-items:center;gap:6px}
.side-boss small i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.nav{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:7px;color:var(--side-dim);text-decoration:none;font:500 15px/1 var(--f-body);transition:background .15s,color .15s}
.nav .ic{width:19px;height:19px}
.nav:hover{color:var(--side-fg);background:var(--side-2)}
.nav.on{color:var(--side-fg);background:var(--side-2)}
.nav.on .ic{color:var(--manila)}
.nav span:first-of-type{flex:1}
.badge{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--stamp);color:#fff;font:600 11px/20px var(--f-mono);text-align:center}
.nav-live{font:600 12px/1 var(--f-mono);color:var(--manila);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.punch{border:1px dashed var(--side-rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.punch-row{display:flex;justify-content:space-between;gap:8px;font:500 12px/1.3 var(--f-mono);color:var(--side-dim)}
.punch-row b{color:var(--side-fg);font-weight:600}
.btn-punch{width:100%;min-height:46px;background:var(--side-fg);color:var(--side);border:0;border-radius:7px;font:800 17px/1 var(--f-disp);font-stretch:80%;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-punch:hover{background:#fff}
.btn-punch.due{background:var(--stamp);color:#fff;animation:pulse 2s infinite}
.btn-punch:disabled{background:var(--side-2);color:var(--side-dim);cursor:default;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,48,42,.5)}50%{box-shadow:0 0 0 6px rgba(196,48,42,0)}}

/* ---------- type ---------- */
.label{font:600 11px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow{font:500 13px/1.3 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.h1{font:800 clamp(34px,4.4vw,52px)/.98 var(--f-disp);font-stretch:72%;letter-spacing:-.005em}
.h2{font:750 clamp(24px,2.6vw,30px)/1.08 var(--f-disp);font-stretch:82%}
.h3{font:600 17px/1.3 var(--f-body)}
.display{font:850 clamp(44px,7vw,84px)/.92 var(--f-disp);font-stretch:66%;letter-spacing:-.01em}
.lead{font-size:18px;line-height:1.5;color:var(--ink-2);max-width:56ch}
.sub{color:var(--ink-2)}
.fine{font-size:13px;line-height:1.45;color:var(--ink-3)}
.note{font-size:13.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- primitives ---------- */
.ic{width:20px;height:20px;flex:none}
.ic-s{width:16px;height:16px;flex:none}
.ic-xs{width:12px;height:12px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:7px;border:1.5px solid transparent;font:600 14.5px/1.1 var(--f-body);text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s;background:none}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover:not(:disabled){background:var(--ink-2)}
.btn-pen{background:var(--pen);color:var(--pen-ink)}
.btn-pen:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{border-color:var(--rule-2);color:var(--ink)}
.btn-ghost:hover:not(:disabled){background:var(--sheet-2);border-color:var(--ink-3)}
.btn-danger{border-color:var(--rule-2);color:var(--stamp)}
.btn-danger:hover:not(:disabled){background:var(--stamp-soft);border-color:var(--stamp)}
.btn-link{min-height:34px;padding:0 2px;color:var(--pen);border:0}
.btn-link:hover{text-decoration:underline}
.btn-lg{min-height:54px;padding:0 24px;font-size:16px;border-radius:9px}
.btn-sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:6px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
kbd{font:500 11px/1 var(--f-mono);border:1px solid currentColor;border-radius:4px;padding:2px 5px;opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stamp{display:inline-flex;align-items:center;gap:5px;font:700 12px/1.15 var(--f-disp);font-stretch:85%;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:3px;padding:3px 7px 2px;color:var(--ink-2);white-space:nowrap;width:fit-content}
.s-red{color:var(--stamp)} .s-amber{color:var(--amber)} .s-ok{color:var(--ok)} .s-pen{color:var(--pen)}
.s-ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stamp.big{font-size:15px;padding:5px 10px 4px;transform:rotate(-2deg)}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:7px;border:1.5px solid var(--rule-2);background:var(--sheet);font:500 14px/1 var(--f-body);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.switch{width:46px;height:27px;border-radius:14px;background:var(--rule-2);border:0;position:relative;flex:none;transition:background .15s}
.switch i{position:absolute;top:3.5px;left:3.5px;width:20px;height:20px;border-radius:50%;background:var(--sheet);transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--pen)}
.switch[aria-checked="true"] i{transform:translateX(19px)}
.switch-row{display:flex;gap:16px;align-items:center;justify-content:space-between}
.switch-row strong{display:block;font-weight:600}
.switch-row p{font-size:13.5px;color:var(--ink-3)}

.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.flabel{font:600 13px/1.3 var(--f-body);color:var(--ink-2)}
.input{width:100%;min-height:46px;border:1.5px solid var(--rule-2);border-radius:7px;background:var(--sheet);padding:0 13px;font-size:15.5px}
.input:focus{border-color:var(--pen);outline:none;box-shadow:0 0 0 3px var(--pen-soft)}
textarea.input{padding:12px 13px;min-height:132px;resize:vertical;line-height:1.55}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.hint{font-size:13.5px;color:var(--ink-3);line-height:1.45}
.hint b{color:var(--ink);font-weight:600}
.inline{display:flex;align-items:center;gap:10px}
.input-sm{max-width:110px}

/* boss voice */
.boss{display:flex;gap:12px;align-items:flex-start;min-width:0}
.face{width:46px;height:46px;border-radius:9px;flex:none;display:block}
.face-sm{width:34px;height:34px;border-radius:7px}
.face-xl{width:132px;height:132px;border-radius:18px}
.face-hero{width:min(300px,62vw);height:auto;aspect-ratio:1;border-radius:22px}
.boss-say{background:var(--sheet);border:1px solid var(--rule);border-radius:3px 12px 12px 12px;padding:10px 14px 11px;min-width:0}
.boss-name{display:block;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.boss-say p{font:italic 400 16.5px/1.42 var(--f-voice);margin-top:3px;color:var(--ink)}
.boss-lg .boss-say p{font-size:21px}
.boss-lg .face{width:58px;height:58px}

/* ---------- views ---------- */
.view{max-width:1180px;margin:0 auto;padding-block:34px 88px;display:flex;flex-direction:column;gap:26px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:18px 24px;flex-wrap:wrap}
.vh-l{display:flex;flex-direction:column;gap:8px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.col-main,.col-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 2px 0}
.list-head .label{display:inline-flex;align-items:center;gap:5px}

.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:8px 16px;font:600 14px/1.15 var(--f-body);display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font:500 11px/1.2 var(--f-mono);color:var(--ink-3);display:flex;align-items:center;gap:4px}
.seg button span{display:flex;align-items:center;gap:5px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-selected="true"] small{color:var(--paper);opacity:.7}
.seg-sm{border-width:1.5px;border-color:var(--rule-2)}
.seg-sm button{padding:7px 14px;font-size:13.5px}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:9px;padding:14px 16px 14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;transition:border-color .15s,transform .15s;position:relative}
.task:hover{border-color:var(--ink-3)}
.task>.stamp{grid-column:1}
.task-title{grid-column:1;font:600 17px/1.3 var(--f-body);color:var(--ink)}
.task-meta{grid-column:1;font:500 12.5px/1.3 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.task .chevron{grid-column:2;grid-row:1/4;color:var(--ink-3)}
.task.is-done{background:transparent}
.task.is-done .task-title{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.task.is-sel{border:1.5px solid var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.task.is-run{border:1.5px solid var(--pen);background:var(--pen-soft)}
.task.is-run .task-title{color:var(--ink)}

.empty{border:1.5px dashed var(--rule-2);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.locked{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border:1.5px dashed var(--rule-2);border-radius:10px;color:var(--ink-2)}
.locked:hover{border-color:var(--pen);color:var(--ink)}
.locked:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px}
.locked strong{display:block;font-weight:600;color:var(--ink);font-size:14.5px}
.locked small{display:block;font-size:13px;color:var(--ink-3)}

.meter{height:8px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink-2)}
.meter.over i{background:var(--stamp)}
.cap-num{font:800 30px/1 var(--f-disp);font-stretch:75%;font-variant-numeric:tabular-nums}
.cap-num span{color:var(--ink-3);font-weight:600}

.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:9px;background:var(--sheet-2);border:1px solid var(--rule);font-size:14.5px}

/* kv lists */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:9px;overflow:hidden;margin:0}
.kv>div{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.kv dd{margin:0;font-weight:600;font-size:15.5px}
.kv-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv .wide{grid-column:1/-1}

/* panel + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.scrim.enter{animation:fade .2s ease-out}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--paper);border-left:1px solid var(--rule);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.enter{animation:slideIn .3s cubic-bezier(.2,.8,.2,1)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px 14px 24px;border-bottom:1px solid var(--rule)}
.panel-body{flex:1;overflow-y:auto;padding:26px 24px;display:flex;flex-direction:column;gap:22px}
.panel-foot{padding:16px 24px;border-top:1px solid var(--rule);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--sheet)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--paper);border:1px solid var(--rule);border-radius:14px;z-index:51;box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;gap:18px}
.modal.enter{animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-sm{width:min(420px,calc(100% - 32px))}
@keyframes fade{from{opacity:0}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.97);opacity:0}}

.perm{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet-2)}
.alert-box{display:flex;flex-direction:column;gap:12px;padding:16px;border:1.5px solid var(--stamp);border-radius:10px;background:var(--stamp-soft)}
.alert-box .boss-say{background:var(--sheet)}
.alert-box strong{font-size:16px}

.sigline{display:flex;flex-direction:column;gap:2px;border-bottom:1.5px solid var(--ink);padding-bottom:6px;max-width:320px}
.sig{width:220px;height:62px;color:var(--pen)}
.sig path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sig.draw path{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.1s .15s ease-out forwards}
.sig.draw path+path{animation-delay:1s;animation-duration:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
.sigline span{font:500 11.5px/1.3 var(--f-mono);color:var(--ink-3);padding-top:4px}

/* browser prompt (simulado) */
.bprompt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:min(360px,calc(100% - 24px));background:var(--sheet);color:var(--ink);border:1px solid var(--rule-2);border-radius:12px;box-shadow:var(--shadow);z-index:80;padding:16px;display:flex;flex-direction:column;gap:12px;animation:pop2 .2s ease-out}
@keyframes pop2{from{transform:translateY(-8px);opacity:0}}
.bprompt p{font-size:15px;display:flex;gap:10px;align-items:center}

/* pressão */
.detail .h2{font-size:26px}
.foco-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:start}
.foco-main{display:flex;flex-direction:column;gap:20px;align-items:flex-start;min-width:0;padding-top:6px}
.foco-title{font:750 clamp(26px,3.2vw,38px)/1.1 var(--f-disp);font-stretch:85%}
.timer{font:850 clamp(96px,15vw,188px)/.86 var(--f-disp);font-stretch:66%;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer-xl{font-size:clamp(110px,20vw,220px)}
.is-frozen{color:var(--ink-3);opacity:.6}
.pomo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font:500 14px/1.3 var(--f-mono);color:var(--ink-2)}
.dots{display:inline-flex;gap:5px}
.dots i{width:22px;height:8px;border-radius:2px;border:1.5px solid var(--ink-3);display:block}
.dots i.done{background:var(--ink-3)}
.dots i.cur{border-color:var(--pen);background:var(--pen)}
.foco-actions{display:flex;gap:12px;flex-wrap:wrap}
.quip{font:italic 400 16px/1.4 var(--f-voice);color:var(--ink-2)}
.alarm{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;border:1.5px solid;flex-wrap:wrap}
.alarm p{flex:1;min-width:200px;font:italic 400 17px/1.4 var(--f-voice)}
.alarm-who{display:block;font:600 10.5px/1.3 var(--f-mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.alarm-over{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.alarm-late{background:var(--stamp-soft);border-color:var(--stamp);color:var(--ink)}
.stats{margin:0;display:flex;flex-direction:column}
.stats>div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.stats>div:last-child{border-bottom:0}
.stats dt{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stats dd{margin:0;font:750 22px/1 var(--f-disp);font-stretch:80%;font-variant-numeric:tabular-nums;text-align:right}
.stats small{grid-column:1/-1;font:500 12px/1.3 var(--f-mono);color:var(--ink-3);text-align:right}
.foco-over .st-remain dd{color:var(--amber)}
.foco-late .st-remain dd{color:var(--stamp)}
.track{position:relative;display:flex;gap:3px;height:10px;margin-top:4px}
.track-est{background:var(--rule-2);border-radius:3px}
.track-tol{border-radius:3px;background:repeating-linear-gradient(-45deg,var(--amber) 0 2px,transparent 2px 5px);border:1px solid var(--amber)}
.track-fill{position:absolute;left:0;top:0;bottom:0;background:var(--pen);border-radius:3px;opacity:.85;transition:width .25s linear}
.foco-late .track-fill{background:var(--stamp)}
.track-legend{display:flex;justify-content:space-between;font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.log li{display:flex;gap:8px}
.log time{font:500 12px var(--f-mono);color:var(--ink-3);flex:none}
.limit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.limit strong{font:800 40px/1 var(--f-disp);font-stretch:70%;font-variant-numeric:tabular-nums;color:var(--amber)}

.center-view{align-items:center;text-align:center;justify-content:center;min-height:100%}
.center-view .boss{text-align:left}
.pausa{max-width:720px;margin:0 auto;align-items:center;text-align:center;padding-top:56px}
.pausa .boss{text-align:left}
.pausa.is-exc .timer{color:var(--stamp)}

/* cobrancas */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--rule)}
.tabs button{border:0;background:none;padding:10px 14px;font:600 15px/1 var(--f-body);color:var(--ink-3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.count{font:600 11px/18px var(--f-mono);min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--stamp);color:#fff;text-align:center}
.cob{width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:9px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.cob:hover{border-color:var(--ink-3)}
.cob[aria-pressed="true"]{border:1.5px solid var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cob-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cob time{font:500 12.5px var(--f-mono);color:var(--ink-3)}
.cob strong{font-size:16px;font-weight:600}
.cob small{font-size:13.5px;color:var(--ink-3)}

.steps{display:flex;align-items:center;gap:10px;font:500 13px var(--f-mono);color:var(--ink-3)}
.steps i{width:28px;height:4px;border-radius:2px;background:var(--rule-2);display:block}
.steps i.on{background:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{text-align:left;min-height:60px;padding:12px 16px;border-radius:9px;border:1.5px solid var(--rule-2);background:var(--sheet);font:600 15.5px/1.3 var(--f-body);display:flex;align-items:center;gap:12px}
.opt::before{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none}
.opt[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-checked="true"]::before{border:5.5px solid var(--ink)}
.opt:hover{border-color:var(--ink-3)}
.plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.verdicts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:18px 0 8px}
.vstamp{font:850 clamp(28px,4.4vw,44px)/1 var(--f-disp);font-stretch:72%;letter-spacing:.07em;padding:12px 20px 9px;border:3px solid currentColor;border-radius:7px;color:var(--rule-2);transform:rotate(-4deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px currentColor}
.vstamp:nth-child(2){transform:rotate(2deg)}
.vstamp:nth-child(3){transform:rotate(-1deg)}
.vstamp.is-on.v-tolerada{color:var(--ok)}
.vstamp.is-on.v-suspeita{color:var(--amber)}
.vstamp.is-on.v-rejeitada{color:var(--stamp)}
.vstamp:not(.is-on){opacity:.5}
.slam{animation:slam .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{0%{transform:scale(2.2) rotate(-12deg);opacity:0}55%{opacity:1}100%{opacity:1}}

.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
table.data{width:100%;border-collapse:collapse;min-width:660px}
table.data th{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:13px 16px;border-bottom:1px solid var(--rule)}
table.data td{padding:14px 16px;border-bottom:1px solid var(--rule);font-size:14.5px;vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover,table.data tbody tr:focus-visible{background:var(--sheet-2)}
table.data td.when{font:500 13px var(--f-mono);color:var(--ink-2);white-space:nowrap}

/* ponto */
.ledger{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.ledger>div{padding:16px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ledger>div:nth-child(odd){border-right:1px solid var(--rule)}
.ledger>div.full{grid-column:1/-1;border-right:0}
.ledger dt{font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ledger dd{margin:0;font:800 28px/1 var(--f-disp);font-stretch:74%;font-variant-numeric:tabular-nums}
.ledger dd small{font:500 13px var(--f-mono);color:var(--ink-3);margin-left:4px}
.pend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:16px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.pend strong{display:block;font-size:16px}
.pend small{font:500 12.5px var(--f-mono);color:var(--ink-3)}
.timecard{width:min(380px,100%);background:var(--sheet);border:1px solid var(--rule-2);border-radius:5px;padding:30px 22px 22px;position:relative;text-align:left;box-shadow:var(--shadow);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);background-position:0 70px}
.timecard::before{content:"";position:absolute;top:10px;left:50%;width:46px;height:10px;margin-left:-23px;border-radius:5px;background:var(--paper);border:1px solid var(--rule-2)}
.tc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.tc-head .wm{font-size:18px}
table.tc{width:100%;border-collapse:collapse}
table.tc th{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;height:36px}
table.tc td{font:600 16px var(--f-mono);text-align:right;height:36px;font-variant-numeric:tabular-nums}
.tc-stamp{display:inline-block;color:var(--stamp);border:2px solid currentColor;border-radius:4px;padding:1px 8px;transform:rotate(-6deg);font:700 20px/1.2 var(--f-mono)}
.punch-in{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
.punch-in .tc-stamp{animation:slam .5s .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardIn{from{transform:translateY(-36px);opacity:0}}

/* onboarding */
.onb{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.onb-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center;max-width:1060px}
.onb-portrait{display:flex;flex-direction:column;align-items:center;gap:0}
.nameplate{background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:4px;font:700 15px/1.2 var(--f-disp);font-stretch:85%;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-top:-18px;position:relative;box-shadow:var(--shadow)}
.nameplate small{display:block;font:500 10.5px/1.4 var(--f-mono);letter-spacing:.08em;opacity:.7}
.onb-copy{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.memo{width:min(760px,100%);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:38px clamp(20px,5vw,58px) 42px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px}
.memo-head{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:3px double var(--ink);padding-bottom:12px}
.memo-head .label{color:var(--stamp)}
.memo-meta{font:500 12px/1.4 var(--f-mono);color:var(--ink-3)}
.rules{list-style:none;margin:0;padding:0;counter-reset:r;display:flex;flex-direction:column}
.rules li{counter-increment:r;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rule);font:500 18px/1.4 var(--f-body)}
.rules li::before{content:counter(r) ".";font:850 30px/1 var(--f-disp);font-stretch:70%;color:var(--stamp)}
.memo-sign{display:flex;flex-direction:column;gap:0;align-self:flex-end;align-items:flex-end}
.memo-sign .sigf{font:400 52px/1 var(--f-sign);color:var(--pen);transform:rotate(-4deg)}
.memo-sign span{font:500 12px var(--f-mono);color:var(--ink-3);border-top:1.5px solid var(--ink);padding-top:4px}

/* semana */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.day{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.is-today{border:1.5px solid var(--ink)}
.day.is-past{background:transparent}
.day-h{display:flex;flex-direction:column;gap:6px}
.day-name{font:750 18px/1 var(--f-disp);font-stretch:82%;display:flex;justify-content:space-between;align-items:center;gap:6px}
.day-load{font:500 12px/1 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.day.is-over .day-load{color:var(--stamp);font-weight:600}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pi{display:flex;gap:6px;align-items:center;padding:8px 9px;border-radius:6px;border:1.5px solid var(--rule-2);font-size:13.5px;line-height:1.25;min-width:0}
.pi>span:first-of-type{flex:1;min-width:0}
.pi.draft{border-style:dashed;background:transparent}
.pi.signed{background:var(--sheet-2);border-color:var(--rule)}
.pi.done span:first-of-type{text-decoration:line-through;color:var(--ink-3)}
.pi-est{font:500 11.5px var(--f-mono);color:var(--ink-3);flex:none}
.pi-x{border:0;background:none;color:var(--ink-3);width:22px;height:22px;border-radius:4px;flex:none;font-size:16px;line-height:1}
.pi-x:hover{background:var(--stamp-soft);color:var(--stamp)}
.add{border:1.5px dashed var(--rule-2);background:none;border-radius:6px;min-height:36px;font-size:13.5px;color:var(--ink-3)}
.add:hover{color:var(--ink);border-color:var(--ink-3)}
.addf{display:flex;flex-direction:column;gap:6px}
.addf .input{min-height:38px;font-size:14px}
.month{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mcell{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.mcell.out{opacity:.35}
.mcell.is-today{border:1.5px solid var(--ink)}
.mcell b{font:750 18px/1 var(--f-disp);font-stretch:80%}
.mcell small{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.mhead{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 4px}

/* dossiê */
.folder{position:relative;background:var(--manila);color:var(--manila-ink);border-radius:0 12px 12px 12px;padding:22px 24px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:18px}
.folder::before{content:attr(data-tab);position:absolute;left:0;bottom:100%;background:var(--manila);color:var(--manila-ink);border-radius:9px 9px 0 0;padding:6px 16px 4px;font:600 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.folder .h1{color:var(--manila-ink)}
.folder .eyebrow{color:var(--manila-ink);opacity:.75}
.folder .seg{border-color:var(--manila-ink);background:transparent}
.folder .seg button{color:var(--manila-ink)}
.folder .seg button[aria-selected="true"]{background:var(--manila-ink);color:var(--manila)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--ink-3)}
.tile-num{font:850 36px/1 var(--f-disp);font-stretch:70%;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile-sub{font:500 12px/1.3 var(--f-mono);color:var(--ink-3)}
.tile-num.bad{color:var(--stamp)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.chart svg{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--rule);stroke-width:1}
.ch-out{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.ch-fill{fill:var(--ink)}
.ch-fill.today{fill:var(--pen)}
.ch-lbl{fill:var(--ink-3);font:500 11px var(--f-mono)}
.ch-val{fill:var(--ink-2);font:600 11.5px var(--f-mono)}
.ch-day{fill:var(--ink-2);font:600 12px var(--f-mono)}
.ch-day.today{fill:var(--pen)}
.legend{display:flex;gap:16px;font:500 12px var(--f-mono);color:var(--ink-3);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.lg-out{border:1.5px solid var(--ink-2);background:var(--sheet)}
.lg-fill{background:var(--ink)}
.hbars{display:flex;flex-direction:column;gap:11px}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13.5px}
.hb-track{height:12px;background:var(--sheet-2);border-radius:3px;overflow:hidden}
.hb-fill{height:100%;background:var(--ink-2);border-radius:3px}
.hb b{font:600 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.notes li:last-child{border-bottom:0}
.notes time{font:500 12px var(--f-mono);color:var(--ink-3);padding-top:2px}

/* expediente */
.setlist{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.setrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--rule);cursor:pointer}
.setrow:focus-visible{outline:2.5px solid var(--pen);outline-offset:-3px}
.setrow:hover{background:var(--sheet-2)}
.setrow:last-child{border-bottom:0}
.setrow .v{font:500 14px var(--f-mono);color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.setrow strong{font-weight:600}
.seted{padding:16px 18px;border-bottom:1px solid var(--rule);background:var(--sheet-2);display:flex;flex-direction:column;gap:12px}
.seted .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.togrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.togrow:last-child{border-bottom:0}

/* toasts / notifs / corner */
#toasts{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:11px 16px 11px 11px;border-radius:10px;display:flex;gap:11px;align-items:center;box-shadow:var(--shadow);max-width:min(380px,calc(100vw - 40px));animation:toastIn .25s ease-out;pointer-events:auto}
.toast .face{width:34px;height:34px;border-radius:7px}
.toast strong{display:block;font:600 14.5px/1.3 var(--f-body)}
.toast span{font-size:13px;opacity:.75}
.toast.out{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}}
@keyframes toastOut{to{transform:translateY(10px);opacity:0}}
#notifs{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:85;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ntf{width:min(340px,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--rule-2);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 11px;animation:ntfIn .3s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
.ntf-ic{grid-row:1/4;width:36px;height:36px;border-radius:8px;background:var(--side);color:var(--stamp);font:900 13px/36px var(--f-disp);font-stretch:70%;text-align:center}
.ntf small{font:500 11px var(--f-mono);color:var(--ink-3)}
.ntf strong{font-size:14.5px;line-height:1.3}
.ntf p{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.ntf.out{animation:toastOut .25s forwards}
@keyframes ntfIn{from{transform:translateX(30px);opacity:0}}

}

const QUIPS={
  prancheta:['Promessa boa é promessa assinada.','Lista bonita não entrega nada. Assina e executa.','Planejar é fácil. Quero ver cumprir.','Cada assinatura é uma promessa. Eu tenho boa memória.'],

function pick(k){const a=QUIPS[k];return a[(S.qs+k.length)%a.length];}
function task(id){return S.tasks.find(t=>t.id===id);}
function cob(id){return S.cobs.find(c=>c.id===id);}
function taskWork(t){const r=S.run;return t.workMs+(r&&r.taskId===t.id&&r.phase==='work'?now()-r.phaseStart:0);}
function workNow(){return S.run?taskWork(task(S.run.taskId)):0;}
function blockLeft(){const r=S.run;return S.settings.pomo[0]*MIN-(workNow()-r.blockBase);}
function breakLen(k){return (k==='longa'?S.settings.pomo[2]:S.settings.pomo[1])*MIN;}
function breakName(k){return k==='longa'?'Almoço Relâmpago':'Café Expresso';}
function queue(){const k=today();return S.tasks.filter(t=>t.day===k&&(t.status==='fila'||t.status==='exec')).sort((a,b)=>{const ra=S.run&&S.run.taskId===a.id?0:1,rb=S.run&&S.run.taskId===b.id?0:1;if(ra!==rb)return ra-rb;const oa=a.origin==='ontem'?0:1,ob=b.origin==='ontem'?0:1;if(oa!==ob)return oa-ob;return a.signedAt-b.signedAt;});}
function openCobs(){return S.cobs.filter(c=>c.status==='aberta').sort((a,b)=>a.at-b.at);}
function historyCobs(){return S.cobs.filter(c=>c.status==='explicada').sort((a,b)=>(b.explainedAt||b.at)-(a.explainedAt||a.at));}
function createTask(title,est,tol,notify,extra){const t=Object.assign({id:uid('t'),title,est,tol,notify,signedAt:now(),status:'fila',origin:'hoje',day:today(),workMs:0,freeMs:0,startedAt:null,deliveredAt:null,pomos:0,pauseMs:0,pauseCount:0,intr:0},extra||{});S.tasks.push(t);return t;}
function addCob(o){const c=Object.assign({id:uid('c'),at:now(),status:'aberta'},o);S.cobs.push(c);return c.id;}
function cobLine(c){
  const t=c.taskId&&task(c.taskId);
  if(c.type==='atraso'&&t)return `Estimativa ${fmtMin(t.est)} · real ${fmtMin(taskWork(t)/MIN)}`;
  if(c.type==='excedente')return `${c.title} de ${c.baseMin} min · +${minSec(c.amountMs||0)}`;
  if(c.type==='abandono')return 'Não entregue · abandonada no ponto';
  return c.detail||'';
}

function endPhase(){const r=S.run;if(!r)return;const t=task(r.taskId);if(r.phase==='work'){const dt=now()-r.phaseStart;t.workMs+=dt;if(!r.pomo)t.freeMs=(t.freeMs||0)+dt;}r.phaseStart=now();}
function startTask(id){
  const t=task(id);if(!t)return;
  t.status='exec';if(!t.startedAt)t.startedAt=now();
  const pomo=S.ui.pomoPref!==false;
  S.run={taskId:id,pomo,block:1,blockBase:t.workMs,phase:'work',phaseStart:now(),estWarned:t.workMs>t.est*MIN,lateCob:null,excCob:null,limitCob:null};
}
function toBreak(){endPhase();const r=S.run;const t=task(r.taskId);t.pomos++;r.phase='break';r.breakKind=r.block%4===0?'longa':'curta';r.excCob=null;}
function backFromBreak(){
  const r=S.run;const n=now();const ms=n-r.phaseStart;const len=breakLen(r.breakKind);
  S.breaks.push({at:r.phaseStart,kind:r.breakKind,ms,excMs:Math.max(0,ms-len),taskId:r.taskId});
  if(r.excCob){const c=cob(r.excCob);if(c)c.amountMs=Math.max(0,ms-len);}
  r.block=r.block%4+1;r.blockBase=task(r.taskId).workMs;r.phase='work';r.phaseStart=n;r.excCob=null;
}
function pauseTask(cat,note){endPhase();const r=S.run;r.phase='pause';r.pauseCat=cat;r.pauseNote=note;r.limitCob=null;}
function resumeTask(){
  const r=S.run;const n=now();const ms=n-r.phaseStart;const t=task(r.taskId);
  S.pauses.push({at:r.phaseStart,cat:r.pauseCat,note:r.pauseNote,ms,taskId:r.taskId});
  t.pauseCount++;t.pauseMs+=ms;
  if(r.limitCob){const c=cob(r.limitCob);if(c)c.amountMs=Math.max(0,ms-S.settings.pauseLimit*MIN);}
  r.phase='work';r.phaseStart=n;r.limitCob=null;
}
function stopRun(){
  const r=S.run;if(!r)return null;
  if(r.phase==='break')backFromBreak();
  else if(r.phase==='pause')resumeTask();
  const blockEl=workNow()-r.blockBase;
  endPhase();
  const t=task(r.taskId);
  if(r.pomo&&blockEl>60000)t.pomos++;
  S.run=null;return t;
}
function deliver(){const t=stopRun();if(!t)return;t.status='entregue';t.deliveredAt=now();S.ui.lastDelivered=t.id;S.ui.corner=null;}

function statsToday(){
  const k=today();
  const ts=S.tasks.filter(t=>t.day===k&&t.status!=='excluida');
  const del=ts.filter(t=>t.status==='entregue');
  const worked=ts.filter(t=>taskWork(t)>0);
  const real=sum(worked,t=>taskWork(t)),est=sum(worked,t=>t.est*MIN);
  const free=sum(worked,t=>(t.freeMs||0)+(S.run&&S.run.taskId===t.id&&S.run.phase==='work'&&!S.run.pomo?now()-S.run.phaseStart:0));
  const br=S.breaks.filter(b=>dayKey(b.at)===k);
  const pa=S.pauses.filter(p=>dayKey(p.at)===k);
  const exc=br.filter(b=>b.excMs>0).map(b=>b.excMs).concat(pa.filter(p=>p.ms>S.settings.pauseLimit*MIN).map(p=>p.ms-S.settings.pauseLimit*MIN));
  const cobsT=S.cobs.filter(c=>dayKey(c.at)===k);
  return {p:ts.length,e:del.length,estM:est/MIN,realM:real/MIN,pomoM:(real-free)/MIN,livreM:free/MIN,
    intr:S.interrupts.filter(i=>dayKey(i.at)===k).length,
    atrasos:cobsT.filter(c=>c.type==='atraso').length,aband:cobsT.filter(c=>c.type==='abandono').length,
    brN:br.length,brMs:sum(br,b=>b.ms),paN:pa.length,paMs:sum(pa,p=>p.ms),excN:exc.length,excMs:sum(exc)};
}
function verdictOf(c,e){
  let score=0;const plan=(e.se||'').trim().length>=4&&(e.faco||'').trim().length>=4;
  if(plan)score+=2;
  if((e.relato||'').trim().length>=80)score+=1;
  if(e.cat==='Fui fraco mesmo')score+=1;
  const wk=now()-7*24*60*MIN;
  const rep=S.cobs.filter(x=>x.status==='explicada'&&x.excuse&&x.excuse.cat===e.cat&&(x.explainedAt||x.at)>wk).length;
  if(rep>=3)score-=2;else if(rep>=2)score-=1;
  if((e.relato||'').trim().length<40&&!plan)score-=1;
  return {v:score>=2?'tolerada':score>=0?'suspeita':'rejeitada',rep,plan};
}
function verdictQuote(c){
  const e=c.excuse||{};const v=c.verdict;
  if(v==='tolerada'){
    if(e.cat==='Fui fraco mesmo')return 'Pelo menos é sincero. Passa.';
    if(e.cat==='Interrupção externa')return 'Interrupção, com plano para a próxima. Passa. Desta vez.';
    if(e.cat==='Estimativa errada')return 'Errou a conta e assumiu. Passa. Ajusta o relógio interno.';
    return 'Explicação aceita. Passa. Desta vez.';
  }
  if(v==='suspeita')return c._rep>=2?`${e.cat} de novo? Hmm. Essa eu já ouvi.`:'Hmm. Essa eu já ouvi.';
  return 'Não colou. Mas está registrado que você tentou.';
}
function dayVerdict(st){
  const r=st.p?st.e/st.p:1;
  if(st.p&&r===1&&!st.atrasos)return {v:'Dia sem ressalvas',cls:'s-ok',mood:'satisfeito',q:'Tudo entregue, nada atrasado. Não vou elogiar. Mas anotei.'};
  if(r>=.5)return {v:'Dia tolerado',cls:'s-amber',mood:'cetico',q:`${cap(ext(st.e))} de ${ext(st.p)}. Já vi piores. Já vi melhores também.`};
  return {v:'Dia rejeitado',cls:'s-red',mood:'bravo',q:`${cap(ext(st.e))} de ${ext(st.p)}. Amanhã a gente conversa.`};
}

function monthView(capM){

    const dt=new Date(y,m,d,12);const dow=dt.getDay();if(dow===0||dow===6)continue;
    const k=dayKey(dt.getTime());let tot,txt;
    if(wk.includes(k)){tot=sum(dayItems(k),x=>x.est);}
    else if(k<tk){tot=240+((d*37)%5)*45;}
    else tot=((d*13)%4)*60;
    txt=tot?`${fmtShort(tot)} / ${fmtShort(capM)}`:'livre';
    cells.push(`<div class="mcell ${k===tk?'is-today':''}"><b>${d}</b><small>${txt}</small><div class="meter ${tot>capM?'over':''}"><i style="width:${Math.min(100,tot/capM*100)}%"></i></div></div>`);
  }
  return `<div class="month">${['Seg','Ter','Qua','Qui','Sex'].map(x=>`<span class="mhead">${x}</span>`).join('')}${cells.join('')}</div>
  <p class="note">Dias passados mostram o que foi assinado. A semana atual se edita na visão Semana.</p>`;
}

/* ---- Modo Pressão ---- */
function vPressao(){
  const q=queue();const r=S.run;
  if(!q.length&&!r)return vZerada();
  let sel=r?task(r.taskId):(q.find(t=>t.id===S.ui.sel)||q[0]);
  const adi=q.filter(t=>t.origin==='ontem').length;
  const cards=q.map(t=>{
    const isRun=r&&r.taskId===t.id;
    if(isRun)return `<li><button class="task is-run" data-act="foco"><span class="stamp s-pen">Em execução · <span data-t="side-run"></span></span><span class="task-title">${esc(t.title)}</span><span class="task-meta">Clique para voltar ao foco</span>${ic('chev','ic chevron')}</button></li>`;
    return `<li><button class="task ${!r&&sel&&sel.id===t.id?'is-sel':''}" data-act="${r?'umaDeCada':'sel'}" data-arg="${t.id}" ${!r?`aria-pressed="${sel&&sel.id===t.id}"`:''}>${taskStamp(t)}<span class="task-title">${esc(t.title)}</span><span class="task-meta">est. ${fmtMin(t.est)} · tolerância ${t.tol} min</span></button></li>`;
  }).join('');
  return `<div class="view">
  ${head(`${dateLong()} · <span data-t="hhmm"></span>`,'Modo Pressão',`<p class="sub">${q.length} assinada${q.length>1?'s':''}${adi?` · ${adi} adiada de ontem`:''}</p>`)}
  ${closedBanner()}
  <div class="cols">
    <section class="col-main" aria-label="Fila"><ol class="tasks">${cards}</ol><p class="note">${ic('lock','ic-xs')} Tarefa nova? Só pela Prancheta. E assinada.</p></section>
    <aside class="col-side">${r?`<div class="card">${boss('Uma de cada vez. Termina a que está aberta.',{mood:'cetico'})}<button class="btn btn-primary btn-lg btn-block" data-act="foco">${ic('play','ic-s')} Voltar ao foco</button></div>`:selDetail(sel)}</aside>
  </div></div>`;
}
function selDetail(t){
  const pomo=S.ui.pomoPref!==false;
  return `<div class="card detail"><span class="stamp s-ink">Selecionada</span><h2 class="h2">${esc(t.title)}</h2>
    <dl class="kv"><div class="wide"><dt>Prazo</dt><dd>fim da estimativa, após iniciar</dd></div><div><dt>Estimativa</dt><dd>${fmtMin(t.est)}</dd></div><div><dt>Tolerância</dt><dd>${t.tol} min</dd></div></dl>
    <div class="switch-row"><div><strong id="pomo-l">Pomodoro</strong><p>${pomo?`Bloco 1 de 4 · ${S.settings.pomo[0]} min de foco, ${S.settings.pomo[1]} de pausa`:'Desligado. Herói sem intervalo.'}</p></div>${sw('pomoPref',pomo,'pomo-l')}</div>
    ${boss('Escolha uma. Só uma.')}
    <button class="btn btn-primary btn-lg btn-block" data-act="iniciar" data-arg="${t.id}" ${S.closed?'disabled':''}>${ic('play','ic-s')} Iniciar</button>
    <p class="fine">Antes de iniciar não existe atraso: o prazo nasce no início.</p></div>`;
}
function vFoco(){
  const r=S.run;if(!r)return vPressao();
  if(r.phase==='break')return vPausaPomo();
  const t=task(r.taskId);const w=workNow();const est=t.est*MIN,tol=t.tol*MIN;
  const state=w>est+tol?'late':w>est?'over':'ok';const paused=r.phase==='pause';
  const alarm=state==='ok'||paused?'':`<div class="alarm alarm-${state}" role="status">${face(state==='late'?'bravo':'cetico','face face-sm')}<p><span class="alarm-who">Dr. Alberto</span>${state==='late'?'Atrasada. Estimativa e tolerância já foram embora.':'Estimativa estourou há <span data-t="overmin"></span>. Otimismo não é método.'}</p><span class="stamp ${state==='late'?'s-red':'s-amber'} big" data-t="overchip"></span></div>`;
  const main=paused?`
    <div class="timer is-frozen tnum">${clockMs(Math.max(0,r.pomo?blockLeft():est-w))}</div>
    <div class="limit"><span class="label">Limite de pausa</span><strong data-t="plimit"></strong><span class="sub" data-t="plimit-l"></span></div>
    ${r.pauseNote?`<p class="sub">Motivo: ${esc(r.pauseNote)}</p>`:''}
    ${boss('Pausa tem limite. Paciência também.',{mood:'cetico'})}
    <button class="btn btn-primary btn-lg" data-act="voltarTrabalho">${ic('play','ic-s')} Voltar ao trabalho</button>`:`
    <div class="timer" data-t="${r.pomo?'block':'remain-big'}" aria-live="off"></div>
    <div class="pomo-row">${r.pomo?`<span>Pomodoro · bloco ${r.block} de 4</span><span class="dots" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<r.block?'done':i===r.block?'cur':''}"></i>`).join('')}</span>`:'<span>Pomodoro desligado · contando a estimativa</span>'}<span class="row" style="gap:8px"><span id="pr-l" class="fine">Pomodoro</span>${sw('pomoRun',r.pomo,'pr-l')}</span></div>
    ${!r.pomo?'<p class="quip">“Herói sem intervalo. Vamos ver até quando.”</p>':''}
    <div class="foco-actions"><button class="btn btn-primary btn-lg" data-act="entregar">${ic('check','ic-s')} Entregar <kbd>E</kbd></button><button class="btn btn-ghost btn-lg" data-act="desculpa">${ic('pause','ic-s')} Dar desculpa <kbd>P</kbd></button></div>
    <button class="btn btn-link" data-act="registro">${ic('plus','ic-s')} Registrar interrupção ou ideia <kbd>I</kbd></button>`;
  const ints=S.interrupts.filter(i=>i.taskId===t.id),pas=S.pauses.filter(p=>p.taskId===t.id);
  const logs=[...ints.map(i=>({at:i.at,txt:`Interrupção · ${i.type}${i.note?': '+i.note:''}`})),...pas.map(p=>({at:p.at,txt:`Pausa · ${p.cat} · ${minSec(p.ms)}`}))].sort((a,b)=>a.at-b.at);
  return `<div class="view foco foco-${state} ${paused?'is-paused':''}">
  ${alarm}
  <div class="foco-grid">
    <section class="foco-main"><span class="stamp ${paused?'s-amber':'s-pen'}">${paused?'Pausada · '+esc(r.pauseCat):'Em execução'}</span><h1 class="foco-title">${esc(t.title)}</h1>${main}</section>
    <aside class="card" aria-label="Números da tarefa">
      <dl class="stats">
        <div class="st-remain"><dt>Restante</dt><dd data-t="remain"></dd><small data-t="prazo"></small></div>
        <div><dt>Estimativa</dt><dd>${fmtMin(t.est)}</dd></div>
        <div><dt>Decorrido na tarefa</dt><dd data-t="elapsed"></dd></div>
        <div><dt>Tolerância</dt><dd>${t.tol} min</dd></div>
      </dl>
      <div class="track" aria-hidden="true"><div class="track-est" style="flex:${t.est}"></div><div class="track-tol" style="flex:${t.tol}"></div><i class="track-fill" data-tw="fill"></i></div>
      <div class="track-legend" aria-hidden="true"><span>início</span><span>estimativa</span><span>tolerância</span></div>
      <p class="fine">Passou da estimativa: aviso. Passou da tolerância: cobrança de atraso. Nada interrompe o trabalho.</p>
      ${logs.length?`<span class="label">Registro desta tarefa</span><ul class="log">${logs.map(l=>`<li><time>${hhmm(l.at)}</time><span>${esc(l.txt)}</span></li>`).join('')}</ul>`:''}
    </aside>
  </div></div>`;
}
function vPausaPomo(){
  const r=S.run;const t=task(r.taskId);const len=breakLen(r.breakKind);const exc=now()-r.phaseStart>len;
  if(exc)return `<div class="view pausa is-exc"><span class="stamp s-red big">Excedente</span><div class="timer timer-xl" data-t="break"></div><p class="lead">Passou do tempo. Isso vai para as cobranças.</p><p class="eyebrow" data-t="break-desc"></p>${boss('O café esfriou e a desculpa também.',{mood:'bravo'})}<button class="btn btn-primary btn-lg" data-act="voltarPausa">${ic('play','ic-s')} Voltar ao trabalho</button></div>`;
  return `<div class="view pausa"><span class="label">Pausa do pomodoro · sem desculpa</span>
    <div class="seg" role="tablist" aria-label="Tipo de pausa">${['curta','longa'].map(k=>`<button role="tab" aria-selected="${r.breakKind===k}" data-act="breakKind" data-arg="${k}"><span>${breakName(k)}</span><small>${breakLen(k)/MIN} min</small></button>`).join('')}</div>
    <div class="timer timer-xl" data-t="break"></div>
    ${boss(r.breakKind==='curta'?'Café, não happy hour.':'Almoço relâmpago. A ênfase é no relâmpago.')}
    <p class="sub">Volta para: <strong>${esc(t.title)}</strong> · bloco ${r.block%4+1} de 4</p>
    <button class="btn btn-ghost btn-lg" data-act="voltarPausa">Voltar antes</button></div>`;
}
function vEntrega(){
  const t=task(S.ui.lastDelivered);if(!t)return vPressao();
  const real=Math.round(t.workMs/MIN),diff=real-t.est;const next=queue()[0];const late=real>t.est+t.tol;
  const quip=diff<=0?'No prazo. Não vou aplaudir. Mas anotei.':late?`Entregue com ${ext(diff)} minuto${diff>1?'s':''} acima. A cobrança de atraso segue esperando explicação.`:`Entregue. ${cap(ext(diff))} minuto${diff>1?'s':''} acima. Anotado, não perdoado.`;
  const mx=Math.max(t.est,real,1);
  return `<div class="view">
  <header class="vh"><div class="vh-l"><span class="stamp s-ok big">${ic('check','ic-xs')} Entregue · ${hhmm(t.deliveredAt)}</span><h1 class="h1">${esc(t.title)}</h1></div></header>
  <div class="cols"><section class="col-main">
    <dl class="ledger">
      <div><dt>Estimado</dt><dd>${fmtShort(t.est)}</dd></div>
      <div><dt>Real</dt><dd style="color:${diff>0?(late?'var(--stamp)':'var(--amber)'):'var(--ok)'}">${fmtShort(real)}${diff?`<small>${diff>0?'+':''}${diff}m</small>`:''}</dd></div>
      <div><dt>Pomodoros</dt><dd>${t.pomos}</dd></div>
      <div><dt>Pausa com desculpa</dt><dd>${t.pauseCount}<small>${t.pauseCount?clockMs(t.pauseMs):''}</small></dd></div>
      <div class="full"><dt>Interrupções</dt><dd>${t.intr}</dd></div>
    </dl>
    <div class="card"><span class="label">Estimado x real</span>
      <div class="hbars"><div class="hb"><span>Estimado</span><div class="hb-track"><div class="hb-fill" style="width:${t.est/mx*100}%"></div></div><b>${t.est}</b></div>
      <div class="hb"><span>Real</span><div class="hb-track"><div class="hb-fill" style="width:${real/mx*100}%;background:${diff>0?'var(--stamp)':'var(--ok)'}"></div></div><b>${real}</b></div></div></div>
  </section>
  <aside class="col-side"><div class="card">${boss(quip,{mood:diff<=0?'satisfeito':late?'bravo':'cetico'})}
    ${next?`<button class="btn btn-primary btn-lg btn-block" data-act="iniciar" data-arg="${next.id}">${ic('play','ic-s')} Próxima da fila</button><p class="fine">Próxima: ${esc(next.title)} · ${fmtMin(next.est)}</p>`:`<p class="sub">Era a última da fila.</p>`}
    <button class="btn btn-ghost btn-block" data-act="go" data-arg="pressao">Ver a fila</button></div></aside></div></div>`;
}
function vZerada(){
  return `<div class="view center-view">${face('satisfeito','face face-xl')}<h1 class="display">Fila zerada.</h1><p class="lead">Nada assinado pendente. Não se acostume.</p>
  <div class="row" style="justify-content:center"><button class="btn btn-primary btn-lg" data-act="ponto">${ic('card','ic-s')} Bater o ponto</button><button class="btn btn-ghost btn-lg" data-act="go" data-arg="prancheta">Abrir Prancheta</button></div></div>`;

function vCobrancas(){

function cobDetail(c){

  else if(c.type==='excedente')kv=`<div><dt>Pausa</dt><dd>${c.baseMin} min</dd></div><div><dt>Excedente</dt><dd>+${minSec(c.amountMs||0)}</dd></div><div class="wide"><dt>Aberta às</dt><dd>${hhmm(c.at)}</dd></div>`;
  else if(c.type==='mudanca')kv=`<div class="wide"><dt>Pedido</dt><dd>${esc(c.detail||'')}</dd></div><div class="wide"><dt>Aberta às</dt><dd>${hhmm(c.at)}</dd></div>`;
  else kv=`<div><dt>Estimativa</dt><dd>${t?fmtMin(t.est):'—'}</dd></div><div><dt>Aberta às</dt><dd>${hhmm(c.at)}</dd></div><div class="wide"><dt>Situação</dt><dd>Não entregue · abandonada no ponto</dd></div>`;

function vDesculpa(){

      <div class="row"><button class="btn btn-primary btn-lg" data-act="excStep" data-arg="3" ${L>=20?'':'disabled'}>Continuar</button><button class="btn btn-ghost btn-lg" data-act="excStep" data-arg="1">Voltar</button></div>`;

      <div class="field"><label for="exc-faco">…eu faço:</label><input id="exc-faco" class="input" data-model="ui.exc.faco" value="${esc(e.faco)}" placeholder="anoto e retorno no fim do pomodoro" maxlength="120" autocomplete="off"></div></div>

  const stepTxt=step==='bloqueio'?2:step;
  let body='';
  if(step===1){
    const early=P.openedAt<endOfDay();
    body=`${boss(early?`Saindo antes das ${S.settings.end}? Os números vão contar a história.`:'Vamos aos números. Eles não mentem. Ao contrário de algumas pessoas.',{lg:true,mood:early?'cetico':'neutro'})}
    <dl class="ledger">
      <div><dt>Prometido</dt><dd>${st.p}</dd></div><div><dt>Entregue</dt><dd>${st.e}</dd></div>
      <div><dt>Estimado</dt><dd>${fmtShort(st.estM)}</dd></div><div><dt>Real</dt><dd style="color:${st.realM>st.estM?'var(--stamp)':'inherit'}">${fmtShort(st.realM)}</dd></div>
      <div><dt>Pausas do pomodoro</dt><dd>${st.brN}<small>${fmtShort(st.brMs/MIN)}</small></dd></div><div><dt>Pausas com desculpa</dt><dd>${st.paN}<small>${fmtShort(st.paMs/MIN)}</small></dd></div>

  }else if(step===2){
    const pend=S.tasks.filter(t=>t.day===today()&&(t.status==='fila'||P.decisions[t.id]));
    const allDone=pend.every(t=>P.decisions[t.id]);
    body=pend.length?`<h2 class="h2">Assinadas e não entregues.</h2><p class="sub">Decida o destino de cada uma. Ficar em cima do muro não é opção.</p>
      <div class="tasks">${pend.map(t=>{const d=P.decisions[t.id];const where=t.stoppedAt?`parada às ${hhmm(t.stoppedAt)}`:t.workMs>0?`trabalhada ${fmtMin(t.workMs/MIN)}`:t.origin==='ontem'?'adiada de ontem':'nem começou';
        let right;if(d==='amanha')right=`<span class="stamp s-amber">Levada para amanhã</span>`;else if(d==='abandonada')right=`<span class="stamp s-red">Abandonada</span>`;else if(d==='amanha-pend')right=`<button class="btn btn-ghost btn-sm" data-act="explicar" data-arg="${P.pendCob[t.id]}">Continuar desculpa</button>`;
        else right=`<div class="row"><button class="btn btn-ghost btn-sm" data-act="pontoAmanha" data-arg="${t.id}">Levar para amanhã</button><button class="btn btn-danger btn-sm" data-act="pontoAbandonar" data-arg="${t.id}">Abandonar</button></div>`;
        return `<div class="pend"><div><strong>${esc(t.title)}</strong><small>est. ${fmtMin(t.est)} · ${where}</small></div>${right}</div>`;}).join('')}</div>
      <p class="fine">“Levar para amanhã” pede desculpa formal e entra na fila de amanhã. “Abandonar” vira cobrança de abandono.</p>`
      :`${boss('Nada assinado ficou para trás. Vou fingir que não estou surpreso.',{mood:'satisfeito'})}`;
    body+=`<div class="row"><button class="btn btn-primary btn-lg" data-act="pontoContinuar" ${allDone?'':'disabled'}>Continuar</button><button class="btn btn-ghost btn-lg" data-act="pontoStep" data-arg="1">Voltar ao resumo</button></div>`;
  }else if(step==='bloqueio'){
    const open=openCobs();
    body=`${boss('Ainda tem cobrança sem explicação.',{mood:'bravo',lg:true})}<p class="lead">O dia só fecha com tudo explicado. Regra sua, assinada por você.</p>
    <div class="tasks">${open.map(c=>`<div class="pend"><div><strong>${COB[c.type][0]} · ${esc(c.title)}</strong><small>${esc(cobLine(c))}</small></div><span class="eyebrow">${hhmm(c.at)}</span></div>`).join('')}</div>
    <div class="row"><button class="btn btn-primary btn-lg" data-act="pontoCentral">Ir para a Central (${open.length})</button><button class="btn btn-ghost btn-lg" data-act="pontoStep" data-arg="1">Voltar ao resumo</button></div>`;
  }else{
    const dv=dayVerdict(st);
    body=`<div class="cols"><section class="col-main"><h2 class="h2">Reflexão do dia</h2>
      <div class="field"><label for="refl">Como foi? (livre)</label><textarea id="refl" class="input" data-model="ponto.refl" placeholder="O que rendeu, o que travou, por onde começa amanhã." maxlength="800">${esc(P.refl||'')}</textarea></div>
      <div class="row"><button class="btn btn-primary btn-lg" data-act="baterPonto">${ic('card','ic-s')} Bater o ponto</button></div></section>
      <aside class="col-side"><div class="card"><span class="label">Veredito do dia</span><span class="stamp ${dv.cls} big">${dv.v}</span>${boss(dv.q,{mood:dv.mood})}</div></aside></div>`;
  }
  return `<div class="view">${head(`${dateLong()} · ${hhmm(P.openedAt)}`,'Bater o ponto',`<span class="steps">${stepTxt} de 3 ${[1,2,3].map(i=>`<i class="${i<=stepTxt?'on':''}"></i>`).join('')}</span>`)}${body}</div>`;
}

      <table class="tc"><tbody><tr><th>Data</th><td>${dateLong(c.at)}</td></tr><tr><th>Entrada</th><td>${first?hhmm(first.startedAt):S.settings.start}</td></tr><tr><th>Saída</th><td><span class="tc-stamp">${hhmm(c.at)}</span></td></tr><tr><th>Entregues</th><td>${c.e} de ${c.p}</td></tr><tr><th>Veredito</th><td>${esc(c.verdict)}</td></tr></tbody></table></div>

/* ---- Dossiê ---- */
function weekStats(){
  const tk=today();
  return weekDays().map(d=>{let s=null;if(d.key===tk){const t=statsToday();s=t;}else if(S.archive[d.key])s=S.archive[d.key];return Object.assign({},d,{s,isToday:d.key===tk});});
}
function vDossie(){
  const mode=S.ui.dmode||'semana';
  const ws=weekStats();const T=statsToday();
  const A=mode==='semana'?ws.filter(d=>d.s).reduce((a,d)=>{['p','e','estM','realM','pomoM','livreM','intr','atrasos','aband'].forEach(k=>a[k]=(a[k]||0)+(d.s[k]||0));return a;},{}):T;
  const dev=A.estM?Math.round((A.realM-A.estM)/A.estM*100):0;
  const pauses=Object.assign({},mode==='semana'?S.seedPauses:{});
  S.pauses.filter(p=>mode==='semana'||dayKey(p.at)===today()).forEach(p=>{pauses[p.cat]=(pauses[p.cat]||0)+1;});
  const pArr=Object.entries(pauses).sort((a,b)=>b[1]-a[1]);const pMax=Math.max(1,...pArr.map(x=>x[1]));
  const exc=Object.assign({},S.seedExcuses);historyCobs().forEach(c=>{exc[c.excuse.cat]=(exc[c.excuse.cat]||0)+1;});
  const eArr=Object.entries(exc).sort((a,b)=>b[1]-a[1]);
  const top=eArr[0];
  const QX={'Interrupção externa':n=>`${cap(extF(n))} interrupções externas. O mundo conspira ou você atende tudo?`,'Estimativa errada':n=>`${cap(extF(n))} estimativas erradas. Seu relógio interno precisa de conserto.`,'Fui fraco mesmo':n=>`${cap(ext(n))} vezes “fui fraco mesmo”. Sinceridade não é plano.`,'Dependia de outra pessoa':n=>`${cap(extF(n))} vezes dependendo dos outros. Já pensou em depender de você?`,'Imprevisto pessoal':n=>`${cap(ext(n))} imprevistos pessoais. Já estão ficando previsíveis.`,'Prioridade mudou':n=>`A prioridade mudou ${extF(n)} vezes. Talvez o problema seja a prioridade.`};
  const tiles=[
    ['pe','Prometido x entregue',`${A.p||0} / ${A.e||0}`,A.p?`${Math.round(A.e/A.p*100)}% entregue`:'nada prometido',false],
    ['er','Estimado x real',`${dev>0?'+':''}${dev}%`,`${fmtShort(A.estM||0)} → ${fmtShort(A.realM||0)}`,dev>10],
    ['pl','Pomodoro x livre',`${fmtShort(A.pomoM||0)} / ${fmtShort(A.livreM||0)}`,'tempo de foco',false],
    ['in','Interrupções',`${A.intr||0}`,mode==='semana'?'na semana':'hoje',false],
    ['aa','Atrasos · abandonos',`${A.atrasos||0} · ${A.aband||0}`,'viraram cobrança',(A.aband||0)>0]
  ];
  const chart=mode==='semana'?weekChart(ws):dayChart();
  const notes=[...S.notes.map(n=>({at:n.at,txt:n.text,tag:'Risco assumido'})),...S.ideas.map(i=>({at:i.at,txt:i.text,tag:'Ideia'})),...S.reflections.map(r=>({at:r.at,txt:r.text,tag:'Reflexão'}))].sort((a,b)=>b.at-a.at);
  return `<div class="view">
  <div class="folder" data-tab="Confidencial · uso da chefia"><div class="vh-l"><p class="eyebrow">${mode==='semana'?`Semana ${weekRange()}`:dateLong()}</p><h1 class="h1">Dossiê</h1></div>
    <div class="seg" role="tablist" aria-label="Período"><button role="tab" aria-selected="${mode==='dia'}" data-act="dmode" data-arg="dia">Dia</button><button role="tab" aria-selected="${mode==='semana'}" data-act="dmode" data-arg="semana">Semana</button></div></div>
  <div class="tiles">${tiles.map(([k,l,v,s,bad])=>`<button class="tile" data-act="dlist" data-arg="${k}"><span class="label">${l}</span><span class="tile-num ${bad?'bad':''}">${v}</span><span class="tile-sub">${s}</span></button>`).join('')}</div>
  <div class="dgrid">${chart}
    <div class="card"><span class="label">Pausas por motivo</span>${pArr.length?`<div class="hbars">${pArr.map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><div class="hb-track"><div class="hb-fill" style="width:${v/pMax*100}%"></div></div><b>${v}</b></div>`).join('')}</div>`:'<p class="fine">Nenhuma pausa com desculpa hoje.</p>'}</div></div>
  <div class="dgrid"><div class="card"><span class="label">Padrões de desculpa</span><ul class="notes">${eArr.map(([k,v])=>`<li><time>${v}x</time><span>${esc(k)}</span></li>`).join('')}</ul>${top?boss(QX[top[0]]?QX[top[0]](top[1]):'Anotado.',{mood:'cetico'}):''}</div>
    <div class="card"><span class="label">Anotações no dossiê</span>${notes.length?`<ul class="notes">${notes.slice(0,8).map(n=>`<li><time>${dayLabel(n.at)} ${hhmm(n.at)}</time><span><b>${n.tag}.</b> ${esc(n.txt)}</span></li>`).join('')}</ul>`:'<p class="fine">Ideias registradas no foco, riscos assumidos no plano da semana e reflexões do ponto aparecem aqui.</p>'}</div></div>
  <p class="note">Clique em qualquer número para ver a lista que gerou o número.</p></div>`;
}
function weekChart(ws){
  const W=520,H=230,L=34,B=34,Tp=16;const max=Math.max(4,...ws.map(d=>d.s?d.s.p:0));const top=Math.ceil(max/2)*2;
  const y=v=>Tp+(H-Tp-B)*(1-v/top);const band=(W-L-8)/5;
  let g='';for(let v=0;v<=top;v+=2){g+=`<line class="ch-grid" x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-lbl" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  const bars=ws.map((d,i)=>{const cx=L+band*i+band/2;const bw=Math.min(46,band*.5);const lbl=`<text class="ch-day ${d.isToday?'today':''}" x="${cx}" y="${H-12}" text-anchor="middle">${d.label}</text>`;
    if(!d.s)return lbl+`<line class="ch-grid" x1="${cx-bw/2}" x2="${cx+bw/2}" y1="${y(0)}" y2="${y(0)}" stroke-dasharray="3 3"/><text class="ch-lbl" x="${cx}" y="${y(0)-8}" text-anchor="middle">—</text>`;
    return lbl+`<rect class="ch-out" x="${cx-bw/2}" y="${y(d.s.p)}" width="${bw}" height="${y(0)-y(d.s.p)}" rx="2"/><rect class="ch-fill ${d.isToday?'today':''}" x="${cx-bw/2+5}" y="${y(d.s.e)}" width="${bw-10}" height="${Math.max(0,y(0)-y(d.s.e))}" rx="1.5"/><text class="ch-val" x="${cx}" y="${y(d.s.p)-7}" text-anchor="middle">${d.s.e} de ${d.s.p}</text>`;}).join('');
  return `<div class="card chart"><div class="row" style="justify-content:space-between"><span class="label">Prometido x entregue por dia</span><span class="legend"><span><i class="lg-out"></i>prometido</span><span><i class="lg-fill"></i>entregue</span></span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tarefas prometidas e entregues por dia da semana">${g}${bars}</svg></div>`;
}
function dayChart(){
  const ts=S.tasks.filter(t=>t.day===today()&&taskWork(t)>0);
  if(!ts.length)return `<div class="card"><span class="label">Estimado x real por tarefa</span><p class="fine">Nenhuma tarefa trabalhada hoje ainda.</p></div>`;
  const mx=Math.max(...ts.map(t=>Math.max(t.est,taskWork(t)/MIN)));
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="label">Estimado x real por tarefa · minutos</span><span class="legend"><span><i class="lg-out"></i>estimado</span><span><i class="lg-fill"></i>real</span></span></div>
  <div class="hbars">${ts.map(t=>{const r=Math.round(taskWork(t)/MIN);return `<div><p class="fine" style="color:var(--ink-2);margin-bottom:4px">${esc(t.title)}</p><div class="hb"><span>est.</span><div class="hb-track"><div class="hb-fill" style="width:${t.est/mx*100}%;background:var(--rule-2)"></div></div><b>${t.est}</b></div><div class="hb"><span>real</span><div class="hb-track"><div class="hb-fill" style="width:${r/mx*100}%;background:${r>t.est+t.tol?'var(--stamp)':r>t.est?'var(--amber)':'var(--ink)'}"></div></div><b>${r}</b></div></div>`;}).join('')}</div></div>`;
}

function editor(k){

  return `<div class="seted"><div class="grid">${f}</div><div class="row"><button class="btn btn-primary btn-sm" data-act="saveRow" data-arg="${k}">Salvar para amanhã</button><button class="btn btn-link btn-sm" data-act="cancelRow">Cancelar</button></div></div>`;
}
