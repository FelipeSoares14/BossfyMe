<meta charset="utf-8">
<title>BOSSFYME v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
/* Layout: barra lateral branca com borda dura (dois modos + relógio analógico) + área de trabalho em cards do design system BossFy.
   Tokens copiados do design system BossFy (tema único, claro). */
:root{
  --background:#f5f6fa; --surface:#ffffff; --surface-low:#f1f5fe; --surface-container:#e9edf9; --surface-high:#e5e9f3; --surface-highest:#dde1ed; --paper:#fffdf8;
  --ink:#171c22; --ink-muted:#5a413e; --ink-subtle:#7a6360; --outline:#8c716e;
  --primary:#a83129; --on-primary:#ffffff; --primary-container:#ffdad6;
  --error:#ba1a1a; --on-error:#ffffff; --danger-soft:#fee2e2;
  --secondary:#29656a; --on-secondary:#ffffff; --secondary-container:#b1eef2;
  --tertiary:#8d4e14; --on-tertiary:#ffffff; --tertiary-container:#ffdcc4; --tertiary-soft:#fff1e8;
  --alert:#ffad69; --alert-strong:#f99245;
  --caution:#fde047; --caution-strong:#facc15; --caution-soft:#fef9c3; --caution-pale:#fefce8;
  --border-brutal:var(--ink); --link:var(--primary);
  --scrim:rgba(23,28,34,.45);
  --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --font-icons:"Material Symbols Outlined";
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;
  --radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-full:9999px;
  --shadow-soft:0 8px 24px -12px #171c2229,0 1px 2px #171c220f;
  --shadow-brutal-sm:2px 2px 0 #171c22;--shadow-brutal:4px 4px 0 #171c22;--shadow-brutal-lg:6px 6px 0 #171c22;
  --focus-ring:0 0 0 2px #ffffff,0 0 0 4px #171c22;
  --stroke-hairline:1px;--stroke-brutal:2px;
  --tilt-sticker:-3deg;--tilt-sticker-alt:3deg;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--ink);font:400 15px/22px var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid transparent;box-shadow:var(--focus-ring)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ícones ---------- */
.mi{font-family:var(--font-icons);font-weight:normal;font-style:normal;font-size:20px;width:20px;height:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;overflow:hidden;flex:none;vertical-align:middle}
.mi.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.ic-s{font-size:16px;width:16px;height:16px}
.ic-xs{font-size:14px;width:14px;height:14px}
.ic-l{font-size:28px;width:28px;height:28px}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.app.is-onb{grid-template-columns:minmax(0,1fr)}
.app.is-onb .side,.app.is-onb .topbar,.app.is-onb .tabbar{display:none}
.side{grid-row:1;background:var(--surface);border-right:var(--stroke-brutal) solid var(--border-brutal);display:flex;flex-direction:column;gap:var(--space-3);padding-block:20px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.main{grid-row:1;overflow-y:auto;overflow-x:hidden;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px));transition:background .3s}
.app.is-paused .main{background:var(--caution-pale)}
.app.is-onb .main{grid-column:1}
.topbar,.tabbar{display:none}

.logo{display:inline-flex;align-items:center;gap:var(--space-3);min-width:0}
.logo-mark{width:40px;height:40px;border-radius:var(--radius-full);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal-sm);flex:none}
.logo-name{font-weight:800;font-size:22px;line-height:26px;letter-spacing:-.03em;color:var(--ink);display:block}
.logo-tag{display:block;font:600 10px/14px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.side-boss{display:flex;gap:10px;align-items:center;padding:12px;background:var(--surface-low);border-radius:var(--radius-md)}
.side-boss strong{display:block;font:700 14px/18px var(--font-sans)}
.side-boss small{font:500 11px/14px var(--font-mono);color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.side-boss small i{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block}
.avatar{width:40px;height:40px;border-radius:var(--radius-full);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal-sm);overflow:hidden;flex:none;background:var(--surface-high);display:block}
.avatar img{width:170%;height:170%;max-width:none;object-fit:cover;object-position:50% 20%;margin:-12% 0 0 -35%;display:block}
.avatar-sm{width:32px;height:32px;box-shadow:none}

.modes{display:flex;flex-direction:column;border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);box-shadow:var(--shadow-brutal);overflow:hidden;background:var(--surface)}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 14px}
.mode+.mode{border-top:var(--stroke-brutal) solid var(--border-brutal)}
.mode .mi{grid-row:1/3;color:var(--primary)}
.mode strong{font:800 16px/20px var(--font-sans);letter-spacing:-.01em}
.mode small{grid-column:2;font:500 11px/14px var(--font-mono);color:var(--ink-muted)}
.mode .live{grid-row:1/3;grid-column:3;font:700 12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--primary);background:var(--primary-container);padding:4px 8px;border-radius:var(--radius-full)}
.mode:hover{background:var(--surface-low)}
.mode.on{background:var(--primary);color:var(--on-primary)}
.mode.on .mi,.mode.on small{color:var(--on-primary)}
.mode.on .live{background:var(--on-primary);color:var(--primary)}
.mode:focus-visible{box-shadow:inset 0 0 0 3px var(--ink)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-full);color:var(--ink);text-decoration:none;font:600 14px/18px var(--font-sans)}
.nav .mi{color:var(--ink-muted)}
.nav .lbl{flex:1}
.nav:hover{background:var(--surface-low)}
.nav.on{background:var(--surface-container)}
.nav.on .mi{color:var(--primary)}
.count{min-width:22px;height:22px;border-radius:11px;padding:0 6px;background:var(--primary);color:var(--on-primary);font:700 11px/22px var(--font-mono);text-align:center}
.side-foot{margin-top:auto;padding-top:16px;border-top:var(--stroke-hairline) dashed var(--outline);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.aclock{width:104px;height:104px;display:block;margin-bottom:6px}
.ac-face{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.ac-tick{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.ac-tick.big{stroke-width:2.5}
.ac-h{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.ac-m{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.ac-pin{fill:var(--primary);stroke:var(--ink);stroke-width:1.5}
.side-date{font:700 15px/20px var(--font-sans)}
.side-motto{font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
.endday{all:unset;cursor:pointer;font:500 12px/16px var(--font-mono);color:var(--ink-subtle);text-decoration:underline;text-underline-offset:3px;padding:4px 6px;border-radius:6px}
.endday:hover{color:var(--ink)}
.endday:focus-visible{box-shadow:var(--focus-ring)}
.endday.due{color:var(--primary);font-weight:700}
.endday.done{text-decoration:none;color:var(--secondary)}

/* ---------- tipografia ---------- */
.over{font:600 11px/16px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.eyebrow{font:500 13px/18px var(--font-mono);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.h1{font:800 clamp(28px,3.4vw,38px)/1.1 var(--font-sans);letter-spacing:-.03em}
.h2{font:700 clamp(22px,2.4vw,26px)/1.2 var(--font-sans);letter-spacing:-.02em}
.h3{font:700 16px/22px var(--font-sans)}
.display{font:800 clamp(40px,6vw,68px)/1 var(--font-sans);letter-spacing:-.04em}
.lead{font-size:18px;line-height:1.5;color:var(--ink-muted);max-width:56ch}
.sub{color:var(--ink-muted)}
.fine{font-size:13px;line-height:18px;color:var(--ink-muted)}
.note{font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-5);border-radius:var(--radius-full);border:0;font:700 14px/1.1 var(--font-sans);text-decoration:none;white-space:nowrap;background:none;transition:transform .08s ease,box-shadow .08s ease,filter .12s ease}
.btn:hover:not(:disabled){filter:brightness(.96)}
.btn-primary{background:var(--primary);color:var(--on-primary);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal);text-transform:uppercase;font-weight:800;letter-spacing:-.01em}
.btn-primary:active:not(:disabled){transform:translate(2px,2px);box-shadow:var(--shadow-brutal-sm)}
.btn-primary:focus-visible{box-shadow:var(--shadow-brutal),var(--focus-ring)}
.btn-primary .mi{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.btn-ghost{background:var(--surface-high);color:var(--ink)}
.btn-caution{background:var(--caution-soft);color:var(--ink)}
.btn-danger{background:var(--surface-high);color:var(--error)}
.btn-danger:hover:not(:disabled){background:var(--danger-soft);filter:none}
.btn-link{min-height:34px;padding:0 var(--space-2);color:var(--link);font:500 13px/1.2 var(--font-mono)}
.btn-link:hover{text-decoration:underline}
.btn-lg{min-height:56px;padding:0 var(--space-6);font-size:16px}
.btn-primary.btn-lg{border-radius:var(--radius-md);font-size:17px}
.btn-sm{min-height:34px;padding:0 14px;font-size:13px}
.btn-primary.btn-sm{box-shadow:var(--shadow-brutal-sm);font-size:12px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font:600 10px/1 var(--font-mono);border:1.5px solid currentColor;border-radius:5px;padding:3px 5px;opacity:.7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- badges, stickers ---------- */
.bdg{display:inline-flex;align-items:center;gap:var(--space-1);font:700 11px/14px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-full);white-space:nowrap;width:fit-content}
.bdg-solid.t-primary{background:var(--primary);color:var(--on-primary)}
.bdg-solid.t-error{background:var(--error);color:var(--on-error)}
.bdg-solid.t-secondary{background:var(--secondary);color:var(--on-secondary)}
.bdg-solid.t-tertiary{background:var(--tertiary);color:var(--on-tertiary)}
.bdg-solid.t-caution{background:var(--caution);color:var(--ink)}
.bdg-solid.t-neutral{background:var(--ink);color:var(--surface)}
.bdg-soft.t-primary{background:var(--primary-container);color:var(--primary)}
.bdg-soft.t-error{background:var(--primary-container);color:var(--error)}
.bdg-soft.t-secondary{background:var(--secondary-container);color:var(--secondary)}
.bdg-soft.t-tertiary{background:var(--tertiary-container);color:var(--tertiary)}
.bdg-soft.t-caution{background:var(--caution-soft);color:var(--ink)}
.bdg-soft.t-neutral{background:var(--surface-container);color:var(--ink-muted)}
.bdg-lg{font-size:13px;line-height:16px;padding:6px 14px}
.sticker{display:inline-flex;align-items:center;gap:var(--space-1);font:700 11px/14px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:var(--radius-full);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal-sm);transform:rotate(var(--tilt-sticker));white-space:nowrap;width:fit-content;background:var(--primary);color:var(--on-primary)}
.sticker.alt{transform:rotate(var(--tilt-sticker-alt))}
.sticker.caution{background:var(--caution-strong);color:var(--ink)}
.sticker.soft{background:var(--caution-soft);color:var(--ink)}
.sticker.tertiary{background:var(--tertiary);color:var(--on-tertiary)}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);padding:var(--space-6);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-brutal{border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal-lg);border-radius:var(--radius-md)}
.card-paper{background:var(--paper);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal-lg);border-radius:var(--radius-md)}
.card-tinted{background:var(--surface-low);box-shadow:none}
.card-head{display:flex;align-items:center;gap:var(--space-2)}
.card-head .mi{color:var(--primary)}
.card-head h2,.card-head h3{flex:1}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 16px;border-radius:var(--radius-full);border:var(--stroke-brutal) solid transparent;background:var(--surface-high);font:600 14px/1 var(--font-sans);display:inline-flex;align-items:center;gap:6px}
.chip:hover{filter:brightness(.96)}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--border-brutal);box-shadow:var(--shadow-brutal-sm)}

/* switch */
.switch{width:48px;height:28px;border-radius:14px;background:var(--surface-highest);border:var(--stroke-brutal) solid var(--outline);position:relative;flex:none;padding:0;transition:background .15s}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:var(--stroke-brutal) solid var(--ink);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--primary);border-color:var(--border-brutal)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.switch-row{display:flex;gap:16px;align-items:center;justify-content:space-between}
.switch-row strong{display:block;font-weight:700}
.switch-row p{font-size:13px;line-height:18px;color:var(--ink-muted)}

/* campos */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.flabel{font:600 11px/16px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.input{width:100%;min-height:48px;border:var(--stroke-brutal) solid transparent;border-radius:var(--radius-md);background:var(--surface-high);padding:0 var(--space-4);font:500 15px/20px var(--font-sans)}
.input:focus{outline:none;border-color:var(--ink);background:var(--surface)}
textarea.input{padding:12px var(--space-4);min-height:132px;resize:vertical;line-height:1.55}
select.input{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink-muted) 50%),linear-gradient(135deg,var(--ink-muted) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:44px}
.hint{font-size:13px;line-height:18px;color:var(--ink-muted)}
.hint b{color:var(--ink);font-weight:700}
.inline{display:flex;align-items:center;gap:10px}
.input-sm{max-width:120px}

/* fala do chefe (SpeechBubble) */
.bubble{position:relative;margin:0 0 14px;border-radius:var(--radius-lg);padding:14px 18px 16px;background:var(--surface-highest);min-width:0}
.bubble::after{content:"";position:absolute;left:28px;bottom:-12px;border:12px solid transparent;border-bottom:0;border-top-color:var(--surface-highest)}
.bubble-who{display:flex;align-items:center;gap:var(--space-1);font:800 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--primary);text-transform:uppercase;margin-bottom:4px}
.bubble p{font:700 17px/24px var(--font-sans);letter-spacing:-.01em;color:var(--primary)}
.bubble-lg p{font-size:21px;line-height:28px;font-weight:800}
.bubble-brutal{background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal);border-radius:var(--radius-md)}
.bubble-brutal::after{border-top-color:var(--border-brutal);bottom:-14px;border-width:14px;border-bottom:0}
.bubble-brutal p{color:var(--ink)}
.art{background:var(--surface-low);border-radius:var(--radius-md);position:relative;display:grid;place-items:center;padding:12px;overflow:visible}
.art img{width:100%;height:auto;display:block;max-width:320px}
.art .sticker{position:absolute;top:-10px;right:-8px}

/* ---------- views ---------- */
.view{max-width:1180px;margin:0 auto;padding-block:34px 88px;display:flex;flex-direction:column;gap:24px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.vh-l{display:flex;flex-direction:column;gap:6px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.col-main,.col-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 2px 0}
.list-head .over{display:inline-flex;align-items:center;gap:5px}
.back{align-self:flex-start}

.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-1);padding:var(--space-1);background:var(--surface-low);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-full);box-shadow:var(--shadow-brutal);width:fit-content;max-width:100%}
.seg button{border:var(--stroke-brutal) solid transparent;background:none;padding:6px 18px;border-radius:var(--radius-full);font:700 14px/18px var(--font-sans);display:flex;flex-direction:column;align-items:center;gap:0}
.seg button small{font:500 11px/14px var(--font-mono);color:var(--ink-subtle);display:flex;align-items:center;gap:4px}
.seg button span{display:flex;align-items:center;gap:5px}
.seg button[aria-selected="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--border-brutal);box-shadow:var(--shadow-brutal-sm)}
.seg button[aria-selected="true"] small{color:var(--on-primary)}
.seg-sm{box-shadow:none;background:var(--surface-high);border-color:transparent}
.seg-sm button{padding:6px 16px;font-size:13px}

/* TaskItem */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{width:100%;text-align:left;background:var(--surface-low);border:var(--stroke-hairline) solid var(--outline);border-radius:var(--radius-lg);padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;transition:border-color .15s,transform .1s;position:relative}
.task:hover{border-color:var(--ink)}
.task>.bdg{grid-column:1}
.task-title{grid-column:1;font:700 16px/22px var(--font-sans);color:var(--ink)}
.task-meta{grid-column:1;font:400 12px/16px var(--font-mono);color:var(--ink-subtle);font-variant-numeric:tabular-nums}
.task .chevron{grid-column:2;grid-row:1/4;color:var(--ink-muted)}
.task.is-done{background:transparent;border-style:dashed}
.task.is-done .task-title{color:var(--ink-muted);text-decoration:line-through}
.task.is-sel{background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal)}
.task.is-run{background:var(--caution-pale);border:var(--stroke-brutal) solid var(--border-brutal)}

.empty{border:var(--stroke-brutal) dashed var(--outline);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.meter{height:12px;background:var(--surface-high);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-full);overflow:hidden}
.meter i{display:block;height:100%;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--caution-strong),var(--alert-strong) 55%,var(--primary))}
.meter.over i{background:var(--error)}
.cap-num{font:800 30px/1 var(--font-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cap-num span{color:var(--ink-muted);font-weight:600}

.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;border-radius:var(--radius-lg);background:var(--secondary-container);color:var(--on-secondary-container,#002022);font-size:14px}

/* kv */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
.kv>div{background:var(--surface-container);border-radius:var(--radius-md);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv dt{font:600 10px/14px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);display:flex;align-items:center;gap:4px}
.kv dd{margin:0;font-weight:700;font-size:15px}
.kv-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv .wide{grid-column:1/-1}

/* painel + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.scrim.enter{animation:fade .2s ease-out}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--background);border-left:var(--stroke-brutal) solid var(--border-brutal);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.enter{animation:slideIn .3s cubic-bezier(.2,.8,.2,1)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px 14px 24px;border-bottom:var(--stroke-brutal) solid var(--border-brutal);background:var(--surface)}
.panel-body{flex:1;overflow-y:auto;padding:26px 24px;display:flex;flex-direction:column;gap:22px}
.panel-foot{padding:16px 24px;border-top:var(--stroke-brutal) solid var(--border-brutal);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);z-index:51;box-shadow:var(--shadow-brutal-lg);padding:26px;display:flex;flex-direction:column;gap:18px}
.modal.enter{animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-sm{width:min(440px,calc(100% - 32px))}
@keyframes fade{from{opacity:0}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.97);opacity:0}}

.perm{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:16px;border-radius:var(--radius-lg);background:var(--surface-low)}
.pro-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-muted);padding:10px 14px;border-radius:var(--radius-md);background:var(--caution-soft)}
.alert-box{display:flex;flex-direction:column;gap:12px;padding:18px;border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);background:var(--primary-container);box-shadow:var(--shadow-brutal)}
.alert-box .bubble{background:var(--surface)}
.alert-box .bubble::after{border-top-color:var(--surface)}

.sigline{display:flex;flex-direction:column;gap:2px;border-bottom:var(--stroke-brutal) solid var(--ink);padding-bottom:6px;max-width:320px}
.sig{width:220px;height:62px;color:var(--primary)}
.sig path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sig.draw path{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.1s .15s ease-out forwards}
.sig.draw path+path{animation-delay:1s;animation-duration:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
.sigline span{font:500 11px/1.3 var(--font-mono);color:var(--ink-muted);padding-top:4px}

/* pedido do navegador (simulado) */
.bprompt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:min(360px,calc(100% - 24px));background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);box-shadow:var(--shadow-brutal-lg);z-index:80;padding:16px;display:flex;flex-direction:column;gap:12px;animation:pop2 .2s ease-out}
@keyframes pop2{from{transform:translateY(-8px);opacity:0}}
.bprompt p{font-size:15px;display:flex;gap:10px;align-items:center}

/* ---------- Modo Pressão ---------- */
.detail .h2{font-size:24px}
.foco-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:start}
.foco-main{display:flex;flex-direction:column;gap:20px;align-items:flex-start;min-width:0;padding-top:4px}
.foco-title{font:800 clamp(24px,3vw,34px)/1.15 var(--font-sans);letter-spacing:-.02em}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;max-width:100%}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{stroke:var(--surface-highest)}
.ring-bar{stroke:var(--primary);transition:stroke-dashoffset .4s linear}
.foco-over .ring-bar{stroke:var(--tertiary)}
.foco-late .ring-bar{stroke:var(--error)}
.ring-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.ring-over{display:inline-flex;align-items:center;gap:4px;font:600 11px/16px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--primary);background:var(--primary-container);padding:2px 10px;border-radius:var(--radius-full)}
.ring-time{font:800 clamp(52px,8vw,72px)/1 var(--font-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring-cap{font:400 12px/16px var(--font-mono);color:var(--ink-muted)}
.pomo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font:500 13px/1.3 var(--font-mono);color:var(--ink-muted)}
.dots{display:inline-flex;gap:5px}
.dots i{width:22px;height:10px;border-radius:var(--radius-full);border:var(--stroke-brutal) solid var(--ink);display:block;background:var(--surface)}
.dots i.done{background:var(--ink)}
.dots i.cur{background:var(--primary)}
.foco-actions{display:flex;gap:12px;flex-wrap:wrap}
.quip{font:italic 500 15px/1.4 var(--font-sans);color:var(--ink-muted)}
.alarm{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:var(--radius-lg);flex-wrap:wrap;border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal)}
.alarm p{flex:1;min-width:200px;font:700 17px/1.35 var(--font-sans)}
.alarm-who{display:block;font:800 11px/1.3 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.alarm-over{background:var(--alert);color:var(--ink)}
.alarm-late{background:var(--primary-container);color:var(--primary)}
.alarm .sticker{font-size:16px;line-height:20px;padding:6px 14px}
.stats{margin:0;display:flex;flex-direction:column}
.stats>div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:var(--stroke-hairline) dashed var(--outline);align-items:baseline}
.stats>div:last-child{border-bottom:0}
.stats dt{font:600 10px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.stats dd{margin:0;font:800 22px/1 var(--font-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right}
.stats small{grid-column:1/-1;font:400 12px/1.3 var(--font-mono);color:var(--ink-muted);text-align:right}
.foco-over .st-remain dd{color:var(--tertiary)}
.foco-late .st-remain dd{color:var(--error)}
.track{position:relative;display:flex;gap:3px;height:12px;margin-top:4px}
.track-est{background:var(--surface-highest);border-radius:var(--radius-full)}
.track-tol{border-radius:var(--radius-full);background:repeating-linear-gradient(-45deg,var(--alert-strong) 0 2px,transparent 2px 5px);border:var(--stroke-hairline) solid var(--tertiary)}
.track-fill{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:var(--radius-full);transition:width .25s linear}
.foco-late .track-fill{background:var(--error)}
.track-legend{display:flex;justify-content:space-between;font:500 11px/1 var(--font-mono);color:var(--ink-muted)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-muted)}
.log li{display:flex;gap:8px}
.log time{font:500 12px var(--font-mono);color:var(--ink-subtle);flex:none}
.pip-link{align-self:flex-start}

/* pausa da tarefa (amarela) */
.pz-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.pz-main{background:var(--caution-soft);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal-lg);border-radius:var(--radius-md);padding:28px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.pz-icon{width:56px;height:56px;border-radius:var(--radius-full);background:var(--caution-strong);border:var(--stroke-brutal) solid var(--border-brutal);display:grid;place-items:center;box-shadow:var(--shadow-brutal-sm)}
.pz-clock{font:800 clamp(80px,13vw,150px)/.9 var(--font-mono);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pz-limit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font:500 13px var(--font-mono);color:var(--ink-muted)}
.pz-limit strong{font:800 30px/1 var(--font-mono);color:var(--tertiary);font-variant-numeric:tabular-nums}
.frozen{opacity:.75}
.frozen .stats dd{color:var(--ink-muted)}

/* pausa do pomodoro */
.pausa{max-width:760px;margin:0 auto;align-items:center;text-align:center;padding-top:40px}
.pausa .bubble{text-align:left}
.timer-xl{font:800 clamp(96px,16vw,180px)/.9 var(--font-mono);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pausa.is-exc .timer-xl{color:var(--error)}
.pausa .art{width:min(260px,70vw)}

/* ---------- cobranças ---------- */
.tabs{display:flex;gap:4px;border-bottom:var(--stroke-brutal) solid var(--surface-highest)}
.tabs button{border:0;background:none;padding:10px 14px;font:700 15px/1 var(--font-sans);color:var(--ink-muted);border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--primary)}
.cob{width:100%;text-align:left;background:var(--surface-low);border:var(--stroke-hairline) solid var(--outline);border-radius:var(--radius-lg);padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.cob:hover{border-color:var(--ink)}
.cob[aria-pressed="true"]{background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal)}
.cob-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cob time{font:500 12px var(--font-mono);color:var(--ink-subtle)}
.cob strong{font-size:16px;font-weight:700}
.cob small{font-size:13px;color:var(--ink-muted)}

.steps{display:flex;align-items:center;gap:8px;font:600 12px var(--font-mono);color:var(--ink-muted)}
.steps i{width:28px;height:8px;border-radius:var(--radius-full);background:var(--surface-highest);display:block}
.steps i.on{background:var(--primary)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{text-align:left;min-height:60px;padding:12px 18px;border-radius:var(--radius-lg);border:var(--stroke-hairline) solid var(--outline);background:var(--surface-low);font:700 15px/1.3 var(--font-sans);display:flex;align-items:center;gap:12px}
.opt::before{content:"";width:20px;height:20px;border-radius:50%;border:var(--stroke-brutal) solid var(--ink);background:var(--surface);flex:none}
.opt[aria-checked="true"]{background:var(--caution-pale);border:var(--stroke-brutal) solid var(--border-brutal)}
.opt[aria-checked="true"]::before{border:6px solid var(--primary);box-shadow:0 0 0 2px var(--ink)}
.opt:hover{border-color:var(--ink)}
.exc-ctx{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:var(--radius-md);background:var(--surface-low);border:var(--stroke-hairline) solid var(--outline)}
.exc-ctx p{font-size:15px;line-height:21px}
@media (min-width:861px){.exc-top{padding-right:150px}}
.plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.verdicts{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;padding:18px 0 8px}
.vstamp{font:800 clamp(24px,4vw,40px)/1 var(--font-mono);letter-spacing:.04em;padding:12px 22px;border:var(--stroke-brutal) dashed var(--outline);border-radius:var(--radius-full);color:var(--outline);transform:rotate(var(--tilt-sticker));background:transparent}
.vstamp:nth-child(2){transform:rotate(2deg)}
.vstamp:nth-child(3){transform:rotate(-1deg)}
.vstamp.is-on{border-style:solid;border-color:var(--border-brutal);box-shadow:var(--shadow-brutal);color:var(--on-primary)}
.vstamp.is-on.v-tolerada{background:var(--secondary)}
.vstamp.is-on.v-suspeita{background:var(--tertiary)}
.vstamp.is-on.v-rejeitada{background:var(--error)}
.vstamp:not(.is-on){opacity:.6}
.slam{animation:slam .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{0%{transform:scale(2.2) rotate(-12deg);opacity:0}55%{opacity:1}100%{opacity:1}}
.verd-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;max-width:680px;text-align:left}

.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-soft)}
table.data{width:100%;border-collapse:collapse;min-width:660px}
table.data th{font:600 10px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:14px 18px;border-bottom:var(--stroke-brutal) solid var(--ink)}
table.data td{padding:14px 18px;border-bottom:var(--stroke-hairline) dashed var(--outline);font-size:14px;vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover,table.data tbody tr:focus-visible{background:var(--surface-low)}
table.data td.when{font:500 12px var(--font-mono);color:var(--ink-muted);white-space:nowrap}

/* ---------- ponto ---------- */
.ledger{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.ledger>div{padding:16px 18px;background:var(--surface-container);border-radius:var(--radius-md);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ledger>div.full{grid-column:1/-1}
.ledger dt{font:600 11px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.ledger dd{margin:0;font:800 28px/1 var(--font-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ledger dd small{font:500 12px var(--font-mono);color:var(--ink-muted);margin-left:4px;letter-spacing:0}
.pend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:16px 20px;background:var(--surface-low);border:var(--stroke-hairline) solid var(--outline);border-radius:var(--radius-lg)}
.pend strong{display:block;font-size:16px}
.pend small{font:400 12px var(--font-mono);color:var(--ink-subtle)}
.timecard{width:min(380px,100%);background:var(--paper);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);padding:30px 22px 22px;position:relative;text-align:left;box-shadow:var(--shadow-brutal-lg);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--surface-highest) 35px 36px);background-position:0 70px}
.timecard::before{content:"";position:absolute;top:10px;left:50%;width:46px;height:10px;margin-left:-23px;border-radius:5px;background:var(--background);border:var(--stroke-brutal) solid var(--ink)}
.tc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:var(--stroke-brutal) solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.tc-head b{font:800 18px/1 var(--font-sans);letter-spacing:-.03em}
table.tc{width:100%;border-collapse:collapse}
table.tc th{font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);text-align:left;height:36px}
table.tc td{font:700 15px var(--font-mono);text-align:right;height:36px;font-variant-numeric:tabular-nums}
.tc-stamp{display:inline-block;background:var(--primary);color:var(--on-primary);border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal-sm);border-radius:var(--radius-full);padding:1px 10px;transform:rotate(-6deg);font:800 18px/1.3 var(--font-mono)}
.punch-in{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
.punch-in .tc-stamp{animation:slam .5s .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardIn{from{transform:translateY(-36px);opacity:0}}

/* ---------- primeiro uso ---------- */
.onb{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.onb-card{width:100%;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center;max-width:1080px}
.onb-copy{display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-width:0}
.memo{width:min(780px,100%);margin-inline:auto;padding:38px clamp(20px,5vw,58px) 42px;display:flex;flex-direction:column;gap:22px}
.memo-head{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:var(--stroke-brutal) dashed var(--outline);padding-bottom:14px}
.memo-head .over{color:var(--primary)}
.memo-meta{font:400 12px/1.4 var(--font-mono);color:var(--ink-muted)}
.rules{list-style:none;margin:0;padding:0;counter-reset:r;display:flex;flex-direction:column}
.rules li{counter-increment:r;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:baseline;padding:13px 0;border-bottom:var(--stroke-hairline) dashed var(--outline);font:600 18px/1.4 var(--font-sans)}
.rules li::before{content:counter(r) ".";font:800 26px/1 var(--font-mono);color:var(--primary)}
.memo-sign{display:flex;flex-direction:column;align-self:flex-end;align-items:flex-end}
.memo-sign .sig{width:180px;height:52px}
.memo-sign span{font:500 12px var(--font-mono);color:var(--ink-muted);border-top:var(--stroke-brutal) solid var(--ink);padding-top:4px}

/* ---------- semana / mês ---------- */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.day{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.is-today{border:var(--stroke-brutal) solid var(--border-brutal);box-shadow:var(--shadow-brutal);border-radius:var(--radius-md)}
.day.is-past{background:var(--surface-low);box-shadow:none}
.day-h{display:flex;flex-direction:column;gap:6px}
.day-name{font:800 17px/1 var(--font-sans);letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:6px}
.day-load{font:500 12px/1 var(--font-mono);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.day.is-over .day-load{color:var(--error);font-weight:700}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pi{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:var(--radius-sm);border:var(--stroke-hairline) solid var(--outline);font-size:13px;line-height:1.25;min-width:0;background:var(--surface-low)}
.pi>span:first-of-type{flex:1;min-width:0}
.pi.draft{border:var(--stroke-brutal) dashed var(--outline);background:transparent}
.pi.signed{background:var(--surface-container);border-color:transparent}
.pi.signed .mi{color:var(--ink-muted)}
.pi.done span:first-of-type{text-decoration:line-through;color:var(--ink-muted)}
.pi-est{font:500 11px var(--font-mono);color:var(--ink-muted);flex:none}
.pi-x{border:0;background:none;color:var(--ink-muted);width:22px;height:22px;border-radius:6px;flex:none;font-size:16px;line-height:1;padding:0}
.pi-x:hover{background:var(--danger-soft);color:var(--error)}
.add{border:var(--stroke-brutal) dashed var(--outline);background:none;border-radius:var(--radius-sm);min-height:36px;font:600 13px var(--font-sans);color:var(--ink-muted)}
.add:hover{color:var(--ink);border-color:var(--ink)}
.addf{display:flex;flex-direction:column;gap:6px}
.addf .input{min-height:40px;font-size:14px}
.month{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mcell{background:var(--surface);border-radius:var(--radius-md);padding:10px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.mcell.out{opacity:.35}
.mcell.is-today{border:var(--stroke-brutal) solid var(--border-brutal)}
.mcell b{font:800 18px/1 var(--font-sans)}
.mcell small{font:500 11px var(--font-mono);color:var(--ink-muted)}
.mcell .meter{height:8px;border-width:1px}
.mhead{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);padding:0 4px}

/* ---------- dossiê ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:0;border-radius:var(--radius-md);box-shadow:var(--shadow-soft);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{box-shadow:var(--shadow-soft),inset 0 0 0 2px var(--ink)}
.tile-num{font:800 32px/1 var(--font-sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile-sub{font:400 12px/1.3 var(--font-mono);color:var(--ink-muted)}
.tile-num.bad{color:var(--error)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.chart svg{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--surface-highest);stroke-width:1}
.ch-out{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.ch-fill{fill:var(--primary)}
.ch-fill.today{fill:var(--tertiary)}
.ch-lbl{fill:var(--ink-muted);font:500 11px var(--font-mono)}
.ch-val{fill:var(--ink);font:600 11px var(--font-mono)}
.ch-day{fill:var(--ink-muted);font:600 12px var(--font-mono)}
.ch-day.today{fill:var(--tertiary);font-weight:800}
.legend{display:flex;gap:16px;font:500 12px var(--font-mono);color:var(--ink-muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg-out{border:var(--stroke-brutal) solid var(--ink);background:var(--surface)}
.lg-fill{background:var(--primary)}
.hbars{display:flex;flex-direction:column;gap:11px}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px}
.hb-track{height:12px;background:var(--surface-highest);border-radius:var(--radius-full);overflow:hidden}
.hb-fill{height:100%;background:var(--ink-muted);border-radius:var(--radius-full)}
.hb b{font:600 12px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:11px 0;border-bottom:var(--stroke-hairline) dashed var(--outline);font-size:14px}
.notes li:last-child{border-bottom:0}
.notes time{font:500 12px var(--font-mono);color:var(--ink-subtle);padding-top:2px}
.notes .mi{color:var(--primary)}
.dossie-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;position:relative}
.dossie-head .sticker{position:absolute;top:-14px;left:150px}

/* ---------- expediente ---------- */
.setlist{display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-soft);overflow:hidden}
.setrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:16px 20px;border-bottom:var(--stroke-hairline) dashed var(--outline);cursor:pointer}
.setrow:focus-visible{box-shadow:inset 0 0 0 3px var(--ink)}
.setrow:hover{background:var(--surface-low)}
.setrow:last-child{border-bottom:0}
.setrow .v{font:500 13px var(--font-mono);color:var(--ink-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.setrow strong{font-weight:700}
.seted{padding:16px 20px;border-bottom:var(--stroke-hairline) dashed var(--outline);background:var(--surface-low);display:flex;flex-direction:column;gap:12px}
.seted .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.togrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:var(--stroke-hairline) dashed var(--outline)}
.togrow:last-child{border-bottom:0}

/* ---------- toasts / notificações / canto ---------- */
#toasts{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px 10px 10px;border-radius:var(--radius-full);display:flex;gap:11px;align-items:center;box-shadow:var(--shadow-brutal-sm);max-width:min(400px,calc(100vw - 40px));animation:toastIn .25s ease-out;pointer-events:auto}
.toast .avatar{border-color:var(--surface);box-shadow:none}
.toast strong{display:block;font:700 14px/1.3 var(--font-sans)}
.toast span{font-size:13px;opacity:.8}
.toast.out{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}}
@keyframes toastOut{to{transform:translateY(10px);opacity:0}}
#notifs{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:85;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ntf{width:min(340px,calc(100vw - 32px));background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);box-shadow:var(--shadow-brutal);padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 11px;animation:ntfIn .3s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
.ntf-ic{grid-row:1/4;width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.ntf small{font:500 11px var(--font-mono);color:var(--ink-muted)}
.ntf strong{font-size:14px;line-height:1.3}
.ntf p{font-size:13px;color:var(--ink-muted);line-height:1.35}
.ntf.out{animation:toastOut .25s forwards}
@keyframes ntfIn{from{transform:translateX(30px);opacity:0}}
.corner{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));z-index:45;background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);box-shadow:var(--shadow-brutal-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.corner.enter{animation:toastIn .3s ease-out}
.corner-tag{display:flex;flex-direction:column;gap:2px}
.corner-tag b{font:800 15px/1.3 var(--font-sans)}

/* ---------- janelinha fora da aba (PiP simulado) ---------- */
.pip-screen{position:fixed;inset:0;z-index:70;background:var(--surface-high);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pip-bar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:var(--stroke-brutal) solid var(--border-brutal)}
.pip-bar .dots3{display:flex;gap:6px}
.pip-bar .dots3 i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.pip-url{flex:1;max-width:520px;height:28px;border-radius:14px;background:var(--surface-high);font:500 12px/28px var(--font-mono);color:var(--ink-muted);padding:0 14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pip-doc{flex:1;overflow:hidden;padding:40px max(16px,6vw);display:flex;flex-direction:column;gap:14px}
.pip-doc .over{color:var(--ink-muted)}
.pip-doc i{display:block;height:14px;border-radius:7px;background:var(--surface-highest)}
.pip-win{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));background:var(--surface);border:var(--stroke-brutal) solid var(--border-brutal);border-radius:var(--radius-md);box-shadow:var(--shadow-brutal-lg);z-index:71;overflow:hidden;animation:toastIn .3s ease-out}
.pip-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--primary);color:var(--on-primary);font:700 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.pip-head button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.pip-head button:focus-visible{box-shadow:var(--focus-ring)}
.pip-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.pip-body strong{font:700 15px/1.3 var(--font-sans)}
.pip-time{font:800 44px/1 var(--font-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pip-win.paused{background:var(--caution-soft)}
.pip-win.paused .pip-head{background:var(--caution-strong);color:var(--ink);border-bottom:var(--stroke-brutal) solid var(--border-brutal)}
.pip-note{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:71;max-width:min(360px,calc(100% - 32px))}

/* ---------- roteiro (demo) ---------- */
.demo-btn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:30;border:var(--stroke-brutal) solid var(--border-brutal);background:var(--caution-soft);color:var(--ink);border-radius:var(--radius-full);box-shadow:var(--shadow-brutal-sm);padding:7px 14px;font:700 12px/1 var(--font-mono);letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.demo-btn:hover{filter:brightness(.96)}
.demo{position:fixed;top:0;right:0;bottom:0;width:min(390px,100%);background:var(--surface);border-left:var(--stroke-brutal) solid var(--border-brutal);z-index:95;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.demo.enter{animation:slideIn .25s ease-out}
.demo-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:var(--stroke-brutal) solid var(--border-brutal);font:700 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--caution-soft)}
.demo-body{overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:18px}
.demo-sec{display:flex;flex-direction:column;gap:8px}
.demo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.demo-list button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer}
.demo-list button:hover{background:var(--surface-low)}
.demo-list button:focus-visible{box-shadow:var(--focus-ring)}
.demo-list code{font:700 11px/1.6 var(--font-mono);color:var(--primary)}
.simclock{font:500 13px var(--font-mono);color:var(--ink-muted);font-variant-numeric:tabular-nums}

/* ---------- responsivo ---------- */
@media (max-width:1080px){
  .cols,.pz-grid{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .side{display:none}
  .main{grid-row:2}
  .app.is-onb{grid-template-rows:minmax(0,1fr)}
  .app.is-onb .main{grid-row:1}
  .topbar{grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-bottom:var(--stroke-brutal) solid var(--border-brutal);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .logo-mark{width:34px;height:34px}
  .topbar .logo-name{font-size:19px}
  .topbar .tb-r{display:flex;align-items:center;gap:10px}
  .topbar .tb-clock{font:700 13px var(--font-mono);color:var(--ink)}
  .tabbar{grid-row:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:var(--stroke-brutal) solid var(--border-brutal);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar .nav{flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:11px;border-radius:var(--radius-md);position:relative;justify-content:center;margin:4px 2px}
  .tabbar .nav .lbl{flex:none}
  .tabbar .nav.on{background:var(--primary);color:var(--on-primary)}
  .tabbar .nav.on .mi{color:var(--on-primary)}
  .tabbar .count{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:10px;line-height:18px;padding:0 4px}
  .view{padding-block:22px 64px;gap:20px}
  .foco-grid,.verd-wrap{grid-template-columns:minmax(0,1fr)}
  .opts,.plan{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles .tile:last-child{grid-column:1/-1}
  .week{grid-template-columns:minmax(0,1fr)}
  .month{gap:4px}
  .mcell{padding:6px;min-height:64px}
  .mcell small{font-size:10px}
  .onb-card{grid-template-columns:minmax(0,1fr);justify-items:center}
  .onb-card .art{max-width:280px}
  .ledger{grid-template-columns:minmax(0,1fr)}
  .kv-3{grid-template-columns:minmax(0,1fr)}
  .panel{width:100%}
  .demo-btn{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:16px;left:16px;align-items:stretch}
  .corner{right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .hb{grid-template-columns:minmax(0,110px) minmax(0,1fr) 26px}
  .dossie-head .sticker{left:auto;right:0}
  .pz-main{padding:20px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .sig.draw path{stroke-dashoffset:0}
}

  <aside id="side" class="side" aria-label="Navegação"></aside>

</div>

<div id="notifs" aria-live="polite"></div>
<div id="toasts" aria-live="polite"></div>
<button id="demoBtn" class="demo-btn" type="button" data-act="demo"><span class="mi ic-s" aria-hidden="true">view_list</span> Roteiro · telas</button>

<script>
(function(){
'use strict';
document.documentElement.lang='pt-BR';

/* ================= utilidades ================= */
const MIN=60000;
const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const WDS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MOL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ORD=['primeira','segunda','terceira','quarta','quinta','sexta','sétima','oitava','nona','décima'];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const $=(s,r=document)=>r.querySelector(s);
function now(){return S.clock.sim+(Date.now()-S.clock.real)*S.clock.speed;}
function hhmm(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function dateLong(ms){const d=new Date(ms==null?now():ms);return `${WD[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]}`;}
function dateFull(ms){const d=new Date(ms==null?now():ms);return `${WD[d.getDay()]}, ${d.getDate()} de ${MOL[d.getMonth()]}`;}
function dayKey(ms){const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function keyDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12).getTime();}
function today(){return dayKey(now());}
function atDay(base,off,h,m){const d=new Date(base);d.setDate(d.getDate()+off);d.setHours(h,m,0,0);return d.getTime();}
function at(h,m,off){return atDay(now(),off||0,h,m);}
function clockMs(ms){const neg=ms<0;const s=Math.floor(Math.abs(ms)/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (neg?'+':'')+(h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`);}
function fmtMin(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;if(!h)return `${m} min`;if(!m)return `${h}h`;return `${h}h${pad(m)}`;}
function fmtShort(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;if(!h)return `${m}m`;if(!m)return `${h}h`;return `${h}h${pad(m)}`;}
function minSec(ms){const s=Math.max(0,Math.round(ms/1000));const m=Math.floor(s/60),x=s%60;return m?`${m} min ${x} s`:`${x} s`;}
function sum(a,f){return a.reduce((t,x)=>t+(f?f(x):x),0);}
function dayLabel(ms){const k=dayKey(ms),t=today();if(k===t)return 'Hoje';if(k===dayKey(at(12,0,-1)))return 'Ontem';return WDS[new Date(ms).getDay()];}
const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
function ext(n){n=Math.round(n);if(n<20)return U[n];if(n<100)return D[Math.floor(n/10)]+(n%10?' e '+U[n%10]:'');return String(n);}
function extF(n){return ext(n).replace(/\bum$/,'uma').replace(/\bdois$/,'duas');}
function hm2min(s){const [h,m]=s.split(':').map(Number);return h*60+m;}
function workdayMin(st){st=st||S.settings;return hm2min(st.end)-hm2min(st.start);}
function endOfDay(){const [h,m]=S.settings.end.split(':').map(Number);return at(h,m);}
function weekMonday(ms){const d=new Date(ms);const dow=d.getDay();const off=dow===0?-6:1-dow;return atDay(ms,off,12,0);}
function weekDays(){const mon=weekMonday(now());return [0,1,2,3,4].map(i=>{const ms=atDay(mon,i,12,0);return {key:dayKey(ms),ms,label:`${WDS[new Date(ms).getDay()]} ${new Date(ms).getDate()}`};});}
function weekRange(){const w=weekDays();const a=new Date(w[0].ms),b=new Date(w[4].ms);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MO[b.getMonth()]}`:`${a.getDate()} ${MO[a.getMonth()]} – ${b.getDate()} ${MO[b.getMonth()]}`;}

/* ================= ícones, ilustrações, fala do chefe ================= */
const ICN={prancheta:'assignment',pressao:'timer',cobrancas:'receipt_long',dossie:'folder_open',expediente:'schedule',lock:'lock',x:'close',plus:'add',chev:'chevron_right',back:'chevron_left',play:'play_arrow',pause:'pause',check:'check',pen:'signature',bell:'notifications',card:'punch_clock',idea:'lightbulb',out:'open_in_new',warn:'warning',boss:'campaign'};
function ic(n,cls){return `<span class="mi ${cls||''}" aria-hidden="true">${ICN[n]||n}</span>`;}
const ART={relogio:'assets/chefe-relogio.png',megafone:'assets/chefe-megafone.png',binoculos:'assets/chefe-binoculos.png'};
function art(k,sticker,alt){return `<div class="art"><img src="${ART[k]}" alt="${alt||'Ilustração do Dr. Alberto'}" width="320" height="320">${sticker?`<span class="sticker alt">${sticker}</span>`:''}</div>`;}
function avatar(cls){return `<span class="avatar ${cls||''}" role="img" aria-label="Dr. Alberto"><img src="${ART.relogio}" alt=""></span>`;}
function boss(text,o){o=o||{};return `<figure class="bubble ${o.lg?'bubble-lg':''} ${o.brutal?'bubble-brutal':''}"><figcaption class="bubble-who">${ic('boss','ic-s')} Dr. Alberto</figcaption><p>${text}</p></figure>`;}

function task(id){return S.tasks.find(t=>t.id===id);}

function taskWork(t){const r=S.run;return t.workMs+(r&&r.taskId===t.id&&r.phase==='work'?now()-r.phaseStart:0);}
function workNow(){return S.run?taskWork(task(S.run.taskId)):0;}
function blockLeft(){const r=S.run;return S.settings.pomo[0]*MIN-(workNow()-r.blockBase);}
function breakLen(k){return (k==='longa'?S.settings.pomo[2]:S.settings.pomo[1])*MIN;}

function queue(){const k=today();return S.tasks.filter(t=>t.day===k&&(t.status==='fila'||t.status==='exec')).sort((a,b)=>{const ra=S.run&&S.run.taskId===a.id?0:1,rb=S.run&&S.run.taskId===b.id?0:1;if(ra!==rb)return ra-rb;const oa=a.origin==='ontem'?0:1,ob=b.origin==='ontem'?0:1;if(oa!==ob)return oa-ob;return a.signedAt-b.signedAt;});}
function openCobs(){return S.cobs.filter(c=>c.status==='aberta').sort((a,b)=>a.at-b.at);}
function historyCobs(){return S.cobs.filter(c=>c.status==='explicada').sort((a,b)=>(b.explainedAt||b.at)-(a.explainedAt||a.at));}

function createTask(title,est,tol,notify,extra){const t=Object.assign({id:uid('t'),title,est,tol,notify,signedAt:now(),status:'fila',origin:'hoje',day:today(),workMs:0,freeMs:0,startedAt:null,deliveredAt:null,pomos:0,pauseMs:0,pauseCount:0,intr:0},extra||{});S.tasks.push(t);return t;}
function addCob(o){const c=Object.assign({id:uid('c'),at:now(),status:'aberta'},o);S.cobs.push(c);return c.id;}
function cobLine(c){
  const t=c.taskId&&task(c.taskId);
  if(c.type==='atraso'&&t)return `Estimativa ${fmtMin(t.est)} · real ${fmtMin(taskWork(t)/MIN)}`;
  if(c.type==='excedente')return `${c.title} de ${c.baseMin} min · +${minSec(c.amountMs||0)}`;
  if(c.type==='abandono')return 'Não entregue · abandonada no ponto';
  return c.detail||'';
}

function endPhase(){const r=S.run;if(!r)return;const t=task(r.taskId);if(r.phase==='work'){const dt=now()-r.phaseStart;t.workMs+=dt;if(!r.pomo)t.freeMs=(t.freeMs||0)+dt;}r.phaseStart=now();}
function startTask(id){
  const t=task(id);if(!t)return;
  t.status='exec';if(!t.startedAt)t.startedAt=now();
  const pomo=S.ui.pomoPref!==false;
  S.run={taskId:id,pomo,block:1,blockBase:t.workMs,phase:'work',phaseStart:now(),estWarned:t.workMs>t.est*MIN,lateCob:null,excCob:null,limitCob:null};
}
function toBreak(){endPhase();const r=S.run;const t=task(r.taskId);t.pomos++;r.phase='break';r.breakKind=r.block%4===0?'longa':'curta';r.excCob=null;}
function backFromBreak(){
  const r=S.run;const n=now();const ms=n-r.phaseStart;const len=breakLen(r.breakKind);
  S.breaks.push({at:r.phaseStart,kind:r.breakKind,ms,excMs:Math.max(0,ms-len),taskId:r.taskId});
  if(r.excCob){const c=cob(r.excCob);if(c)c.amountMs=Math.max(0,ms-len);}
  r.block=r.block%4+1;r.blockBase=task(r.taskId).workMs;r.phase='work';r.phaseStart=n;r.excCob=null;
}
function pauseTask(cat,note){endPhase();const r=S.run;r.phase='pause';r.pauseCat=cat;r.pauseNote=note;r.limitCob=null;}
function resumeTask(){
  const r=S.run;const n=now();const ms=n-r.phaseStart;const t=task(r.taskId);
  S.pauses.push({at:r.phaseStart,cat:r.pauseCat,note:r.pauseNote,ms,taskId:r.taskId});
  t.pauseCount++;t.pauseMs+=ms;
  if(r.limitCob){const c=cob(r.limitCob);if(c)c.amountMs=Math.max(0,ms-S.settings.pauseLimit*MIN);}
  r.phase='work';r.phaseStart=n;r.limitCob=null;
}
function stopRun(){
  const r=S.run;if(!r)return null;
  if(r.phase==='break')backFromBreak();
  else if(r.phase==='pause')resumeTask();
  const blockEl=workNow()-r.blockBase;
  endPhase();
  const t=task(r.taskId);
  if(r.pomo&&blockEl>60000)t.pomos++;
  S.run=null;return t;
}
function deliver(){const t=stopRun();if(!t)return;t.status='entregue';t.deliveredAt=now();S.ui.lastDelivered=t.id;S.ui.corner=null;S.ui.pip=null;}

function statsToday(){
  const k=today();
  const ts=S.tasks.filter(t=>t.day===k&&t.status!=='excluida');
  const del=ts.filter(t=>t.status==='entregue');
  const worked=ts.filter(t=>taskWork(t)>0);
  const real=sum(worked,t=>taskWork(t)),est=sum(worked,t=>t.est*MIN);
  const free=sum(worked,t=>(t.freeMs||0)+(S.run&&S.run.taskId===t.id&&S.run.phase==='work'&&!S.run.pomo?now()-S.run.phaseStart:0));
  const br=S.breaks.filter(b=>dayKey(b.at)===k);
  const pa=S.pauses.filter(p=>dayKey(p.at)===k);
  const exc=br.filter(b=>b.excMs>0).map(b=>b.excMs).concat(pa.filter(p=>p.ms>S.settings.pauseLimit*MIN).map(p=>p.ms-S.settings.pauseLimit*MIN));
  const cobsT=S.cobs.filter(c=>dayKey(c.at)===k);
  return {p:ts.length,e:del.length,estM:est/MIN,realM:real/MIN,pomoM:(real-free)/MIN,livreM:free/MIN,
    intr:S.interrupts.filter(i=>dayKey(i.at)===k).length,
    atrasos:cobsT.filter(c=>c.type==='atraso').length,aband:cobsT.filter(c=>c.type==='abandono').length,
    brN:br.length,brMs:sum(br,b=>b.ms),paN:pa.length,paMs:sum(pa,p=>p.ms),excN:exc.length,excMs:sum(exc)};
}
function verdictOf(c,e){
  let score=0;const plan=(e.se||'').trim().length>=4&&(e.faco||'').trim().length>=4;
  if(plan)score+=2;
  if((e.relato||'').trim().length>=80)score+=1;
  if(e.cat==='Fui fraco mesmo')score+=1;
  const wk=now()-7*24*60*MIN;
  const rep=S.cobs.filter(x=>x.status==='explicada'&&x.excuse&&x.excuse.cat===e.cat&&(x.explainedAt||x.at)>wk).length;
  if(rep>=3)score-=2;else if(rep>=2)score-=1;
  if((e.relato||'').trim().length<40&&!plan)score-=1;
  return {v:score>=2?'tolerada':score>=0?'suspeita':'rejeitada',rep,plan};
}
function verdictQuote(c){
  const e=c.excuse||{};const v=c.verdict;
  if(v==='tolerada'){
    if(e.cat==='Fui fraco mesmo')return 'Pelo menos é sincero. Passa.';
    if(e.cat==='Interrupção externa')return 'Interrupção, com plano para a próxima. Passa. Desta vez.';
    if(e.cat==='Estimativa errada')return 'Errou a conta e assumiu. Passa. Ajusta o relógio interno.';
    return 'Explicação aceita. Passa. Desta vez.';
  }
  if(v==='suspeita')return c._rep>=2?`${e.cat} de novo? Hmm. Essa eu já ouvi.`:'Hmm. Essa eu já ouvi.';
  return 'Não colou. Mas está registrado que você tentou.';
}
function dayVerdict(st){
  const r=st.p?st.e/st.p:1;
  if(st.p&&r===1&&!st.atrasos)return {v:'Dia sem ressalvas',tone:'secondary',q:'Tudo entregue, nada atrasado. Não vou elogiar. Mas anotei.'};
  if(r>=.5)return {v:'Dia tolerado',tone:'tertiary',q:`${cap(ext(st.e))} de ${ext(st.p)}. Já vi piores. Já vi melhores também.`};
  return {v:'Dia rejeitado',tone:'error',q:`${cap(ext(st.e))} de ${ext(st.p)}. Amanhã a gente conversa.`};
}
