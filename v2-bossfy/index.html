function taskMeta(t){
  const run=S.run&&S.run.taskId===t.id;
  if(t.status==='entregue')return `est. ${fmtMin(t.est)} · real ${fmtMin(t.workMs/MIN)}`;
  if(run)return `<span data-t="side-run"></span> · est. ${fmtMin(t.est)} · tolerância ${t.tol} min`;
  return `est. ${fmtMin(t.est)} · assinada ${t.origin==='ontem'?'ontem ':''}${hhmm(t.signedAt)}`;
}
function taskCard(t){
  const run=S.run&&S.run.taskId===t.id;
  return `<li><button class="task ${t.status==='entregue'?'is-done':''} ${run?'is-run':''}" data-act="abrir" data-arg="${t.id}">${taskStamp(t)}<span class="task-title">${esc(t.title)}</span><span class="task-meta">${taskMeta(t)}</span>${ic('chev','chevron')}</button></li>`;
}
function vPrancheta(){
  const k=today();const fila=queue();
  const done=S.tasks.filter(t=>t.day===k&&t.status==='entregue').sort((a,b)=>b.deliveredAt-a.deliveredAt);
  const other=S.tasks.filter(t=>t.day===k&&(t.status==='amanha'||t.status==='abandonada'));
  return `<div class="view">
  ${head(dateLong(),'Prancheta do Chefe',proBtn())}
  ${planSeg('hoje')}
  ${closedBanner()}
  <div class="cols">
    <section class="col-main" aria-label="Tarefas do dia">
      <div class="list-head"><span class="over">Na fila · ${fila.length}</span><span class="over">${ic('lock','ic-xs')} assinadas</span></div>
      ${fila.length?`<ol class="tasks">${fila.map(taskCard).join('')}</ol>`:`<div class="empty">${boss(pick('vazia'))}<button class="btn btn-ghost" data-act="nova" ${S.closed?'disabled':''}>${ic('plus','ic-s')} Nova tarefa</button></div>`}
      ${done.length?`<div class="list-head"><span class="over">Entregues hoje · ${done.length}</span></div><ol class="tasks">${done.map(taskCard).join('')}</ol>`:''}
      ${other.length?`<div class="list-head"><span class="over">Fora da fila · ${other.length}</span></div><ol class="tasks">${other.map(taskCard).join('')}</ol>`:''}
    </section>
    <aside class="col-side">
      <div class="card card-brutal"><div class="card-head">${ic('pen')}<h2 class="h3">Uma tarefa, uma assinatura.</h2></div><p class="sub">Diz o que é e quanto tempo leva. O prazo é o fim da sua estimativa.</p>
        <button class="btn btn-primary btn-lg btn-block" data-act="nova" ${S.closed?'disabled':''}>${ic('plus')} Nova tarefa</button></div>
      ${boss(pick('prancheta'))}
    </aside>
  </div></div>`;
}
function capacityCard(){
  const k=today();const capM=workdayMin();
  const used=sum(S.tasks.filter(t=>t.day===k&&!['excluida','amanha'].includes(t.status)),t=>t.est);
  const drafts=(S.week[k]||[]).filter(x=>!x.signed);
  const tot=used+sum(drafts,x=>x.est);const over=tot>capM;
  return `<div class="card"><span class="over">Capacidade de hoje · PRO</span>
    <div class="cap-num">${fmtShort(tot)} <span>/ ${fmtShort(capM)}</span></div>
    <div class="meter ${over?'over':''}"><i style="width:${Math.min(100,tot/capM*100)}%"></i></div>
    <p class="fine">${over?`Passou ${fmtMin(tot-capM)} do expediente. Vai prometer o que não cabe?`:`Cabem mais ${fmtMin(capM-tot)} hoje, contando os rascunhos.`}</p></div>`;
}

function vSemana(){
  if(!S.pro)return vPrancheta();
  const mode=S.ui.pmode||'semana';const days=weekDays();const capM=workdayMin();const tk=today();
  let drafts=0;days.forEach(d=>{if(d.key>=tk)drafts+=(S.week[d.key]||[]).filter(x=>!x.signed).length;});
  const body=mode==='semana'?`<div class="week">${days.map(d=>dayCol(d,capM,tk)).join('')}</div>
    <div class="row" style="justify-content:space-between"><p class="note">Tracejado = rascunho · ${ic('lock','ic-xs')} = já assinada · dia em vermelho passa da capacidade</p>
    <button class="btn btn-primary btn-lg" data-act="signWeek" ${drafts?'':'disabled'}>${ic('pen')} Assinar plano da semana (${drafts})</button></div>`:monthView(capM);
  return `<div class="view">
  ${head(mode==='semana'?`Semana ${weekRange()}`:cap(MOL[new Date(now()).getMonth()]),mode==='semana'?'Plano da semana':'Plano do mês',proBtn())}
  ${planSeg('semana')}
  ${closedBanner()}
  <div class="cols" style="align-items:center">
    <div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0">
      <div class="seg seg-sm" role="tablist" aria-label="Visão"><button role="tab" aria-selected="${mode==='semana'}" data-act="pmode" data-arg="semana">Semana</button><button role="tab" aria-selected="${mode==='mes'}" data-act="pmode" data-arg="mes">Mês</button></div>
      ${boss('Promoção aceita. Promessa grande, cobrança maior. Assina tudo de uma vez e eu cobro tudo de uma vez.')}
    </div>
    ${capacityCard()}
  </div>
  ${body}</div>`;
}
function dayItems(key){
  const plan=S.week[key]||[];
  if(key===today()){
    const real=S.tasks.filter(t=>t.day===key&&!['excluida','amanha'].includes(t.status)).map(t=>({id:t.id,title:t.title,est:t.est,signed:true,real:true,done:t.status==='entregue'}));
    return real.concat(plan.filter(x=>!x.signed));
  }
  return plan;
}
function dayCol(d,capM,tk){
  const items=dayItems(d.key);const tot=sum(items,x=>x.est);const over=tot>capM;const past=d.key<tk;const isT=d.key===tk;
  return `<section class="day ${past?'is-past':''} ${isT?'is-today':''} ${over?'is-over':''}" aria-label="${d.label}">
    <div class="day-h"><span class="day-name">${d.label}${isT?bdg('hoje','neutral'):''}</span><span class="day-load">${fmtShort(tot)} / ${fmtShort(capM)}${over?' · não cabe':''}</span><div class="meter ${over?'over':''}"><i style="width:${Math.min(100,tot/capM*100)}%"></i></div></div>
    <ul>${items.map(x=>`<li class="pi ${x.signed?'signed':'draft'} ${x.done?'done':''}">${x.signed?ic('lock','ic-xs'):''}<span>${esc(x.title)}</span><span class="pi-est">${fmtShort(x.est)}</span>${!x.signed&&!past?`<button class="pi-x" data-act="rmDraft" data-arg="${d.key}|${x.id}" aria-label="Remover rascunho ${esc(x.title)}">×</button>`:''}</li>`).join('')}</ul>
    ${past?'<p class="fine">Dia encerrado.</p>':S.ui.addDay===d.key?addForm(d.key):`<button class="add" data-act="addDay" data-arg="${d.key}">+ adicionar</button>`}
  </section>`;
}
function addForm(key){const a=S.ui.add||{title:'',est:60};return `<div class="addf"><label class="sr" for="add-title">Título do rascunho</label><input id="add-title" class="input" data-model="ui.add.title" data-enter="addDraft" value="${esc(a.title)}" placeholder="O que vai prometer?" maxlength="70" autocomplete="off">
  <label class="sr" for="add-est">Estimativa</label><select id="add-est" class="input" data-model="ui.add.est" data-num>${[15,30,45,60,90,120,180,240].map(v=>`<option value="${v}" ${v==a.est?'selected':''}>${fmtMin(v)}</option>`).join('')}</select>
  <div class="row"><button class="btn btn-primary btn-sm" data-act="addDraft" ${a.title.trim().length<3?'disabled':''}>Adicionar rascunho</button><button class="btn btn-link btn-sm" data-act="cancelAdd">Cancelar</button></div></div>`;}
function monthView(capM){
  const n=new Date(now());const y=n.getFullYear(),m=n.getMonth();const tk=today();
  const first=new Date(y,m,1,12);const last=new Date(y,m+1,0,12).getDate();
  let cells=[];let lead=(first.getDay()+6)%7;if(lead>4)lead=0;
  for(let i=0;i<lead;i++)cells.push('<div class="mcell out" aria-hidden="true"></div>');
  const wk=weekDays().map(d=>d.key);
  for(let d=1;d<=last;d++){
    const dt=new Date(y,m,d,12);const dow=dt.getDay();if(dow===0||dow===6)continue;
    const k=dayKey(dt.getTime());let tot,txt;
    if(wk.includes(k)){tot=sum(dayItems(k),x=>x.est);}
    else if(k<tk){tot=240+((d*37)%5)*45;}
    else tot=((d*13)%4)*60;
    txt=tot?`${fmtShort(tot)} / ${fmtShort(capM)}`:'livre';
    cells.push(`<div class="mcell ${k===tk?'is-today':''}"><b>${d}</b><small>${txt}</small><div class="meter ${tot>capM?'over':''}"><i style="width:${Math.min(100,tot/capM*100)}%"></i></div></div>`);
  }
  return `<div class="month">${['Seg','Ter','Qua','Qui','Sex'].map(x=>`<span class="mhead">${x}</span>`).join('')}${cells.join('')}</div>
  <p class="note">Dias passados mostram o que foi assinado. A semana atual se edita na visão Semana.</p>`;
}

/* ---- Modo Pressão ---- */
function vPressao(){
  const q=queue();const r=S.run;
  if(!q.length&&!r)return vZerada();
  let sel=r?task(r.taskId):(q.find(t=>t.id===S.ui.sel)||q[0]);
  const adi=q.filter(t=>t.origin==='ontem').length;
  const cards=q.map(t=>{
    const isRun=r&&r.taskId===t.id;
    if(isRun)return `<li><button class="task is-run" data-act="foco">${bdg(`Em execução · <span data-t="side-run"></span>`,'primary')}<span class="task-title">${esc(t.title)}</span><span class="task-meta">Clique para voltar ao foco</span>${ic('chev','chevron')}</button></li>`;
    return `<li><button class="task ${!r&&sel&&sel.id===t.id?'is-sel':''}" data-act="${r?'umaDeCada':'sel'}" data-arg="${t.id}" ${!r?`aria-pressed="${sel&&sel.id===t.id}"`:''}>${taskStamp(t)}<span class="task-title">${esc(t.title)}</span><span class="task-meta">est. ${fmtMin(t.est)} · tolerância ${t.tol} min</span></button></li>`;
  }).join('');
  return `<div class="view">
  ${head(`${dateLong()} · <span data-t="hhmm"></span>`,'Modo Pressão',`<p class="sub">${q.length} assinada${q.length>1?'s':''}${adi?` · ${adi} adiada de ontem`:''}</p>`)}
  ${closedBanner()}
  <div class="cols">
    <section class="col-main" aria-label="Fila"><ol class="tasks">${cards}</ol><p class="note">${ic('lock','ic-xs')} Tarefa nova? Só pela Prancheta. E assinada.</p></section>
    <aside class="col-side">${r?`<div class="card card-brutal">${boss('Uma de cada vez. Termina a que está aberta.')}<button class="btn btn-primary btn-lg btn-block" data-act="foco">${ic('play')} Voltar ao foco</button></div>`:selDetail(sel)}</aside>
  </div></div>`;
}
function selDetail(t){
  const pomo=S.ui.pomoPref!==false;
  return `<div class="card card-brutal detail">${bdg('Selecionada','neutral')}<h2 class="h2">${esc(t.title)}</h2>
    <dl class="kv"><div class="wide"><dt>Prazo</dt><dd>fim da estimativa, após iniciar</dd></div><div><dt>Estimativa</dt><dd>${fmtMin(t.est)}</dd></div><div><dt>Tolerância</dt><dd>${t.tol} min</dd></div></dl>
    <div class="switch-row"><div><strong id="pomo-l">Pomodoro</strong><p>${pomo?`Bloco 1 de 4 · ${S.settings.pomo[0]} min de foco, ${S.settings.pomo[1]} de pausa`:'Desligado. Herói sem intervalo.'}</p></div>${sw('pomoPref',pomo,'pomo-l')}</div>
    ${boss('Escolha uma. Só uma.')}
    <button class="btn btn-primary btn-lg btn-block" data-act="iniciar" data-arg="${t.id}" ${S.closed?'disabled':''}>${ic('play')} Iniciar</button>
    <p class="fine">Antes de iniciar não existe atraso: o prazo nasce no início.</p></div>`;
}
const RING_C=2*Math.PI*139;
function ringProg(){const r=S.run;if(!r)return 0;const t=task(r.taskId);if(r.pomo)return Math.max(0,blockLeft()/(S.settings.pomo[0]*MIN));return Math.max(0,(t.est*MIN-workNow())/(t.est*MIN));}
function taskStats(t,frozen){
  return `<dl class="stats">
        <div class="st-remain"><dt>Restante</dt><dd data-t="${frozen?'':'remain'}">${frozen?esc(frozen):''}</dd><small data-t="${frozen?'':'prazo'}">${frozen?'parado':''}</small></div>
        <div><dt>Estimativa</dt><dd>${fmtMin(t.est)}</dd></div>
        <div><dt>Decorrido na tarefa</dt><dd data-t="elapsed"></dd></div>
        <div><dt>Tolerância</dt><dd>${t.tol} min</dd></div>
      </dl>`;
}
function vFoco(){
  const r=S.run;if(!r)return vPressao();
  if(r.phase==='break')return vPausaPomo();
  if(r.phase==='pause')return vPausada();
  const t=task(r.taskId);const w=workNow();const est=t.est*MIN,tol=t.tol*MIN;
  const state=w>est+tol?'late':w>est?'over':'ok';
  const alarm=state==='ok'?'':`<div class="alarm alarm-${state}" role="status">${avatar()}<p><span class="alarm-who">Dr. Alberto</span>${state==='late'?'Atrasada. Estimativa e tolerância já foram embora.':'Estimativa estourou há <span data-t="overmin"></span>. Otimismo não é método.'}</p><span class="sticker ${state==='late'?'':'caution'}" data-t="overchip"></span></div>`;
  const prog=ringProg();
  const ints=S.interrupts.filter(i=>i.taskId===t.id),pas=S.pauses.filter(p=>p.taskId===t.id);
  const logs=[...ints.map(i=>({at:i.at,txt:`Interrupção · ${i.type}${i.note?': '+i.note:''}`})),...pas.map(p=>({at:p.at,txt:`Pausa · ${p.cat} · ${minSec(p.ms)}`}))].sort((a,b)=>a.at-b.at);
  return `<div class="view foco foco-${state}">
  ${alarm}
  <div class="foco-grid">
    <section class="foco-main">${bdg('Em execução','primary')}<h1 class="foco-title">${esc(t.title)}</h1>
      <div class="ring"><svg viewBox="0 0 300 300" aria-hidden="true"><circle class="ring-track" cx="150" cy="150" r="139" fill="none" stroke-width="20"/><circle class="ring-bar" data-ring="main" cx="150" cy="150" r="139" fill="none" stroke-width="20" stroke-linecap="round" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${(RING_C*(1-prog)).toFixed(1)}"/></svg>
        <div class="ring-face" role="timer"><span class="ring-over">${ic('timer','ic-xs')} ${r.pomo?`Bloco ${r.block} de 4`:'Estimativa'}</span><span class="ring-time" data-t="${r.pomo?'block':'remain-big'}"></span><span class="ring-cap">${r.pomo?'foco do pomodoro':'restante da estimativa'}</span></div></div>
      <div class="pomo-row">${r.pomo?`<span>Pomodoro · bloco ${r.block} de 4</span><span class="dots" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<r.block?'done':i===r.block?'cur':''}"></i>`).join('')}</span>`:'<span>Pomodoro desligado · contando a estimativa</span>'}<span class="row" style="gap:8px"><span id="pr-l" class="fine">Pomodoro</span>${sw('pomoRun',r.pomo,'pr-l')}</span></div>
      ${!r.pomo?'<p class="quip">Herói sem intervalo. Vamos ver até quando.</p>':''}
      <div class="foco-actions"><button class="btn btn-primary btn-lg" data-act="entregar">${ic('check')} Entregar <kbd>E</kbd></button><button class="btn btn-caution btn-lg" data-act="desculpa">${ic('pause')} Dar desculpa <kbd>P</kbd></button></div>
      <button class="btn btn-link" data-act="registro">${ic('plus','ic-s')} Registrar interrupção ou ideia <kbd>I</kbd></button>
      <button class="btn btn-link pip-link" data-act="pipOpen">${ic('out','ic-s')} Ver a janelinha fora da aba (simulação)</button>
    </section>
    <aside class="card" aria-label="Números da tarefa">
      ${taskStats(t)}
      <div class="track" aria-hidden="true"><div class="track-est" style="flex:${t.est}"></div><div class="track-tol" style="flex:${t.tol}"></div><i class="track-fill" data-tw="fill"></i></div>
      <div class="track-legend" aria-hidden="true"><span>início</span><span>estimativa</span><span>tolerância</span></div>
      <p class="fine">Passou da estimativa: aviso. Passou da tolerância: cobrança de atraso. Nada interrompe o trabalho.</p>
      ${logs.length?`<span class="over">Registro desta tarefa</span><ul class="log">${logs.map(l=>`<li><time>${hhmm(l.at)}</time><span>${esc(l.txt)}</span></li>`).join('')}</ul>`:''}
    </aside>
  </div></div>`;
}
function vPausada(){
  const r=S.run;const t=task(r.taskId);const w=workNow();const est=t.est*MIN;
  const frozen=w<=est?clockMs(est-w):`+${Math.floor((w-est)/MIN)} min`;
  return `<div class="view">
  <header class="vh"><div class="vh-l">${bdg(`${ic('pause','ic-xs')} Em pausa · ${esc(r.pauseCat)}`,'caution',{lg:true})}<h1 class="foco-title">${esc(t.title)}</h1></div></header>
  <div class="pz-grid">
    <section class="pz-main" aria-label="Pausa">
      <div class="row" style="gap:14px"><span class="pz-icon">${ic('pause','ic-l fill')}</span><span class="over" style="color:var(--ink)">Tempo em pausa</span></div>
      <div class="pz-clock" data-t="pelapsed" role="timer"></div>
      <div class="pz-limit"><span>Limite de pausa · ${pad(S.settings.pauseLimit)}:00</span><strong data-t="plimit"></strong><span data-t="plimit-l"></span></div>
      ${r.pauseNote?`<p class="sub">Motivo: ${esc(r.pauseNote)}</p>`:''}
      ${boss('Pausa tem limite. Paciência também.',{brutal:true})}
      <button class="btn btn-primary btn-lg" data-act="voltarTrabalho">${ic('play')} Voltar ao trabalho</button>
      <button class="btn btn-link pip-link" data-act="pipOpen">${ic('out','ic-s')} Ver a janelinha fora da aba (simulação)</button>
    </section>
    <aside class="card frozen" aria-label="Tarefa congelada">
      ${bdg(`${ic('ac_unit','ic-xs')} Tarefa congelada`,'neutral',{soft:true})}
      ${taskStats(t,frozen)}
      <p class="fine">O cronômetro da tarefa espera você. O da pausa, não.</p>
    </aside>
  </div></div>`;
}
function vPausaPomo(){
  const r=S.run;const t=task(r.taskId);const len=breakLen(r.breakKind);const exc=now()-r.phaseStart>len;
  if(exc)return `<div class="view pausa is-exc">${bdg('Excedente','error',{lg:true})}<div class="timer-xl" data-t="break"></div><p class="lead">Passou do tempo. Isso vai para as cobranças.</p><p class="eyebrow" data-t="break-desc"></p>${boss('O café esfriou e a desculpa também.')}<button class="btn btn-primary btn-lg" data-act="voltarPausa">${ic('play')} Voltar ao trabalho</button></div>`;
  return `<div class="view pausa"><span class="over">Pausa do pomodoro · sem desculpa</span>
    <div class="seg" role="tablist" aria-label="Tipo de pausa">${['curta','longa'].map(k=>`<button role="tab" aria-selected="${r.breakKind===k}" data-act="breakKind" data-arg="${k}"><span>${k==='curta'?'☕ ':'🥪 '}${breakName(k)}</span><small>${breakLen(k)/MIN} min</small></button>`).join('')}</div>
    <div class="timer-xl" data-t="break"></div>
    ${art('binoculos','Vigilância ativa','Dr. Alberto vigiando de binóculo com a caneca de café')}
    ${boss(r.breakKind==='curta'?'Café, não happy hour.':'Almoço relâmpago. A ênfase é no relâmpago.')}
    <p class="sub">Volta para: <strong>${esc(t.title)}</strong> · bloco ${r.block%4+1} de 4</p>
    <button class="btn btn-ghost btn-lg" data-act="voltarPausa">Voltar antes</button></div>`;
}
function vEntrega(){
  const t=task(S.ui.lastDelivered);if(!t)return vPressao();
  const real=Math.round(t.workMs/MIN),diff=real-t.est;const next=queue()[0];const late=real>t.est+t.tol;
  const quip=diff<=0?'No prazo. Não vou aplaudir. Mas anotei.':late?`Entregue com ${ext(diff)} minuto${diff>1?'s':''} acima. A cobrança de atraso segue esperando explicação.`:`Entregue. ${cap(ext(diff))} minuto${diff>1?'s':''} acima. Anotado, não perdoado.`;
  const mx=Math.max(t.est,real,1);
  return `<div class="view">
  <header class="vh"><div class="vh-l">${bdg(`${ic('check','ic-xs')} Entregue · ${hhmm(t.deliveredAt)}`,'secondary',{lg:true})}<h1 class="h1">${esc(t.title)}</h1></div></header>
  <div class="cols"><section class="col-main">
    <dl class="ledger">
      <div><dt>Estimado</dt><dd>${fmtShort(t.est)}</dd></div>
      <div><dt>Real</dt><dd style="color:${diff>0?(late?'var(--error)':'var(--tertiary)'):'var(--secondary)'}">${fmtShort(real)}${diff?`<small>${diff>0?'+':''}${diff}m</small>`:''}</dd></div>
      <div><dt>Pomodoros</dt><dd>${t.pomos}</dd></div>
      <div><dt>Pausa com desculpa</dt><dd>${t.pauseCount}<small>${t.pauseCount?clockMs(t.pauseMs):''}</small></dd></div>
      <div class="full"><dt>Interrupções</dt><dd>${t.intr}</dd></div>
    </dl>
    <div class="card"><span class="over">Estimado x real · minutos</span>
      <div class="hbars"><div class="hb"><span>Estimado</span><div class="hb-track"><div class="hb-fill" style="width:${t.est/mx*100}%"></div></div><b>${t.est}</b></div>
      <div class="hb"><span>Real</span><div class="hb-track"><div class="hb-fill" style="width:${real/mx*100}%;background:${diff>0?'var(--error)':'var(--secondary)'}"></div></div><b>${real}</b></div></div></div>
  </section>
  <aside class="col-side"><div class="card card-brutal">${boss(quip)}
    ${next?`<button class="btn btn-primary btn-lg btn-block" data-act="iniciar" data-arg="${next.id}">${ic('play')} Próxima da fila</button><p class="fine">Próxima: ${esc(next.title)} · ${fmtMin(next.est)}</p>`:`<p class="sub">Era a última da fila.</p>`}
    <button class="btn btn-ghost btn-block" data-act="go" data-arg="pressao">Ver a fila</button></div></aside></div></div>`;
}
function vZerada(){
  return `<div class="view" style="align-items:center;text-align:center;padding-top:48px"><div style="width:min(280px,70vw)">${art('binoculos','Fila 0','Dr. Alberto vigiando de binóculo')}</div><h1 class="display">Fila zerada.</h1><p class="lead">Nada assinado pendente. Não se acostume.</p>

/* ---- Cobranças ---- */
function cobTabs(a){const n=openCobs().length;return `<div class="tabs" role="tablist"><button role="tab" aria-selected="${a==='p'}" data-act="go" data-arg="cobrancas">Pendentes${n?`<span class="count">${n}</span>`:''}</button><button role="tab" aria-selected="${a==='h'}" data-act="go" data-arg="historico">Histórico</button></div>`;}
function vCobrancas(){
  const open=openCobs();
  const sel=open.find(c=>c.id===S.ui.cobSel)||open[0];
  if(!open.length)return `<div class="view">${head('Central de Desculpas','Cobranças')}${cobTabs('p')}
    <div class="cols"><div class="card" style="align-items:flex-start">${boss('Nada pendente. Estranho. Vou conferir de novo.',{lg:true})}
    <div class="row">${S.ui.returnPonto?`<button class="btn btn-primary btn-lg" data-act="ponto">${ic('card')} Voltar ao ponto</button>`:''}<button class="btn btn-ghost" data-act="go" data-arg="historico">Ver histórico</button></div></div>
    ${art('binoculos','Vigilância ativa','Dr. Alberto vigiando de binóculo')}</div></div>`;
  const n=open.length;
  return `<div class="view">${head('Central de Desculpas','Cobranças')}${cobTabs('p')}
  ${boss(`${cap(extF(n))} cobrança${n>1?'s':''}. ${n>1?'Comece pela mais velha.':'Resolve logo.'}`)}
  <div class="cols"><section class="col-main"><ol class="tasks">${open.map(c=>`<li><button class="cob" data-act="cobSel" data-arg="${c.id}" aria-pressed="${sel.id===c.id}"><span class="cob-top">${bdg(COB[c.type][0],COB[c.type][1],{soft:true})}<time>${dayLabel(c.at)==='Hoje'?'':dayLabel(c.at)+' '}${hhmm(c.at)}</time></span><strong>${esc(c.title)}</strong><small>${esc(cobLine(c))}</small></button></li>`).join('')}</ol></section>
  <aside class="col-side">${cobDetail(sel)}</aside></div></div>`;
}
function cobDetail(c){
  const t=c.taskId&&task(c.taskId);let kv='';
  if(c.type==='atraso'&&t)kv=`<div><dt>Estimativa</dt><dd>${fmtMin(t.est)}</dd></div><div><dt>Real</dt><dd>${fmtMin(taskWork(t)/MIN)}</dd></div><div><dt>Tolerância</dt><dd>${t.tol} min</dd></div><div><dt>Aberta às</dt><dd>${hhmm(c.at)}</dd></div>`;
  else if(c.type==='excedente')kv=`<div><dt>Pausa</dt><dd>${c.baseMin} min</dd></div><div><dt>Excedente</dt><dd>+${minSec(c.amountMs||0)}</dd></div><div class="wide"><dt>Aberta às</dt><dd>${hhmm(c.at)}</dd></div>`;
  else if(c.type==='mudanca')kv=`<div class="wide"><dt>Pedido</dt><dd>${esc(c.detail||'')}</dd></div><div class="wide"><dt>Aberta às</dt><dd>${hhmm(c.at)}</dd></div>`;
  else kv=`<div><dt>Estimativa</dt><dd>${t?fmtMin(t.est):'—'}</dd></div><div><dt>Aberta às</dt><dd>${hhmm(c.at)}</dd></div><div class="wide"><dt>Situação</dt><dd>Não entregue · abandonada no ponto</dd></div>`;
  return `<div class="card card-brutal">${bdg(COB[c.type][0],COB[c.type][1],{lg:true})}<h2 class="h2">${esc(c.title)}</h2><dl class="kv">${kv}</dl>
    <button class="btn btn-primary btn-lg btn-block" data-act="explicar" data-arg="${c.id}">${ic('pen')} Explicar</button>
    <p class="fine">Explica agora ou até bater o ponto. O dia só fecha com tudo explicado.</p></div>`;
}
const PLAN={
  'Interrupção externa':{t:'Da próxima vez que alguém te interromper:',se:'o cliente ligar no meio do foco',faco:'anoto e retorno no fim do pomodoro'},
  'Estimativa errada':{t:'Da próxima vez que for estimar:',se:'a tarefa tiver anexos para conferir',faco:'somo 20 minutos na estimativa'},
  'Dependia de outra pessoa':{t:'Da próxima vez que depender de alguém:',se:'precisar de resposta do financeiro',faco:'peço no dia anterior e combino um prazo'},
  'Imprevisto pessoal':{t:'Da próxima vez que surgir um imprevisto:',se:'precisar sair no meio do expediente',faco:'aviso antes e reorganizo a fila'},
  'Prioridade mudou':{t:'Da próxima vez que a prioridade mudar:',se:'a diretoria antecipar uma entrega',faco:'revejo o plano antes de assinar a próxima tarefa'},
  'Fui fraco mesmo':{t:'Da próxima vez que bater o desânimo:',se:'sobrar tarefa pesada para o fim do dia',faco:'puxo para o primeiro bloco da manhã'}
};
function excContext(c){
  const t=c.taskId&&task(c.taskId);const ch=c.change;let line,note;
  if(ch&&ch.kind==='excluir'){line=`Você pediu para excluir: <b>${esc(c.title)}</b>`;note='A tarefa só sai da fila depois da desculpa entregue. O veredito não impede a exclusão.';}
  else if(ch&&ch.kind==='estimativa'){line=`Você pediu para mudar a estimativa de <b>${esc(c.title)}</b>: ${t?fmtMin(t.est):''} → ${fmtMin(ch.to)}`;note='A nova estimativa só vale depois da desculpa entregue.';}
  else if(ch&&ch.kind==='tolerancia'){line=`Você pediu para mudar a tolerância de <b>${esc(c.title)}</b>: ${t?t.tol+' min':''} → ${ch.to} min`;note='A nova tolerância só vale depois da desculpa entregue.';}
  else if(c.pontoMove){line=`Você quer levar para amanhã: <b>${esc(c.title)}</b>`;note='Ela só entra na fila de amanhã depois da desculpa entregue.';}
  else{line=`${COB[c.type][0]}: <b>${esc(c.title)}</b>`;note=cobLine(c);}
  return `<div class="exc-ctx">${bdg(`${COB[c.type][0]} · ${hhmm(c.at)}`,COB[c.type][1],{soft:true})}<p>${line}</p>${note?`<p class="fine">${esc(note)}</p>`:''}</div>`;
}

      <div class="field"><label for="exc-relato">Relato</label><textarea id="exc-relato" class="input" data-model="ui.exc.relato" placeholder="O que aconteceu, em ordem. Fatos, não adjetivos." maxlength="600">${esc(e.relato)}</textarea><p class="hint">mín. 20 caracteres · <b>${L}</b></p></div>
      <div class="row"><button class="btn btn-primary btn-lg" data-act="excStep" data-arg="3" ${L>=20?'':'disabled'}>Continuar</button><button class="btn btn-ghost btn-lg" data-act="excStep" data-arg="1">Voltar</button></div>`;
    quote='Detalhe convence. Adjetivo, não.';
  }else{
    const pl=PLAN[e.cat]||{t:'Da próxima vez:',se:'acontecer de novo',faco:'aviso antes e ajusto o plano'};
    const se=(e.se||'').trim(),fa=(e.faco||'').trim();
    main=`<h1 class="h1">${pl.t}</h1><p class="sub">Um plano curto, no formato “se acontecer isso, eu faço aquilo”.</p>
      <div class="plan"><div class="field"><label for="exc-se">Se acontecer…</label><input id="exc-se" class="input" data-model="ui.exc.se" value="${esc(e.se)}" placeholder="Ex.: ${pl.se}" maxlength="120" autocomplete="off"></div>
      <div class="field"><label for="exc-faco">…eu faço:</label><input id="exc-faco" class="input" data-model="ui.exc.faco" value="${esc(e.faco)}" placeholder="Ex.: ${pl.faco}" maxlength="120" autocomplete="off"></div></div>
      ${se&&fa?`<p class="fine">Vai para o Dossiê assim: <i>“Se ${esc(se)}, eu ${esc(fa)}.”</i></p>`:''}
      <p class="hint">Opcional. Dá para pular, mas quem chega com plano pesa a favor no <b>veredito</b>.</p>
      <div class="row"><button class="btn btn-primary btn-lg" data-act="excEntregar">${ic('pen')} Entregar desculpa</button><button class="btn btn-ghost btn-lg" data-act="excPular">Pular este passo</button></div>`;
    quote='Plano pesa a favor. Promessa vaga, não.';
  }
  return `<div class="view">
  <div class="row exc-top" style="justify-content:space-between"><button class="btn btn-link" data-act="excVoltar">${ic('back','ic-s')} ${back}</button><span class="steps">${step} de 3 ${[1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</span></div>
  <div class="cols"><section class="col-main card card-paper" style="gap:20px">${excContext(c)}${main}</section>
  <aside class="col-side">${boss(quote)}</aside></div></div>`;
}

  else if(v.returnTo==='foco'&&S.run)actions=`<button class="btn btn-primary btn-lg" data-act="foco">${ic('play')} Voltar ao foco</button>`;
  else if(S.ui.returnPonto&&!left)actions=`<button class="btn btn-primary btn-lg" data-act="ponto">${ic('card')} Voltar ao ponto</button>`;

    <div class="verd-wrap">${art(c.verdict==='tolerada'?'relogio':'megafone',null,'Dr. Alberto dando o veredito')}<div style="display:flex;flex-direction:column;gap:14px">${boss(verdictQuote(c),{lg:true})}

/* ---- Ponto ---- */
function vPonto(){
  if(S.closed)return vBatido();
  const P=S.ponto;if(!P)return vPrancheta();
  const st=statsToday();const step=P.step;
  const stepTxt=step==='bloqueio'?2:step;
  let body='';
  if(step===1){
    const early=P.openedAt<endOfDay();
    body=`${boss(early?`Saindo antes das ${S.settings.end}? Os números vão contar a história.`:'Vamos aos números. Eles não mentem. Ao contrário de algumas pessoas.',{lg:true})}
    <dl class="ledger">
      <div><dt>Prometido</dt><dd>${st.p}</dd></div><div><dt>Entregue</dt><dd>${st.e}</dd></div>
      <div><dt>Estimado</dt><dd>${fmtShort(st.estM)}</dd></div><div><dt>Real</dt><dd style="color:${st.realM>st.estM?'var(--error)':'inherit'}">${fmtShort(st.realM)}</dd></div>
      <div><dt>Pausas do pomodoro</dt><dd>${st.brN}<small>${fmtShort(st.brMs/MIN)}</small></dd></div><div><dt>Pausas com desculpa</dt><dd>${st.paN}<small>${fmtShort(st.paMs/MIN)}</small></dd></div>
      <div class="full"><dt>Excedentes</dt><dd>${st.excN}<small>${st.excN?'+'+minSec(st.excMs):''}</small></dd></div>
    </dl>
    <div class="row"><button class="btn btn-primary btn-lg" data-act="pontoStep" data-arg="2">Continuar</button></div>`;
  }else if(step===2){
    const pend=S.tasks.filter(t=>t.day===today()&&(t.status==='fila'||P.decisions[t.id]));
    const allDone=pend.every(t=>P.decisions[t.id]);
    body=pend.length?`<h2 class="h2">Assinadas e não entregues.</h2><p class="sub">Decida o destino de cada uma. Ficar em cima do muro não é opção.</p>
      <div class="tasks">${pend.map(t=>{const d=P.decisions[t.id];const where=t.stoppedAt?`pausada às ${hhmm(t.stoppedAt)}`:t.workMs>0?`trabalhada ${fmtMin(t.workMs/MIN)}`:t.origin==='ontem'?'adiada de ontem':'nem começou';
        let right;if(d==='amanha')right=bdg('Levada para amanhã','tertiary',{soft:true});else if(d==='abandonada')right=bdg('Abandonada','error',{soft:true});else if(d==='amanha-pend')right=`<button class="btn btn-ghost btn-sm" data-act="explicar" data-arg="${P.pendCob[t.id]}">Continuar desculpa</button>`;
        else right=`<div class="row"><button class="btn btn-ghost btn-sm" data-act="pontoAmanha" data-arg="${t.id}">Levar para amanhã</button><button class="btn btn-danger btn-sm" data-act="pontoAbandonar" data-arg="${t.id}">Abandonar</button></div>`;
        return `<div class="pend"><div><strong>${esc(t.title)}</strong><small>est. ${fmtMin(t.est)} · ${where}</small></div>${right}</div>`;}).join('')}</div>
      <p class="fine">“Levar para amanhã” pede desculpa formal e entra na fila de amanhã. “Abandonar” vira cobrança de abandono.</p>`
      :`${boss('Nada assinado ficou para trás. Vou fingir que não estou surpreso.')}`;
    body+=`<div class="row"><button class="btn btn-primary btn-lg" data-act="pontoContinuar" ${allDone?'':'disabled'}>Continuar</button><button class="btn btn-ghost btn-lg" data-act="pontoStep" data-arg="1">Voltar ao resumo</button></div>`;
  }else if(step==='bloqueio'){
    const open=openCobs();
    body=`<div class="cols"><div class="col-main">${boss('Ainda tem cobrança sem explicação. O dia só fecha com tudo explicado. Regra sua, assinada por você.',{lg:true})}
    <div class="tasks">${open.map(c=>`<div class="pend"><div><strong>${COB[c.type][0]} · ${esc(c.title)}</strong><small>${esc(cobLine(c))}</small></div><span class="eyebrow">${hhmm(c.at)}</span></div>`).join('')}</div>
    <div class="row"><button class="btn btn-primary btn-lg" data-act="pontoCentral">Ir para a Central (${open.length})</button><button class="btn btn-ghost btn-lg" data-act="pontoStep" data-arg="1">Voltar ao resumo</button></div></div>
    ${art('megafone',null,'Dr. Alberto no megafone com a prancheta de desculpas')}</div>`;
  }else{
    const dv=dayVerdict(st);
    body=`<div class="cols"><section class="col-main"><h2 class="h2">Reflexão do dia</h2>
      <div class="field"><label for="refl">Como foi? (livre)</label><textarea id="refl" class="input" data-model="ponto.refl" placeholder="O que rendeu, o que travou, por onde começa amanhã." maxlength="800">${esc(P.refl||'')}</textarea></div>
      <div class="row"><button class="btn btn-primary btn-lg" data-act="baterPonto">${ic('card')} Bater o ponto</button></div></section>
      <aside class="col-side"><div class="card card-brutal"><span class="over">Veredito do dia</span>${bdg(dv.v,dv.tone,{lg:true})}${boss(dv.q)}</div></aside></div>`;
  }
  return `<div class="view">${head(`${dateLong()} · ${hhmm(P.openedAt)}`,'Bater o ponto',`<span class="steps">${stepTxt} de 3 ${[1,2,3].map(i=>`<i class="${i<=stepTxt?'on':''}"></i>`).join('')}</span>`)}${body}</div>`;
}

    <div class="timecard ${fresh?'punch-in':''}"><div class="tc-head"><b>BOSSFYME</b><span class="over">Cartão de ponto</span></div>
      <table class="tc"><tbody><tr><th>Data</th><td>${dateLong(c.at)}</td></tr><tr><th>Entrada</th><td>${first?hhmm(first.startedAt):S.settings.start}</td></tr><tr><th>Saída</th><td><span class="tc-stamp">${hhmm(c.at)}</span></td></tr><tr><th>Entregues</th><td>${c.e} de ${c.p}</td></tr><tr><th>Veredito</th><td>${esc(c.verdict)}</td></tr></tbody></table></div>

/* ---- Dossiê ---- */
function weekStats(){
  const tk=today();
  return weekDays().map(d=>{let s=null;if(d.key===tk){const t=statsToday();s=t;}else if(S.archive[d.key])s=S.archive[d.key];return Object.assign({},d,{s,isToday:d.key===tk});});
}
function vDossie(){
  const mode=S.ui.dmode||'semana';
  const ws=weekStats();const T=statsToday();
  const A=mode==='semana'?ws.filter(d=>d.s).reduce((a,d)=>{['p','e','estM','realM','pomoM','livreM','intr','atrasos','aband'].forEach(k=>a[k]=(a[k]||0)+(d.s[k]||0));return a;},{}):T;
  const dev=A.estM?Math.round((A.realM-A.estM)/A.estM*100):0;
  const pauses=Object.assign({},mode==='semana'?S.seedPauses:{});
  S.pauses.filter(p=>mode==='semana'||dayKey(p.at)===today()).forEach(p=>{pauses[p.cat]=(pauses[p.cat]||0)+1;});
  const pArr=Object.entries(pauses).sort((a,b)=>b[1]-a[1]);const pMax=Math.max(1,...pArr.map(x=>x[1]));
  const exc=Object.assign({},S.seedExcuses);historyCobs().forEach(c=>{exc[c.excuse.cat]=(exc[c.excuse.cat]||0)+1;});
  const eArr=Object.entries(exc).sort((a,b)=>b[1]-a[1]);
  const top=eArr[0];
  const QX={'Interrupção externa':n=>`${cap(extF(n))} interrupções externas. O mundo conspira ou você atende tudo?`,'Estimativa errada':n=>`${cap(extF(n))} estimativas erradas. Seu relógio interno precisa de conserto.`,'Fui fraco mesmo':n=>`${cap(ext(n))} vezes “fui fraco mesmo”. Sinceridade não é plano.`,'Dependia de outra pessoa':n=>`${cap(extF(n))} vezes dependendo dos outros. Já pensou em depender de você?`,'Imprevisto pessoal':n=>`${cap(ext(n))} imprevistos pessoais. Já estão ficando previsíveis.`,'Prioridade mudou':n=>`A prioridade mudou ${extF(n)} vezes. Talvez o problema seja a prioridade.`};
  const tiles=[
    ['pe','Prometido x entregue',`${A.p||0} / ${A.e||0}`,A.p?`${Math.round(A.e/A.p*100)}% entregue`:'nada prometido',false],
    ['er','Estimado x real',`${dev>0?'+':''}${dev}%`,`${fmtShort(A.estM||0)} → ${fmtShort(A.realM||0)}`,dev>10],
    ['pl','Pomodoro x livre',`${fmtShort(A.pomoM||0)} / ${fmtShort(A.livreM||0)}`,'tempo de foco',false],
    ['in','Interrupções',`${A.intr||0}`,mode==='semana'?'na semana':'hoje',false],
    ['aa','Atrasos · abandonos',`${A.atrasos||0} · ${A.aband||0}`,'viraram cobrança',(A.aband||0)>0]
  ];
  const chart=mode==='semana'?weekChart(ws):dayChart();

  <p class="note">Clique em qualquer número para ver a lista que gerou o número.</p></div>`;
}
function weekChart(ws){
  const W=520,H=230,L=34,B=34,Tp=18;const max=Math.max(4,...ws.map(d=>d.s?d.s.p:0));const top=Math.ceil(max/2)*2;
  const y=v=>Tp+(H-Tp-B)*(1-v/top);const band=(W-L-8)/5;
  let g='';for(let v=0;v<=top;v+=2){g+=`<line class="ch-grid" x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-lbl" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  const bars=ws.map((d,i)=>{const cx=L+band*i+band/2;const bw=Math.min(46,band*.5);const lbl=`<text class="ch-day ${d.isToday?'today':''}" x="${cx}" y="${H-12}" text-anchor="middle">${d.label}</text>`;
    if(!d.s)return lbl+`<line class="ch-grid" x1="${cx-bw/2}" x2="${cx+bw/2}" y1="${y(0)}" y2="${y(0)}" stroke-dasharray="3 3"/><text class="ch-lbl" x="${cx}" y="${y(0)-8}" text-anchor="middle">—</text>`;
    return lbl+`<rect class="ch-out" x="${cx-bw/2}" y="${y(d.s.p)}" width="${bw}" height="${y(0)-y(d.s.p)}" rx="4"/><rect class="ch-fill ${d.isToday?'today':''}" x="${cx-bw/2+5}" y="${y(d.s.e)}" width="${bw-10}" height="${Math.max(0,y(0)-y(d.s.e))}" rx="3"/><text class="ch-val" x="${cx}" y="${y(d.s.p)-7}" text-anchor="middle">${d.s.e} de ${d.s.p}</text>`;}).join('');
  return `<div class="card chart"><div class="row" style="justify-content:space-between"><span class="over">Prometido x entregue por dia</span><span class="legend"><span><i class="lg-out"></i>prometido</span><span><i class="lg-fill"></i>entregue</span></span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tarefas prometidas e entregues por dia da semana">${g}${bars}</svg></div>`;
}
function dayChart(){
  const ts=S.tasks.filter(t=>t.day===today()&&taskWork(t)>0);
  if(!ts.length)return `<div class="card"><span class="over">Estimado x real por tarefa</span><p class="fine">Nenhuma tarefa trabalhada hoje ainda.</p></div>`;
  const mx=Math.max(...ts.map(t=>Math.max(t.est,taskWork(t)/MIN)));
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="over">Estimado x real por tarefa · minutos</span></div>
  <div class="hbars">${ts.map(t=>{const r=Math.round(taskWork(t)/MIN);return `<div><p class="fine" style="color:var(--ink);margin-bottom:4px">${esc(t.title)}</p><div class="hb"><span>est.</span><div class="hb-track"><div class="hb-fill" style="width:${t.est/mx*100}%;background:var(--outline)"></div></div><b>${t.est}</b></div><div class="hb"><span>real</span><div class="hb-track"><div class="hb-fill" style="width:${r/mx*100}%;background:${r>t.est+t.tol?'var(--error)':r>t.est?'var(--tertiary)':'var(--secondary)'}"></div></div><b>${r}</b></div></div>`;}).join('')}</div></div>`;
}

function editor(k){

}

function updateTicks(){
  const n=now();const V={},W={};
  V.hhmm=hhmm(n);
  V.simclock=`${dateLong(n)} · ${hhmm(n)}:${pad(new Date(n).getSeconds())} · ${S.clock.speed}×`;
  const r=S.run;
  if(r){
    const t=task(r.taskId);const w=taskWork(t);const est=t.est*MIN,tol=t.tol*MIN;
    const bl=r.pomo?blockLeft():est-w;
    V.block=clockMs(Math.max(0,bl));
    V['remain-big']=clockMs(est-w);
    V.remain=w<=est?clockMs(est-w):`+${Math.floor((w-est)/MIN)} min`;
    V.prazo=w<=est?`prazo às ${hhmm(n+est-w)}`:w<=est+tol?`tolerância até ${hhmm(n+est+tol-w)}`:`tolerância acabou ${hhmm(n-(w-est-tol))}`;
    V.elapsed=clockMs(w);
    V.overmin=`${Math.max(0,Math.floor((w-est)/MIN))} min`;V.overchip=`+${Math.max(0,Math.floor((w-est)/MIN))} min`;
    V['side-run']=r.phase==='work'?clockMs(Math.max(0,r.pomo?bl:w)):r.phase==='break'?'pausa':'parada';
    if(r.phase==='break'){const len=breakLen(r.breakKind),el=n-r.phaseStart;V.break=clockMs(len-el);V['break-desc']=`${breakName(r.breakKind)} de ${len/MIN} min · +${minSec(el-len)}`;}
    if(r.phase==='pause'){const lim=S.settings.pauseLimit*MIN,el=n-r.phaseStart;V.pelapsed=clockMs(el);V.plimit=clockMs(lim-el);V['plimit-l']=el<=lim?'restantes':'além do limite · virou cobrança';}
    W.fill=Math.min(100,w/(est+tol)*100);
    const ring=document.querySelector('[data-ring="main"]');if(ring)ring.setAttribute('stroke-dashoffset',(RING_C*(1-ringProg())).toFixed(1));
  }
  document.querySelectorAll('[data-t]').forEach(el=>{const v=V[el.dataset.t];if(v!==undefined&&el.textContent!==v)el.textContent=v;});
  document.querySelectorAll('[data-tw]').forEach(el=>{const v=W[el.dataset.tw];if(v!==undefined)el.style.width=v+'%';});
  const d=new Date(S.closed?S.closed.at:n);const hA=(d.getHours()%12)*30+d.getMinutes()*.5,mA=d.getMinutes()*6+d.getSeconds()*.1;
  document.querySelectorAll('[data-clock="h"]').forEach(el=>el.setAttribute('transform',`rotate(${hA.toFixed(1)} 52 52)`));
  document.querySelectorAll('[data-clock="m"]').forEach(el=>el.setAttribute('transform',`rotate(${mA.toFixed(1)} 52 52)`));
  document.querySelectorAll('[data-t-aria="clock"]').forEach(el=>el.setAttribute('aria-label',`Relógio: ${hhmm(d.getTime())}`));
}

/* ================= relógio ================= */
let lastSave=0;
function tick(){
  if(!S)return;const n=now();let re=false;const r=S.run;
  if(r&&!S.closed){
    const t=task(r.taskId);
    if(r.phase==='work'){
      const w=taskWork(t);
      if(!r.estWarned&&w>t.est*MIN){r.estWarned=true;re=true;notify('est','A estimativa acabou',`${t.title}: a tolerância de ${t.tol} min começou a correr.`,t);if(S.route!=='foco')toast('Estimativa estourou.','Otimismo não é método.');}
      if(!r.lateCob&&w>(t.est+t.tol)*MIN){r.lateCob=addCob({type:'atraso',taskId:t.id,title:t.title});S.ui.corner=r.lateCob;S.ui.cornerO={t0:Date.now()};re=true;notify('cob','Cobrança aberta · atraso',t.title,t);}
      if(r.pomo&&blockLeft()<=0){toBreak();re=true;notify('pausa','Bloco encerrado',`Pausa de ${breakLen(r.breakKind)/MIN} min. Sem desculpa.`,t);if(S.route!=='foco')toast('Bloco encerrado.','Pausa do pomodoro começou.');}
    }else if(r.phase==='break'){
      const len=breakLen(r.breakKind);
      if(!r.excCob&&n-r.phaseStart>len){r.excCob=addCob({type:'excedente',title:breakName(r.breakKind),kind:r.breakKind,baseMin:len/MIN,amountMs:0,taskId:r.taskId});re=true;notify('pausa','A pausa acabou','Volte ao trabalho. Cada segundo agora vai para as cobranças.',t);}
      if(r.excCob){const c=cob(r.excCob);if(c)c.amountMs=n-r.phaseStart-len;}
    }else if(r.phase==='pause'){
      const lim=S.settings.pauseLimit*MIN;
      if(!r.limitCob&&n-r.phaseStart>lim){r.limitCob=addCob({type:'excedente',title:'Pausa · '+r.pauseCat,baseMin:lim/MIN,amountMs:0,taskId:r.taskId});re=true;toast('Limite de pausa estourado.','Virou cobrança de excedente.');}
      if(r.limitCob){const c=cob(r.limitCob);if(c)c.amountMs=n-r.phaseStart-lim;}
    }
  }
  if(!S.closed&&S.onboarded&&!S.day.pontoAsked&&n>=endOfDay()){S.day.pontoAsked=true;re=true;notify('ponto','Hora de bater o ponto',`O expediente acabou às ${S.settings.end}.`);toast(`${S.settings.end}. Hora de encerrar o dia.`,'O link fica embaixo do relógio.');}
  if(re){save();render();}else updateTicks();
  if(Date.now()-lastSave>3000){lastSave=Date.now();save();}
}

      if(id==='3·21b'||id==='3·21c'||id==='3·22'){S.ui.exc.step=2;S.ui.exc.relato='O cliente ligou duas vezes pedindo ajuste no escopo e precisei refazer a seção 3 antes de seguir com o relatório.';}
      if(id==='3·21c'||id==='3·22'){S.ui.exc.step=3;S.ui.exc.se='o cliente ligar no meio do foco';S.ui.exc.faco='anoto, retorno no fim do pomodoro e ajusto a estimativa';}
      if(id==='3·22'){save();finishExcuse(false);return;}
      break;}
    case '3·23':S.route='historico';break;
    case '4·24':case '4·25':case '4·26':case '4·27':case '4·27b':{
      setClock(18,4);S.day.pontoAsked=true;
      [['t3',57],['t1',150]].forEach(([k,m],i)=>{const t=task(k);Object.assign(t,{status:'entregue',workMs:m*MIN,startedAt:at(10+i*2,10),deliveredAt:at(11+i*3,0),pomos:Math.ceil(m/25)});});
      const t2=task('t2');t2.workMs=40*MIN;t2.startedAt=at(15,0);t2.stoppedAt=at(15,40);
      S.breaks.push({at:at(10,35),kind:'curta',ms:5*MIN,excMs:0,taskId:'t3'},{at:at(12,40),kind:'longa',ms:15*MIN,excMs:0,taskId:'t1'});
      S.pauses.push({at:at(11,5),cat:'Interrupção externa',note:'Cliente ligou',ms:3*MIN+36000,taskId:'t3'},{at:at(13,10),cat:'Reunião',note:'',ms:14*MIN,taskId:'t1'});
      S.ponto={step:1,decisions:{},pendCob:{},refl:'',openedAt:now()};S.route='ponto';
      if(id==='4·25')S.ponto.step=2;
      if(id==='4·26'){const ta=task('t4');ta.status='abandonada';addCob({type:'abandono',taskId:'t4',title:ta.title});S.ponto.decisions.t4='abandonada';const t2b=task('t2');t2b.status='amanha';S.ponto.decisions.t2='amanha';S.ponto.step='bloqueio';}
      if(id==='4·27'||id==='4·27b'){S.cobs.forEach(c=>{if(c.status==='aberta'){c.status='explicada';c.verdict='tolerada';c.explainedAt=now();c.excuse={cat:'Interrupção externa',relato:'Explicada durante o dia.',se:'',faco:''};}});task('t2').status='amanha';task('t4').status='amanha';S.ponto.step=3;S.ponto.refl='Manhã perdida com o cliente. A tarde rendeu. Amanhã começo pelo jurídico.';}
      if(id==='4·27b'){const st=statsToday();S.closed={at:at(18,11),p:st.p,e:st.e,verdict:dayVerdict(st).v};S.clock.sim=at(18,11);S.clock.real=Date.now();S.reflections.push({at:now(),text:S.ponto.refl});S.ui.punchT0=Date.now();S.route='batido';}
      break;}
    case '28':S.route='dossie';break;
    case '29':S.pro=true;S.route='expediente';break;
  }
  S.ui._top=true;save();render();if(after)after();
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.disabled||el.getAttribute('aria-disabled')==='true')return;
  const fn=A[el.dataset.act];if(!fn)return;
  e.preventDefault();fn(el.dataset.arg,el,e);
});
document.addEventListener('input',e=>{
  const el=e.target;const path=el.dataset&&el.dataset.model;if(!path)return;
  let v=el.value;if(el.hasAttribute('data-num'))v=Number(v);
  setPath(path,v);render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.ui.browserPrompt){A.perm('denied');return;}
    if(S.ui.demo){A.demoClose();return;}
    if(S.ui.pip){A.pipClose();return;}
    if(S.ui.modal){A.closeModal();return;}
    if(S.ui.panel){A.fecharPainel();return;}
    return;
  }
  const t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();const fn=A[t.dataset.enter];if(fn)fn();return;}
  if(e.key==='Enter'&&t.matches&&t.matches('tr[data-act]')){e.preventDefault();A[t.dataset.act](t.dataset.arg,t);return;}
  if(t.closest&&t.closest('input,textarea,select'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.route==='foco'&&S.run&&S.run.phase==='work'&&!S.ui.modal&&!S.ui.panel&&!S.ui.pip){
    const k=e.key.toLowerCase();
    if(k==='e'){e.preventDefault();A.entregar();}else if(k==='p'){e.preventDefault();A.desculpa();}else if(k==='i'){e.preventDefault();A.registro();}
  }
});

/* ================= início ================= */
load();
if(!S.onboarded&&S.route!=='regras')S.route='welcome';
if(S.route==='foco'&&!S.run)S.route='pressao';
const hash=(location.hash||'').replace('#','');
if(hash){const all=SCREENS.flatMap(g=>g[1].map(x=>x[0]));const id=all.find(x=>x.replace('·','-').toLowerCase()===hash.toLowerCase());if(id)stage(id);}
render();
setInterval(tick,250);
})();
</script>
