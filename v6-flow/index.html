.pm-clock{font:500 22px/1 var(--font-mono);font-variant-numeric:tabular-nums;margin:0 8px 0 6px}
.pm-top .avatar{width:34px;height:34px}

<script>
(function(){
'use strict';
document.documentElement.lang='pt-BR';

/* ================= utilidades ================= */
const MIN=60000;
const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MOL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const $=(s,r=document)=>r.querySelector(s);
function now(){return S.clock.sim+(Date.now()-S.clock.real)*S.clock.speed;}
function hhmm(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function dateLong(ms){const d=new Date(ms==null?now():ms);return `${WD[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]}`;}
function dateFull(ms){const d=new Date(ms==null?now():ms);return `${WD[d.getDay()]}, ${d.getDate()} de ${MOL[d.getMonth()]}`;}

function today(){return dayKey(now());}
function atDay(base,off,h,m){const d=new Date(base);d.setDate(d.getDate()+off);d.setHours(h,m,0,0);return d.getTime();}
function at(h,m,off){return atDay(now(),off||0,h,m);}
function atHM(s){const [h,m]=String(s).split(':').map(Number);return at(h,m);}
function nextHalf(){const d=new Date(now());d.setSeconds(0,0);d.setMinutes(d.getMinutes()<30?30:60);return pad(d.getHours())+':'+pad(d.getMinutes());}
function clockMs(ms){const neg=ms<0;const s=Math.floor(Math.abs(ms)/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (neg?'+':'')+(h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`);}

function fmtShort(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;if(!h)return `${m}m`;if(!m)return `${h}h`;return `${h}h${pad(m)}`;}
function minSec(ms){const s=Math.max(0,Math.round(ms/1000));const m=Math.floor(s/60),x=s%60;return m?`${m} min ${x} s`:`${x} s`;}
function sum(a,f){return a.reduce((t,x)=>t+(f?f(x):x),0);}
function dayLabel(ms){const k=dayKey(ms),t=today();if(k===t)return 'Hoje';if(k===dayKey(at(12,0,-1)))return 'Ontem';return WDS[new Date(ms).getDay()];}
const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
function ext(n){n=Math.round(n);if(n<20)return U[n];if(n<100)return D[Math.floor(n/10)]+(n%10?' e '+U[n%10]:'');return String(n);}
function extF(n){return ext(n).replace(/\bum$/,'uma').replace(/\bdois$/,'duas');}
function pl(n,s,p){return n===1?s:(p||s+'s');}
function hm2min(s){const [h,m]=s.split(':').map(Number);return h*60+m;}
function workdayMin(st){st=st||S.settings;return hm2min(st.end)-hm2min(st.start);}
function endOfDay(){const [h,m]=S.settings.end.split(':').map(Number);return at(h,m);}
function weekMonday(ms){const d=new Date(ms);const dow=d.getDay();const off=dow===0?-6:1-dow;return atDay(ms,off,12,0);}

function weekRange(){const w=weekDays();const a=new Date(w[0].ms),b=new Date(w[4].ms);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MO[b.getMonth()]}`:`${a.getDate()} ${MO[a.getMonth()]} – ${b.getDate()} ${MO[b.getMonth()]}`;}

/* ================= ícones, ilustrações, fala do chefe ================= */
const ICN={prancheta:'assignment',pressao:'timer',cobrancas:'receipt_long',dossie:'folder_open',expediente:'schedule',lock:'lock',x:'close',plus:'add',chev:'chevron_right',back:'chevron_left',play:'play_arrow',pause:'pause',check:'check',pen:'signature',bell:'notifications',card:'punch_clock',idea:'lightbulb',out:'open_in_new',warn:'warning',boss:'campaign',reuse:'replay',susp:'pause_circle',quit:'block',edit:'edit',trash:'delete',login:'badge',coffee:'coffee',steps:'directions_walk',more:'more_time',todo:'radio_button_unchecked',tip:'arrow_forward',sun:'wb_twilight'};
function ic(n,cls){return `<span class="mi ${cls||''}" aria-hidden="true">${ICN[n]||n}</span>`;}
const ART={relogio:'assets/chefe-relogio.png',megafone:'assets/chefe-megafone.png',binoculos:'assets/chefe-binoculos.png'};
function art(k,sticker,alt){return `<div class="art"><img src="${ART[k]}" alt="${alt||'Ilustração do Dr. Alberto'}" width="320" height="320">${sticker?`<span class="sticker alt">${sticker}</span>`:''}</div>`;}

function boss(text,o){o=o||{};return `<figure class="bubble ${o.lg?'bubble-lg':''} ${o.brutal?'bubble-brutal':''}"><figcaption class="bubble-who">${ic('boss','ic-s')} Dr. Alberto</figcaption><p>${text}</p></figure>`;}
function bdg(text,tone,o){o=o||{};return `<span class="bdg ${o.soft?'bdg-soft':'bdg-solid'} t-${tone||'neutral'} ${o.lg?'bdg-lg':''}">${text}</span>`;}
function sw(act,on,lb,arg){return `<button type="button" class="switch" role="switch" aria-checked="${!!on}" ${lb?`aria-labelledby="${lb}"`:''} data-act="${act}" ${arg?`data-arg="${esc(arg)}"`:''}><i></i></button>`;}
const SIG='<svg class="sig draw" viewBox="0 0 220 62" aria-hidden="true"><path d="M6 44 C18 14 30 10 27 34 C25 50 38 44 46 30 C52 20 58 18 56 34 C55 44 66 42 74 28 C80 18 88 16 86 32 C85 42 96 40 104 30 C110 22 118 20 116 34 C115 42 126 40 134 32 C144 22 154 24 150 36 C147 44 160 42 172 34 C182 28 196 26 212 30"/><path d="M40 54 C90 49 150 49 205 52"/></svg>';
function logo(tag){return `<span class="logo"><span class="logo-mark">${ic('timer','fill')}</span><span><span class="logo-name">BOSSFYME</span>${tag?`<span class="logo-tag">${tag}</span>`:''}</span></span>`;}
function aclock(){
  let t='';for(let i=0;i<12;i++){const big=i%3===0;const a=i*30*Math.PI/180;const r1=big?38:41,r2=45;t+=`<line class="ac-tick ${big?'big':''}" x1="${(52+Math.sin(a)*r1).toFixed(1)}" y1="${(52-Math.cos(a)*r1).toFixed(1)}" x2="${(52+Math.sin(a)*r2).toFixed(1)}" y2="${(52-Math.cos(a)*r2).toFixed(1)}"/>`;}
  return `<svg class="aclock" viewBox="0 0 104 104" role="img" aria-label="Relógio: agora" data-t-aria="clock"><circle class="ac-face" cx="52" cy="52" r="49"/>${t}<line class="ac-h" data-clock="h" x1="52" y1="52" x2="52" y2="30"/><line class="ac-m" data-clock="m" x1="52" y1="52" x2="52" y2="16"/><circle class="ac-pin" cx="52" cy="52" r="4.5"/></svg>`;
}

/* ================= estado ================= */
const KEY='bossfyme-v6';
let S;
const ARCH=[
  {p:5,e:4,estM:300,realM:338,ideas:2,intr:4,atrasos:1,aband:0},
  {p:4,e:4,estM:270,realM:291,ideas:1,intr:3,atrasos:1,aband:0},
  {p:6,e:4,estM:330,realM:412,ideas:3,intr:5,atrasos:2,aband:1},
  {p:5,e:5,estM:280,realM:296,ideas:2,intr:2,atrasos:0,aband:0}
];
const WEEKT=[
  [['Fechar orçamento gráfica',90,1],['Revisão contrato',120,1],['Reunião de alinhamento',60,1],['Conferir notas fiscais',45,0]],
  [['Apresentação trimestral',180,1],['Atualizar cadastro de fornecedores',30,0],['Atualizar o CRM',60,0]],
  [['Fechar orçamento do evento',120,0],['Planejamento de compras',90,0]],
  [['Workshop interno',240,0],['Ligar para fornecedores',45,0]],
  [['Pauta da reunião',40,0],['Fechamento do mês',120,0]]
];
const TODAYDRAFTS=[['Workshop interno',240],['Ligar para fornecedores',45]];
const PCYCLE=['Café','Banheiro','Café','Problemas técnicos','Café','Banheiro','Outro','Café','Banheiro','Café','Problemas técnicos','Café','Banheiro','Outro'];
/* resultado das tarefas dos dias passados, na ordem da WEEKT (Tarefas da semana no Dossiê) */
const WSTAT=[['prazo','muito','prazo','prazo'],['prazo','desistiu','pouco'],['muito','prazo'],['prazo','prazo'],['prazo','prazo']];
function newTask(){return {id:'',title:'',desc:'',est:45,imp:'media',horario:null,lembrete:25,pausaLen:null,notify:true,signedAt:0,status:'fila',origin:'hoje',day:'',workMs:0,startedAt:null,deliveredAt:null,extraMin:0,extraN:0,extraReqs:[],ideas:[],suspendedAt:null,suspendNote:'',reactivatedAt:null,called:false,verdict:null,cafeTaken:false};}
function seed(){
  const b=new Date();while(b.getDay()===0||b.getDay()===6)b.setDate(b.getDate()-1);
  const base=atDay(b.getTime(),0,11,2);
  const d=(h,m,off)=>atDay(base,off||0,h,m);
  const tk=dayKey(base);
  const T=(id,title,est,imp,signedAt,x)=>Object.assign(newTask(),{id,title,est,imp,signedAt,day:tk},x||{});
  const week={};const mon=weekMonday(base);
  for(let i=0;i<5;i++){const k=dayKey(atDay(mon,i,12,0));const past=k<tk,isT=k===tk;
    week[k]=isT?TODAYDRAFTS.map((r,j)=>({id:`w${i}${j}`,title:r[0],est:r[1],signed:false})):WEEKT[i].map((r,j)=>({id:`w${i}${j}`,title:r[0],est:r[1],signed:past?true:!!r[2]}));}
  const archive={};let j=ARCH.length-1;
  for(let i=4;i>=0;i--){const k=dayKey(atDay(mon,i,12,0));if(k<tk&&j>=0){archive[k]=ARCH[j--];}}
  const intrTot=sum(Object.values(archive),x=>x.intr);
  const seedPauses={};for(let i=0;i<intrTot;i++){const c=PCYCLE[i%PCYCLE.length];seedPauses[c]=(seedPauses[c]||0)+1;}
  const weekLog=[];for(let i=0;i<5;i++){const ms=atDay(mon,i,12,0);const k=dayKey(ms);if(k>=tk)continue;WEEKT[i].forEach((r,j)=>weekLog.push({day:k,title:r[0],st:(WSTAT[i]||[])[j]||'prazo'}));}
  return {
    v:5,clock:{sim:base,real:Date.now(),speed:1},
    route:'welcome',onboarded:false,pro:false,pmLayout:'2a',notifPerm:'default',qs:0,user:{name:''},

function task(id){return S.tasks.find(t=>t.id===id);}

/* v4: o relógio da tarefa nunca para, nem na pausa */
function taskWork(t){const r=S.run;return t.workMs+(r&&r.taskId===t.id?now()-r.phaseStart:0);}
function workNow(){return S.run?taskWork(task(S.run.taskId)):0;}
function remainMs(t){return combMin(t)*MIN-taskWork(t);}
function isLate(){const r=S.run;return !!(r&&remainMs(task(r.taskId))<0);}
function impBdg(t){const i=IMP[t.imp]||IMP.media;return `<span class="bdg bdg-line">Importância ${i[0].toLowerCase()}</span>`;}

function pauseLenOf(t){return (t&&t.pausaLen)||S.settings.pausaSug||5;}
function pauseTot(p){return (p.reqMin+(p.extMin||0))*MIN;}
function pauseLeft(){const r=S.run;if(!r||!r.pause)return 0;return pauseTot(r.pause)-(now()-r.pause.start);}
/* escada de bipes: 5 min → 1 bipe · último minuto → a cada 10 s · 5 s finais → a cada segundo */
function beepSlot(ms){if(ms<=0)return '';if(ms<=5000)return 's'+Math.ceil(ms/1000);if(ms<=MIN)return 'm'+Math.ceil(ms/10000);if(ms<=5*MIN)return '5';return '';}
function beepKind(slot){return slot[0]==='s'?'bip3':slot[0]==='m'?'bip2':'bip';}
function nm(s){const n=((S.user&&S.user.name)||'').trim();return n?`${esc(n)}, ${s.charAt(0).toLowerCase()+s.slice(1)}`:s;}
function queue(){const k=today();return S.tasks.filter(t=>t.day===k&&['fila','exec','suspensa'].includes(t.status)).sort((a,b)=>{const ra=S.run&&S.run.taskId===a.id?0:1,rb=S.run&&S.run.taskId===b.id?0:1;if(ra!==rb)return ra-rb;const oa=a.origin==='ontem'?0:1,ob=b.origin==='ontem'?0:1;if(oa!==ob)return oa-ob;return a.signedAt-b.signedAt;});}
function startable(){return queue().filter(t=>t.status==='fila');}
function openCobs(){return S.cobs.filter(c=>c.status==='aberta').sort((a,b)=>a.at-b.at);}
function historyCobs(){return S.cobs.filter(c=>c.status==='explicada').sort((a,b)=>(b.explainedAt||b.at)-(a.explainedAt||a.at));}
function signedToday(){const k=today();return S.tasks.filter(t=>t.day===k&&t.status!=='excluida'&&t.origin!=='ontem').length;}
function createTask(f){const t=Object.assign(newTask(),{id:uid('t'),signedAt:now(),day:today()},f||{});S.tasks.push(t);return t;}
function addCob(o){const c=Object.assign({id:uid('c'),at:now(),status:'aberta'},o);S.cobs.push(c);return c.id;}
function taskPauses(id){return S.pauses.filter(p=>p.taskId===id).sort((a,b)=>a.at-b.at);}
function pauseSeal(p){
  if(p.kind==='cafe')return 'cafe';
  if(PJUSTAS.includes(p.cat))return 'justa';if(PBOBAS.includes(p.cat))return 'boba';
  /* café, cansaço e outro: o chefe decide pelo histórico do dia. A primeira passa; a repetida é boba. */
  const k=dayKey(p.at);const n=S.pauses.filter(x=>x.kind==='desculpa'&&x.cat===p.cat&&dayKey(x.at)===k&&x.at<p.at).length;
  return n>=1?'boba':'justa';
}
function cobLine(c){
  const t=c.taskId&&task(c.taskId);
  if(c.type==='atraso'&&t)return `Combinado ${fmtMin(combMin(t))} · real ${fmtMin(t.workMs/MIN)}`;
  if(c.type==='excedente'){const extra=c.amountMs>0?Math.max(1,Math.round(c.amountMs/MIN)):0;return `Pausa de ${c.baseMin} min virou ${c.baseMin+extra}`;}
  return c.detail||'';
}

/* ---- relógio da tarefa (v4: não para na pausa) ---- */
function endPhase(){const r=S.run;if(!r)return;const t=task(r.taskId);t.workMs+=now()-r.phaseStart;r.phaseStart=now();}
function armRemind(t){const r=S.run;const w=taskWork(t);r.focusFrom=w;r.remindAt=t.lembrete?w+t.lembrete*MIN:null;}
function startTask(id){
  const t=task(id);if(!t)return;
  t.status='exec';t.called=true;if(!t.startedAt)t.startedAt=now();
  const left=remainMs(t);
  S.run={taskId:id,phase:'work',phaseStart:now(),lateAt:left<0?now():null,warn5:left<=5*MIN,stepsAt:now(),beep:beepSlot(left),lastMin:left>0&&left<=MIN,pause:null,focusFrom:0,remindAt:null};
  armRemind(t);
  S.cafe=null;S.ui.remind=null;
}
function pauseTask(cat,note,min){
  const r=S.run;if(!r)return;const tot=min*MIN;
  r.phase='pause';r.pause={start:now(),cat,note,reqMin:min,extMin:0,excCob:null,beep:beepSlot(tot),lastMin:tot<=MIN};
  S.ui.remind=null;
}
function extendPause(min){
  const r=S.run;if(!r||!r.pause)return false;const left=pauseLeft();if(left<=0||left>MIN)return false;
  r.pause.extMin+=min;const nl=pauseLeft();r.pause.beep=beepSlot(nl);r.pause.lastMin=nl<=MIN;return true;
}
function resumeTask(){
  const r=S.run;if(!r||!r.pause)return;const pz=r.pause;const ms=now()-pz.start;const tot=pauseTot(pz);
  const p={at:pz.start,cat:pz.cat,note:pz.note,ms,reqMin:pz.reqMin,extMin:pz.extMin,taskId:r.taskId,kind:'desculpa'};p.seal=pauseSeal(p);S.pauses.push(p);
  if(pz.excCob){const c=cob(pz.excCob);if(c)c.amountMs=Math.max(0,ms-tot);}
  r.phase='work';r.pause=null;armRemind(task(r.taskId));
}
function stopRun(){
  const r=S.run;if(!r)return null;
  if(r.phase==='pause')resumeTask();
  endPhase();const t=task(r.taskId);S.run=null;S.ui.pip=null;S.ui.remind=null;return t;
}
function verdictTask(t){const real=t.workMs/MIN;const comb=combMin(t);if(real<=comb)return 'prazo';if(real<=comb+t.est*.2)return 'pouco';return 'muito';}
function flushIdeas(t){(t.ideas||[]).forEach(i=>{if(!S.ideas.some(x=>x.at===i.at&&x.text===i.text))S.ideas.push({at:i.at,text:i.text,taskId:t.id});});}
function deliver(){
  const t=stopRun();if(!t)return;
  t.status='entregue';t.deliveredAt=now();t.verdict=verdictTask(t);flushIdeas(t);
  if(t.verdict==='muito'){t.cobId=addCob({type:'atraso',taskId:t.id,title:t.title});notify('cob','Cobrança aberta · atraso',t.title,t);}
  if(t.verdict==='pouco')S.notes.push({at:now(),tag:'Passou pouco',text:`${t.title}: ${fmtMin(t.workMs/MIN-combMin(t))} além do combinado.`});
  S.ui.lastDelivered=t.id;
}
function suspendTask(note){
  const t=stopRun();if(!t)return null;
  t.status='suspensa';t.suspendedAt=now();t.suspendNote=note||'';t.horario=null;t.called=false;
  S.notes.push({at:now(),tag:'Suspensa',text:`${t.title}: feito ${clockMs(t.workMs)} de ${clockMs(combMin(t)*MIN)}${note?'. '+note:''}`});
  return t;
}
function endCafe(){
  const c=S.cafe;if(!c)return;const ms=now()-c.start;const len=5*MIN;
  S.breaks.push({at:c.start,ms,free:c.free,excMs:Math.max(0,ms-len),taskId:c.taskId});
  if(!c.free)S.pauses.push({at:c.start,cat:'Cafezinho',kind:'cafe',seal:'cafe',note:'',ms,taskId:c.taskId});
  if(c.excCob){const x=cob(c.excCob);if(x)x.amountMs=Math.max(0,ms-len);}
  S.cafe=null;
}

/* ---- números do dia ---- */
function statsToday(){
  const k=today();
  const ts=S.tasks.filter(t=>t.day===k&&t.status!=='excluida');
  const del=ts.filter(t=>t.status==='entregue');
  const pa=S.pauses.filter(p=>dayKey(p.at)===k);
  const desc=pa.filter(p=>p.kind==='desculpa');
  const just=desc.filter(p=>p.seal==='justa'),bob=pa.filter(p=>p.seal==='boba');
  const exc=S.breaks.filter(b=>dayKey(b.at)===k&&b.excMs>0).map(b=>b.excMs)
    .concat(desc.map(p=>p.ms-(p.reqMin+(p.extMin||0))*MIN).filter(x=>x>0));
  const cobsT=S.cobs.filter(c=>dayKey(c.at)===k);
  return {p:ts.length,e:del.length,
    estM:sum(del,t=>t.est),realM:sum(del,t=>t.workMs/MIN),
    prazo:del.filter(t=>t.verdict==='prazo').length,atrasadas:del.filter(t=>t.verdict&&t.verdict!=='prazo').length,
    focoM:sum(ts,t=>taskWork(t))/MIN,
    paN:pa.length,paMs:sum(pa,p=>p.ms),bobas:pa.filter(p=>p.seal==='boba').length,
    justN:just.length,justMs:sum(just,p=>p.ms),bobN:bob.length,bobMs:sum(bob,p=>p.ms),
    extraM:sum(ts,t=>t.extraMin||0),extraN:sum(ts,t=>t.extraN||0),
    fila:startable().length,ideas:S.ideas.filter(i=>dayKey(i.at)===k).length,intr:desc.length,
    atrasos:cobsT.filter(c=>c.type==='atraso').length,aband:cobsT.filter(c=>c.type==='abandono').length,
    excN:exc.length,excMs:sum(exc)};
}
function weekCats(){
  const wk=now()-7*24*60*MIN;const o=Object.assign({},S.seedPauses);
  S.pauses.filter(p=>p.kind==='desculpa'&&p.at>wk).forEach(p=>{o[p.cat]=(o[p.cat]||0)+1;});
  return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}
function verdictOf(c,e){
  /* v4: desculpa formal em 2 passos (sem o plano se-então). Pesa o relato, a repetição e a categoria. */
  let score=0;const L=(e.relato||'').trim().length;
  if(L>=80)score+=2;else if(L>=40)score+=1;else score-=1;
  if(e.cat==='Fui fraco mesmo')score+=1;
  const wk=now()-7*24*60*MIN;
  const rep=S.cobs.filter(x=>x.status==='explicada'&&x.excuse&&x.excuse.cat===e.cat&&(x.explainedAt||x.at)>wk).length;
  if(rep>=3)score-=2;else if(rep>=2)score-=1;
  if(BOBAS.includes(e.cat)&&e.cat!=='Fui fraco mesmo')score-=1;
  return {v:score>=2?'tolerada':score>=0?'suspeita':'rejeitada',rep};
}
function verdictQuote(c){
  const e=c.excuse||{};const v=c.verdict;
  if(v==='tolerada'){
    if(e.cat==='Fui fraco mesmo')return 'Pelo menos é sincero. Passa.';
    if(e.cat==='Interrupção externa')return 'Interrupção, e bem contada. Passa. Desta vez.';
    if(e.cat==='Estimativa errada')return 'Errou a conta e assumiu. Passa. Ajusta o relógio interno.';
    return 'Explicação aceita. Passa. Desta vez.';
  }
  if(v==='suspeita')return c._rep>=2?`${e.cat} de novo? Hmm. Essa eu já ouvi.`:'Hmm. Essa eu já ouvi.';
  return 'Não colou. Mas está registrado que você tentou.';
}
function dayVerdict(st){
  const r=st.p?st.e/st.p:1;
  if(st.p&&r===1&&!st.atrasos)return {v:'Dia sem ressalvas',tone:'secondary',q:'Tudo entregue, nada atrasado. Não vou elogiar. Mas anotei.'};
  if(r>=.5)return {v:'Dia tolerado',tone:'tertiary',q:`${cap(ext(st.e))} de ${ext(st.p)}. Já vi piores. Já vi melhores também.`};
  return {v:'Dia rejeitado',tone:'error',q:`${cap(ext(st.e))} de ${ext(st.p)}. Amanhã a gente conversa.`};
}

let AC=null;
function sound(kind,t){
  if(!S.settings.sons||(t&&!t.notify))return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();const ctx=AC;if(ctx.state==='suspended')ctx.resume();
    const tone=(f,st,d,type,g)=>{const o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.value=f;const t0=ctx.currentTime+st;v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(g,t0+.01);v.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(v);v.connect(ctx.destination);o.start(t0);o.stop(t0+d+.03);};
    if(kind==='alarm')[0,.25,.5].forEach(s=>tone(880,s,.18,'square',.05));
    else if(kind==='bip')tone(1000,0,.09,'sine',.08);
    else if(kind==='bip2')tone(1250,0,.11,'square',.05);
    else if(kind==='bip3')tone(1500,0,.13,'square',.08);
    else [0,.5,1,1.5].forEach(s=>tone(68,s,.14,'sine',.3));
  }catch(e){}
}

function head(eyebrow,title,right,sub){return `<header class="vh"><div class="vh-l">${eyebrow?`<p class="eyebrow">${eyebrow}</p>`:''}<h1 class="h1">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${right||''}</header>`;}
function closedBanner(){if(!S.closed)return '';return `<div class="banner"><span>${ic('sun','ic-s')} Dia encerrado às <b>${hhmm(S.closed.at)}</b>. Relógios parados até amanhã.</span><button class="btn btn-ghost btn-sm" data-act="novoDia">Começar o próximo expediente (demo)</button></div>`;}
function planSeg(a){return `<div class="seg" role="tablist" aria-label="Período do plano">
  <button role="tab" aria-selected="${a==='hoje'}" data-act="go" data-arg="prancheta"><span>Hoje</span><small>plano do dia</small></button>
  <button role="tab" aria-selected="${a==='semana'}" data-act="semana"><span>Semana · Mês ${S.pro?'':ic('lock','ic-xs')}</span><small>${S.pro?'PRO ativo':'PRO · upgrade'}</small></button></div>`;}
/* grátis: "Montar expediente · PRO" é a chamada de upgrade (Semana e Mês só aparecem lá) */
function proBtn(){return `<button class="btn btn-ghost" data-act="${S.pro?'go':'paywall'}" data-arg="expediente">${ic('expediente','ic-s')} Montar expediente ${bdg('PRO','primary')}</button>`;}
/* estimativa do card: 45 min · 1h · 1h30min · 2h35min */
function fmtCard(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;if(!h)return `${m} min`;return m?`${h}h${pad(m)}min`:`${h}h`;}
/* ---- card de tarefa (v4): estimativa grande à direita; suspensa e entregue trocam o número por carimbo ---- */
function taskStamp(t){
  const run=S.run&&S.run.taskId===t.id;
  if(t.status==='entregue'){const v=VERD[t.verdict||'prazo'];return bdg(`${ic('check','ic-xs')} Entregue · ${hhmm(t.deliveredAt)} · ${v[0]}`,v[1]);}
  if(run){const r=S.run;if(r.phase==='pause')return bdg(`${ic('pause','ic-xs')} Em pausa`,'caution');return isLate()?bdg('Tempo esgotado','error'):bdg('Em foco','primary');}
  if(t.status==='suspensa')return bdg(`Desde ${hhmm(t.suspendedAt)}`,'neutral');
  if(t.status==='amanha')return bdg('Levada para amanhã','tertiary',{soft:true});
  if(t.status==='abandonada')return bdg('Abandonada','error',{soft:true});
  if(t.origin==='ontem')return bdg('Adiada de ontem','neutral');
  if(t.startedAt)return bdg(`Reativada${t.horario?' · volta às '+t.horario:''}`,'neutral');
  return '';
}
function taskMeta(t,ctx){
  const run=S.run&&S.run.taskId===t.id;
  if(t.status==='entregue')return `est. ${fmtMin(t.est)}${t.extraMin?' + '+t.extraMin+' pedidos':''} · real ${fmtMin(t.workMs/MIN)}`;
  if(run)return `<span data-t="side-run"></span> ${isLate()?'além da estimativa':'restantes'}${S.run.phase==='pause'?' · em pausa, correndo':''}`;
  if(t.status==='suspensa')return `feito ${clockMs(t.workMs)} de ${clockMs(combMin(t)*MIN)}`;
  const parts=[];
  if(ctx==='pressao')parts.push(t.lembrete?`Pausa a cada ${t.lembrete} min`:'Sem pausa');
  else parts.push(t.origin==='ontem'?'Ficou de ontem':`Criada às ${hhmm(t.signedAt)}`);
  if(t.startedAt)parts.push(`feito ${fmtMin(t.workMs/MIN)}`);
  if(t.horario&&(!t.startedAt||t.status==='fila'))parts.push(`às ${t.horario}`);
  return parts.join(' · ');
}
function taskRight(t){
  const run=S.run&&S.run.taskId===t.id;
  if(t.status==='entregue')return `<span class="stamp ${t.verdict==='muito'?'late':'ok'}">Entregue</span>`;
  if(t.status==='suspensa')return '<span class="stamp susp">Suspensa</span>';
  if(t.status==='amanha'||t.status==='abandonada')return '';
  if(run)return ic('chev','chevron');
  return `<span class="task-est">${fmtCard(t.startedAt?Math.max(1,combMin(t)-t.workMs/MIN):t.est)}</span>`;
}
function taskCard(t,ctx){
  const run=S.run&&S.run.taskId===t.id;
  const cls=[t.status==='entregue'?'is-done':'',t.status==='suspensa'?'is-susp':'',run?(S.run.phase==='pause'?'is-paused':isLate()?'is-late':'is-run'):''].join(' ');
  const extra=t.status==='entregue'?`<button class="btn btn-link btn-sm reuse" data-act="reutilizar" data-arg="${t.id}">${ic('reuse','ic-s')} Reutilizar como modelo</button>`
    :t.status==='suspensa'&&ctx!=='pressao'?`<button class="btn btn-link btn-sm reuse" data-act="reativar" data-arg="${t.id}">Reativar →</button>`:'';
  return `<li class="task-wrap"><button class="task ${cls}" data-act="abrir" data-arg="${t.id}"><span class="bdgs">${taskStamp(t)}${impBdg(t)}</span><span class="task-title">${esc(t.title)}</span><span class="task-meta">${taskMeta(t,ctx)}</span>${taskRight(t)}</button>${extra}</li>`;
}
function vPrancheta(){
  const k=today();const fila=queue();
  const done=S.tasks.filter(t=>t.day===k&&t.status==='entregue').sort((a,b)=>b.deliveredAt-a.deliveredAt);
  const other=S.tasks.filter(t=>t.day===k&&(t.status==='amanha'||t.status==='abandonada'));
  return `<div class="view">
  ${head(dateLong(),'Prancheta do Chefe',proBtn(),'Aqui é onde você define suas tarefas.')}
  ${S.pro?planSeg('hoje'):''}
  ${closedBanner()}
  <section class="one-col" aria-label="Tarefas do dia">
    <div class="list-head"><span class="over">Na fila · ${fila.length}</span></div>
    <button class="btn btn-primary btn-lg btn-block" data-act="nova" ${S.closed?'disabled':''}>${ic('plus')} Nova tarefa</button>
    ${fila.length?`<ol class="tasks">${fila.map(t=>taskCard(t)).join('')}</ol>`:`<div class="empty">${boss(pick('vazia'))}</div>`}
    ${done.length?`<div class="list-head"><span class="over">Entregues hoje · ${done.length}</span></div><ol class="tasks">${done.map(t=>taskCard(t)).join('')}</ol>`:''}
    ${other.length?`<div class="list-head"><span class="over">Fora da fila · ${other.length}</span></div><ol class="tasks">${other.map(t=>taskCard(t)).join('')}</ol>`:''}
  </section></div>`;
}
function capacityCard(){
  const k=today();const capM=workdayMin();const tot=sum(dayItems(k),x=>x.est);const over=tot>capM;
  return `<div class="card"><span class="over">Capacidade de hoje · PRO</span>
    <div class="cap-num">${fmtShort(tot)} <span>/ ${fmtShort(capM)}</span></div>
    <div class="meter ${over?'over':''}"><i style="width:${Math.min(100,tot/capM*100)}%"></i></div>
    <p class="fine">${over?`Passou ${fmtMin(tot-capM)} do expediente. Vai prometer o que não cabe?`:`Cabem mais ${fmtMin(capM-tot)} hoje, contando os rascunhos.`}</p></div>`;
}
function vSemana(){
  if(!S.pro)return vPrancheta();
  const mode=S.ui.pmode||'semana';const days=weekDays();const capM=workdayMin();const tk=today();
  let drafts=0;days.forEach(d=>{if(d.key>=tk)drafts+=(S.week[d.key]||[]).filter(x=>!x.signed).length;});
  const body=mode==='semana'?`<div class="week">${days.map(d=>dayCol(d,capM,tk)).join('')}</div>
    <div class="row" style="justify-content:space-between"><p class="note">Tracejado = rascunho · ${ic('pen','ic-xs')} = assinada · dia em vermelho passa da capacidade</p>
    <button class="btn btn-primary btn-lg" data-act="signWeek" ${drafts?'':'disabled'}>${ic('pen')} Assinar plano da semana (${drafts})</button></div>`:monthView(capM);
  return `<div class="view">
  ${head(mode==='semana'?`Semana ${weekRange()}`:cap(MOL[new Date(now()).getMonth()]),mode==='semana'?'Plano da semana':'Plano do mês',proBtn())}
  ${planSeg('semana')}
  ${closedBanner()}
  <div class="cols" style="align-items:center">
    <div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0">
      <div class="seg seg-sm" role="tablist" aria-label="Visão"><button role="tab" aria-selected="${mode==='semana'}" data-act="pmode" data-arg="semana">Semana</button><button role="tab" aria-selected="${mode==='mes'}" data-act="pmode" data-arg="mes">Mês</button></div>
      ${boss('Promoção aceita. Promessa grande, cobrança maior. Assina tudo de uma vez e eu cobro tudo de uma vez.')}
    </div>
    ${capacityCard()}
  </div>
  ${body}</div>`;
}
function dayItems(key){
  const plan=S.week[key]||[];
  if(key===today()){
    const real=S.tasks.filter(t=>t.day===key&&!['excluida','amanha'].includes(t.status)).map(t=>({id:t.id,title:t.title,est:t.est,signed:true,real:true,done:t.status==='entregue'}));
    return real.concat(plan.filter(x=>!x.signed));
  }
  return plan;
}
function dayCol(d,capM,tk){
  const items=dayItems(d.key);const tot=sum(items,x=>x.est);const over=tot>capM;const past=d.key<tk;const isT=d.key===tk;
  return `<section class="day ${past?'is-past':''} ${isT?'is-today':''} ${over?'is-over':''}" aria-label="${d.label}">
    <div class="day-h"><span class="day-name">${d.label}${isT?bdg('hoje','neutral'):''}</span><span class="day-load">${fmtShort(tot)} / ${fmtShort(capM)}${over?' · não cabe':''}</span><div class="meter ${over?'over':''}"><i style="width:${Math.min(100,tot/capM*100)}%"></i></div></div>
    <ul>${items.map(x=>`<li class="pi ${x.signed?'signed':'draft'} ${x.done?'done':''}">${x.signed?ic('pen','ic-xs'):''}<span>${esc(x.title)}</span><span class="pi-est">${fmtShort(x.est)}</span>${!x.signed&&!past?`<button class="pi-x" data-act="rmDraft" data-arg="${d.key}|${x.id}" aria-label="Remover rascunho ${esc(x.title)}">×</button>`:''}</li>`).join('')}</ul>
    ${past?'<p class="fine">Dia encerrado.</p>':S.ui.addDay===d.key?addForm(d.key):`<button class="add" data-act="addDay" data-arg="${d.key}">+ adicionar</button>`}
  </section>`;
}
function addForm(key){const a=S.ui.add||{title:'',est:60};return `<div class="addf"><label class="sr" for="add-title">Título do rascunho</label><input id="add-title" class="input" data-model="ui.add.title" data-enter="addDraft" value="${esc(a.title)}" placeholder="O que vai prometer?" maxlength="70" autocomplete="off">
  <label class="sr" for="add-est">Estimativa</label><select id="add-est" class="input" data-model="ui.add.est" data-num>${[15,30,45,60,90,120,180,240].map(v=>`<option value="${v}" ${v==a.est?'selected':''}>${fmtMin(v)}</option>`).join('')}</select>
  <div class="row"><button class="btn btn-primary btn-sm" data-act="addDraft" ${a.title.trim().length<3?'disabled':''}>Adicionar rascunho</button><button class="btn btn-link btn-sm" data-act="cancelAdd">Cancelar</button></div></div>`;}
function monthView(capM){
  const n=new Date(now());const y=n.getFullYear(),m=n.getMonth();const tk=today();
  const first=new Date(y,m,1,12);const last=new Date(y,m+1,0,12).getDate();
  let cells=[];let lead=(first.getDay()+6)%7;if(lead>4)lead=0;
  for(let i=0;i<lead;i++)cells.push('<div class="mcell out" aria-hidden="true"></div>');
  const wk=weekDays().map(d=>d.key);
  for(let d=1;d<=last;d++){
    const dt=new Date(y,m,d,12);const dow=dt.getDay();if(dow===0||dow===6)continue;
    const k=dayKey(dt.getTime());let tot;
    if(wk.includes(k))tot=sum(dayItems(k),x=>x.est);
    else if(k<tk)tot=240+((d*37)%5)*45;
    else tot=((d*13)%4)*60;
    cells.push(`<div class="mcell ${k===tk?'is-today':''}"><b>${d}</b><small>${tot?`${fmtShort(tot)} / ${fmtShort(capM)}`:'livre'}</small><div class="meter ${tot>capM?'over':''}"><i style="width:${Math.min(100,tot/capM*100)}%"></i></div></div>`);
  }
  return `<div class="month">${['Seg','Ter','Qua','Qui','Sex'].map(x=>`<span class="mhead">${x}</span>`).join('')}${cells.join('')}</div>
  <p class="note">Dias passados mostram o que foi assinado. A semana atual se edita na visão Semana.</p>`;
}

/* ---- Modo Pressão (v6): layout próprio, três caminhos com a mesma fila ----
   2a sala escura (trilho + tabela) · 2b palco (uma em destaque, fila na coxia) · 2c linha do dia.
   O clique seleciona; "Iniciar" abre a ficha em modal (10c), que é a confirmação.
   A selecionada vai para o começo da fila, e os horários "se começar agora" contam a partir dela. */
const PML={'2a':['Sala escura','trilho + tabela de execução'],'2b':['Palco','uma tarefa em destaque, fila na coxia'],'2c':['Linha do dia','fila como linha do tempo']};
let PMR=null;
function pmL(){return PML[S.pmLayout]?S.pmLayout:'2a';}
function pmDur(t){if(S.run&&S.run.taskId===t.id)return Math.max(0,remainMs(t)/MIN);return t.startedAt?Math.max(1,combMin(t)-t.workMs/MIN):t.est;}
function pmPlan(){
  const q=queue();const r=S.run;const n=now();
  const run=r?q.find(t=>t.id===r.taskId)||null:null;
  const ready=q.filter(t=>t.status!=='suspensa'&&t!==run);
  const susp=q.filter(t=>t.status==='suspensa');
  const sel=run||ready.find(t=>t.id===S.ui.sel)||ready[0]||null;
  const order=run?[run].concat(ready):sel?[sel].concat(ready.filter(t=>t!==sel)):ready;
  let c=n;
  const rows=order.map(t=>{const d=pmDur(t);const start=c;c+=d*MIN;return {t,d,start,end:c,run:t===run,sel:t===sel};});
  return {q,run,sel,rows,susp,total:sum(rows,x=>x.d),end:c};
}
function pmState(){const r=S.run;if(!r)return '';return r.phase==='pause'?'is-paused':isLate()?'is-late':'is-run';}
function pmPausa(t){return t.lembrete?`Pausa a cada ${t.lembrete} min`:'Sem pausa';}
function pmMarks(t,short){
  const st=t.status==='suspensa'?bdg(`${ic('pause','ic-xs')} Suspensa${short?'':' · desde '+hhmm(t.suspendedAt)}`,'neutral'):(t.origin==='ontem'&&!t.startedAt&&t.status==='fila')?bdg(short?'Adiada':'Adiada de ontem','neutral'):taskStamp(t);
  const i=IMP[t.imp]||IMP.media;
  return st+`<span class="bdg bdg-line">${short?i[0]:'Importância '+i[0].toLowerCase()}</span>`;
}
function pmRunLabel(){const r=S.run;return r.phase==='pause'?'Em pausa · a tarefa segue correndo':isLate()?'Tempo esgotado':'Em foco';}
function pmNote(){return `<p class="note">${ic('pen','ic-xs')} Tarefa nova? Só pela Prancheta. E assinada.</p>`;}
function pmNoReady(){return boss('Só sobrou suspensa na fila. Suspensa não se inicia daqui. Fala comigo no Modo Chefe.');}
function pmGo(p,cls){
  if(S.run)return `<button class="btn btn-primary btn-lg ${cls||''}" data-act="foco">${ic('play')} Voltar ao foco</button>`;
  return `<button class="btn btn-primary btn-lg ${cls||''}" data-act="pmIniciar" ${S.closed||!p.sel?'disabled':''}>Iniciar →</button>`;
}
function vPressao(){
  const q=queue();const L=pmL();PMR=L;
  const inner=(!q.length&&!S.run)?vZerada():L==='2a'?pm2a(pmPlan()):L==='2b'?pm2b(pmPlan()):pm2c(pmPlan());
  if(L==='2a')return inner;
  return `<div class="pm-page">${pmTop()}<div class="pm-body">${L==='2b'&&(q.length||S.run)?inner:`<div class="pm-pad" style="flex:1;display:flex;flex-direction:column">${inner}</div>`}</div></div>`;
}
/* trilho de ícones (2a): substitui a barra lateral só no Modo Pressão */
function renderRail(){
  const n=openCobs().length;
  const it=(r,go,label,icon,extra)=>`<a href="#" class="rail-it ${navActive(r)?'on':''}" data-act="go" data-arg="${go}" ${navActive(r)?'aria-current="page"':''}><span class="rail-ic">${ic(icon)}${extra||''}</span><span class="rail-lb">${label}</span></a>`;
  return `<span class="logo-mark" role="img" aria-label="BOSSFYME">${ic('timer','fill')}</span>
  <nav class="rail-nav" aria-label="Seções">${it('chefe','prancheta','Chefe','prancheta')}${it('pressao','pressao','Pressão','pressao')}${it('cobrancas','cobrancas','Cobranças','cobrancas',n?`<span class="count" aria-label="${n} pendentes">${n}</span>`:'')}${it('dossie','dossie','Dossiê','dossie')}</nav>
  <span class="rail-sp"></span>${avatar()}`;
}
/* barra do topo (2b e 2c): troca de modo vira chave */
function pmTop(){
  const n=openCobs().length;
  return `<header class="pm-top">${logo()}
    <div class="pm-modes" role="group" aria-label="Modo"><button type="button" data-act="go" data-arg="prancheta">Modo Chefe</button><button type="button" class="on" aria-current="page">Modo Pressão</button></div>
    <div class="pm-top-r"><a href="#" class="pm-ic" data-act="go" data-arg="cobrancas" aria-label="Cobranças${n?`, ${n} pendentes`:''}">${ic('cobrancas')}${n?`<span class="count" aria-hidden="true">${n}</span>`:''}</a><a href="#" class="pm-ic" data-act="go" data-arg="dossie" aria-label="Dossiê">${ic('dossie')}</a><span class="pm-clock" data-t="hhmm"></span>${avatar()}</div>
  </header>`;
}
/* 2a · sala escura: tabela numerada com "se começar agora"; Iniciar fixo embaixo */
function pmRowA(x,i){
  const t=x.t;const susp=!!x.susp;
  const cls=x.run?pmState():x.sel?'is-sel':susp?'is-susp':'';
  const dura=x.run?'<span data-t="side-run"></span>':fmtMin(susp?Math.max(1,combMin(t)-t.workMs/MIN):x.d);
  const ate=x.run?(isLate()?'passou da estimativa':`prazo às ${hhmm(x.end)}`):susp?'volta pelo Chefe':`até ${hhmm(x.end)}`;
  const meta=x.run?`${pmRunLabel()} · clique para voltar`:taskMeta(t,'pressao');
  return `<button class="pa-row ${cls}" data-act="pmSel" data-arg="${t.id}" role="listitem" ${!x.run&&!susp&&!S.run?`aria-pressed="${!!x.sel}"`:''}>
    <span class="pa-n">${i?pad(i):'—'}</span>
    <span class="pa-t"><span class="pa-tt">${esc(t.title)}</span><span class="pa-m">${meta}</span></span>
    <span class="pa-b">${pmMarks(t,true)}</span>
    <span class="pa-d">${dura}</span><span class="pa-a">${ate}</span></button>`;
}
function pm2a(p){
  const r=S.run;
  const rows=p.rows.map((x,i)=>pmRowA(x,i+1)).join('')+p.susp.map(t=>pmRowA({t,susp:true},0)).join('');
  const head1=p.rows.length?`fila inteira: ${fmtMin(p.total)} · acaba ${hhmm(p.end)}`:'nada para iniciar';
  const bar=r?`<div class="pa-bar is-run"><div><span class="over">${pmRunLabel()}</span><strong>${esc(p.run.title)} · <span data-t="side-run"></span></strong></div>${pmGo(p)}</div>`
    :p.sel?`<div class="pa-bar"><div><span class="over">Selecionada</span><strong>${esc(p.sel.title)} · ${fmtMin(p.rows[0].d)}</strong></div>${pmGo(p)}</div>`:'';
  return `<div class="view pa">
  <header class="pa-head"><div><p class="over">Modo Pressão · ${dateLong()}</p><h1 class="pa-title">${r?'Uma de cada vez. Termina a que está aberta.':'Escolha uma. O resto espera.'}</h1></div>
    <div class="pa-clock"><span data-t="hhmm"></span><small>${head1}</small></div></header>
  ${closedBanner()}
  <div class="pa-table"><div class="pa-th" aria-hidden="true"><span>Ordem</span><span>Tarefa</span><span>Marcas</span><span>Dura</span><span>Se começar agora</span></div>
    <div role="list" aria-label="Fila" style="display:flex;flex-direction:column;gap:10px">${rows}</div></div>
  ${p.rows.length?pmNote():pmNoReady()}
  <div class="pa-spacer"></div>
  ${bar}
  </div>`;
}
/* 2b · palco: a selecionada ocupa o palco com o tempo enorme; as outras ficam na coxia */
function pm2b(p){
  const r=S.run;const x=p.rows[0];const t=x&&x.t;
  const late=r&&isLate();
  let stage;
  if(!t)stage=`<div class="pb-card">${pmNoReady()}<button class="btn btn-ghost" data-act="go" data-arg="prancheta" style="align-self:flex-start">Ir pro Modo Chefe →</button></div>`;
  else stage=`<div class="pb-card ${r?pmState():''}">
    <div class="row" style="gap:8px">${pmMarks(t)}</div>
    <h1 class="pb-title">${esc(t.title)}</h1>
    <span class="pb-meta">${pmPausa(t)} · ${t.origin==='ontem'?'assinada ontem':`assinada ${hhmm(t.signedAt)}`}</span>
    <div style="flex:1"></div>
    <div class="pb-foot"><div>
      <span class="over">${r?(late?'Passou da estimativa':r.phase==='pause'?'Em pausa · o relógio não para':'Correndo · o relógio não para'):'O prazo nasce no início'}</span>
      ${r?'<span class="pb-time" data-t="remain" role="timer"></span><span class="pb-sub" data-t="prazo"></span>':`<span class="pb-time">${clockMs(x.d*MIN)}</span><span class="pb-sub">se começar agora, entrega até ${hhmm(x.end)}</span>`}
    </div>${pmGo(p,'pb-go')}</div></div>`;
  const cx=p.rows.slice(1).map(y=>`<button class="pb-cx" data-act="pmSel" data-arg="${y.t.id}"><span class="row" style="gap:6px">${pmMarks(y.t)}</span><span class="pb-cx-row"><b>${esc(y.t.title)}</b><span>${fmtMin(y.d)}</span></span></button>`)

/* 2c · linha do dia: a fila vira linha do tempo a partir de AGORA; largura = duração */

  for(let h=h0.getTime();h<=n+span*MIN;h+=60*MIN){const f=(h-n)/MIN/span;if(f<-.03||f>.96)continue;lines+=`<div class="pc-hl" style="left:${pos(f)}"><span>${new Date(h).getHours()}h</span></div>`;}
  const blocks=p.rows.map(y=>{

  }).join('');

  ${closedBanner()}

}

function weekStats(){
  const tk=today();
  return weekDays().map(d=>{let s=null;if(d.key===tk)s=statsToday();else if(S.archive[d.key])s=S.archive[d.key];return Object.assign({},d,{s,isToday:d.key===tk});});
}
/* Tarefas da semana (Dossiê): dias passados (semente) + hoje */
const TWST={prazo:['No prazo','secondary'],pouco:['Passou pouco','caution'],muito:['Atrasou','error'],desistiu:['Desistiu','neutral'],excluida:['Excluída','dash'],suspensa:['Suspensa','caution'],fila:['Na fila','neutral'],amanha:['Adiada','tertiary']};
function weekTasks(){
  const k=today();
  const td=S.tasks.filter(t=>t.day===k).map(t=>{
    const st=t.status==='entregue'?(t.verdict||'prazo'):t.status==='abandonada'?'desistiu':t.status==='excluida'?'excluida':t.status==='suspensa'?'suspensa':t.status==='amanha'?'amanha':'fila';
    return {day:k,title:t.title,st,at:t.deliveredAt||t.suspendedAt||t.signedAt||0};}).sort((a,b)=>b.at-a.at);
  const past=(S.weekLog||[]).slice().sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:0);
  return td.concat(past);
}
function twRow(x){const s=TWST[x.st]||TWST.fila;const b=s[1]==='dash'?`<span class="bdg bdg-dash">${s[0]}</span>`:bdg(s[0],s[1],{soft:s[1]!=='neutral'&&s[1]!=='error'});return `<li class="${x.st==='excluida'?'x':''}"><time>${x.day===today()?'Hoje':WDS[new Date(keyDate(x.day)).getDay()]}</time><span>${esc(x.title)}</span>${b}</li>`;}

  const pArr=Object.entries(pauses).sort((a,b)=>b[1]-a[1]);const pMax=Math.max(1,...pArr.map(x=>x[1]));

  const tiles=[

    ['er','Estimado x real',`${dev>0?'+':''}${dev}%`,`${fmtShort(A.estM||0)} → ${fmtShort(A.realM||0)}`,dev>10],
    ['id','Ideias anotadas',`${A.ideas||0}`,'anotadas no foco',false],

  return `<div class="view">

      <span class="over" style="margin-top:6px">Padrões de desculpa</span><div class="pchips">${eArr.map(([k,v])=>`<span>${esc(k)} ${v}x</span>`).join('')}</div></div>

  ${top?`<div style="max-width:760px">${boss(QX[top[0]]?QX[top[0]](top[1]):'Anotado.')}</div>`:''}
  <div class="card"><span class="over">Anotações no dossiê</span>${notes.length?`<ul class="notes">${notes.slice(0,8).map(n=>`<li><time>${dayLabel(n.at)} ${hhmm(n.at)}</time><span><b>${esc(n.tag)}.</b> ${esc(n.txt)}</span></li>`).join('')}</ul>`:'<p class="fine">Ideias do foco, riscos assumidos, tarefas suspensas ou excluídas e reflexões do fim do dia aparecem aqui.</p>'}</div>
  <p class="note">Clique em qualquer número para ver a lista que gerou o número.</p></div>`;
}
function weekChart(ws){
  const W=520,H=230,L=34,B=34,Tp=18;const max=Math.max(4,...ws.map(d=>d.s?d.s.p:0));const top=Math.ceil(max/2)*2;
  const y=v=>Tp+(H-Tp-B)*(1-v/top);const band=(W-L-8)/5;
  let g='';for(let v=0;v<=top;v+=2){g+=`<line class="ch-grid" x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-lbl" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  const bars=ws.map((d,i)=>{const cx=L+band*i+band/2;const bw=Math.min(46,band*.5);const lbl=`<text class="ch-day ${d.isToday?'today':''}" x="${cx}" y="${H-12}" text-anchor="middle">${d.label}</text>`;
    if(!d.s)return lbl+`<line class="ch-grid" x1="${cx-bw/2}" x2="${cx+bw/2}" y1="${y(0)}" y2="${y(0)}" stroke-dasharray="3 3"/><text class="ch-lbl" x="${cx}" y="${y(0)-8}" text-anchor="middle">—</text>`;
    return lbl+`<rect class="ch-out" x="${cx-bw/2}" y="${y(d.s.p)}" width="${bw}" height="${y(0)-y(d.s.p)}" rx="4"/><rect class="ch-fill ${d.isToday?'today':''}" x="${cx-bw/2+5}" y="${y(d.s.e)}" width="${bw-10}" height="${Math.max(0,y(0)-y(d.s.e))}" rx="3"/><text class="ch-val" x="${cx}" y="${y(d.s.p)-7}" text-anchor="middle">${d.s.e} de ${d.s.p}</text>`;}).join('');
  return `<div class="card chart"><div class="row" style="justify-content:space-between"><span class="over">Prometido x entregue por dia</span><span class="legend"><span><i class="lg-out"></i>prometido</span><span><i class="lg-fill"></i>entregue</span></span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tarefas prometidas e entregues por dia da semana">${g}${bars}</svg></div>`;
}
function dayChart(){
  const ts=S.tasks.filter(t=>t.day===today()&&taskWork(t)>0);
  if(!ts.length)return `<div class="card"><span class="over">Estimado x real por tarefa</span><p class="fine">Nenhuma tarefa trabalhada hoje ainda.</p></div>`;
  const mx=Math.max(...ts.map(t=>Math.max(combMin(t),taskWork(t)/MIN)));
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="over">Estimado x real por tarefa · minutos</span></div>
  <div class="hbars">${ts.map(t=>{const r=Math.round(taskWork(t)/MIN);const v=r<=combMin(t)?'var(--secondary)':r<=combMin(t)+t.est*.2?'var(--tertiary)':'var(--error)';return `<div><p class="fine" style="color:var(--ink);margin-bottom:4px">${esc(t.title)}</p><div class="hb"><span>est.</span><div class="hb-track"><div class="hb-fill" style="width:${combMin(t)/mx*100}%;background:var(--outline)"></div></div><b>${combMin(t)}</b></div><div class="hb"><span>real</span><div class="hb-track"><div class="hb-fill" style="width:${r/mx*100}%;background:${v}"></div></div><b>${r}</b></div></div>`;}).join('')}</div></div>`;
}

function pTarefa(p){
  const t=task(p.id);if(!t)return '';

  const status=done?'entregue':started?`já começou · feito ${clockMs(t.workMs)}`:'não iniciada';
  let kv=`<div><dt>Status</dt><dd>${status}</dd></div><div><dt>Estimativa</dt><dd>${fmtMin(t.est)}${t.extraMin?' + '+t.extraMin:''}</dd></div><div><dt>Importância</dt><dd>${IMP[t.imp][0].toLowerCase()}</dd></div><div><dt>Horário</dt><dd>${t.horario?'às '+t.horario:'sem horário'}</dd></div><div><dt>Lembrete de pausa</dt><dd>${lembTxt(t)}</dd></div><div><dt>Notificação e som</dt><dd>${t.notify?'ligados':'desligados'}</dd></div>`;

  const quote=done?'Entregue é entregue. Quer de novo? Reutiliza como modelo.':editable?'Ainda não começou? Mexe à vontade. Depois do Iniciar, só suspendendo.':'Já começou. Agora só suspendendo, lá no foco.';

    :editable?`<button class="btn btn-primary btn-lg btn-block" data-act="editar">${ic('edit','ic-s')} Editar tarefa</button><div class="row" style="display:grid;grid-template-columns:1fr 1fr;width:100%"><button class="btn btn-ghost" data-act="irPressao" data-arg="${t.id}">Ir pro Modo Pressão</button><button class="btn btn-danger" data-act="excluirPedir">${ic('trash','ic-s')} Excluir</button></div>`
    :`<button class="btn btn-primary btn-lg btn-block" data-act="irPressao" data-arg="${t.id}">Ir pro Modo Pressão</button>`;
  return `<div class="scrim ${fresh(p)}" data-act="fecharPainel"></div><div class="panel ${fresh(p)}" role="dialog" aria-modal="true" aria-labelledby="pt-h">
  <div class="panel-head">${headB}<button class="btn btn-link" data-act="fecharPainel">Fechar ${ic('x','ic-s')}</button></div>
  <div class="panel-body"><h2 id="pt-h" class="h2">${esc(t.title)}</h2>${t.desc?`<p class="sub">${esc(t.desc)}</p>`:''}
    <dl class="rows">${kv}</dl>
    ${boss(quote)}
    ${del}
  </div>
  <div class="panel-foot" style="flex-direction:column">${foot}</div></div>`;
}

function updateTicks(){
  const n=now();const V={},W={};
  V.hhmm=hhmm(n);
  V.simclock=`${dateLong(n)} · ${hhmm(n)}:${pad(new Date(n).getSeconds())} · ${S.clock.speed}×`;
  const r=S.run;
  if(r){
    const t=task(r.taskId);const w=taskWork(t);const c=combMin(t)*MIN;const left=c-w;
    V.remain=clockMs(left);
    V['remain-big']=clockMs(Math.max(0,left));
    V.prazo=left>=0?`prazo às ${hhmm(n+left)}`:`combinado: ${fmtMin(combMin(t))}`;
    V.elapsed=clockMs(w);
    V.over=clockMs(Math.min(0,left));
    V.overchip=`+${Math.max(0,Math.floor(-left/MIN))} min`;
    V.ringcap=`Estimativa · ${clockMs(c)} · ${clockMs(w)} decorridos`;
    V['prazo-h']=hhmm(n+left);
    V.tasksub=left>=0?`${clockMs(w)} de ${clockMs(c)} · prazo às ${hhmm(n+left)}`:`${clockMs(w)} de ${clockMs(c)} · passou da estimativa`;
    V['side-run']=clockMs(left);
    if(r.phase==='pause'&&r.pause){const p=r.pause;const tot=pauseTot(p),el=n-p.start,pl=tot-el;
      V.pleft=clockMs(Math.max(0,pl));V.pexc=clockMs(Math.min(0,pl));
      V.ptot=`de ${clockMs(tot).replace(/^0(?=\d:)/,'')} · você pediu ${p.reqMin} min${p.extMin?` + ${p.extMin} de extensão`:''}`;
      V['pexc-desc']=`Pausa de ${fmtMin(tot/MIN)} · +${minSec(-pl)} · a tarefa seguiu correndo`;
      W.pfill=Math.min(100,el/tot*100);}
    W.fill=Math.min(100,w/c*100);
    const ring=document.querySelector('[data-ring="main"]');if(ring)ring.setAttribute('stroke-dashoffset',(RING_C*(1-ringProg())).toFixed(1));
  }
  if(S.cafe){const el=n-S.cafe.start;V.cafe=clockMs(Math.max(0,5*MIN-el));V.cafeexc=clockMs(5*MIN-el);}
  document.querySelectorAll('[data-t]').forEach(el=>{const v=V[el.dataset.t];if(v!==undefined&&el.textContent!==v)el.textContent=v;});
  document.querySelectorAll('[data-tw]').forEach(el=>{const v=W[el.dataset.tw];if(v!==undefined)el.style.width=v+'%';});
  const d=new Date(S.closed?S.closed.at:n);const hA=(d.getHours()%12)*30+d.getMinutes()*.5,mA=d.getMinutes()*6+d.getSeconds()*.1;
  document.querySelectorAll('[data-clock="h"]').forEach(el=>el.setAttribute('transform',`rotate(${hA.toFixed(1)} 52 52)`));
  document.querySelectorAll('[data-clock="m"]').forEach(el=>el.setAttribute('transform',`rotate(${mA.toFixed(1)} 52 52)`));
  document.querySelectorAll('[data-t-aria="clock"]').forEach(el=>el.setAttribute('aria-label',`Relógio: ${hhmm(d.getTime())}`));
}

let lastSave=0;let lastPmMin='';
function tick(){
  if(!S)return;const n=now();let re=false;const r=S.run;
  if(r&&!S.closed){
    const t=task(r.taskId);const w=taskWork(t);const c=combMin(t)*MIN;const left=c-w;
    /* relógio da tarefa: corre em qualquer fase, inclusive na pausa */
    if(left>0){
      const slot=beepSlot(left);if(slot!==r.beep){r.beep=slot;if(slot)sound(beepKind(slot),t);}
      const lm=left<=MIN;if(lm!==!!r.lastMin){r.lastMin=lm;if(r.phase==='work'&&S.route==='foco')re=true;}
      if(!r.warn5&&left<=5*MIN){r.warn5=true;notify('est','Estimativa acabando',`${t.title}: faltam 5 minutos.`,t);}
    }
    if(left<=0&&!r.lateAt){r.lateAt=n;r.stepsAt=n;r.lastMin=false;re=true;sound('alarm',t);notify('est','Acabou o tempo',`${t.title}: entrega ou pede mais tempo.`,t);if(S.route!=='foco'||r.phase==='pause')toast('Acabou o tempo da tarefa.',r.phase==='pause'?'Ela seguiu correndo durante a pausa.':'A tela do foco ficou vermelha.');}
    else if(r.lateAt&&r.phase==='work'&&n-r.stepsAt>=2*MIN){r.stepsAt=n;sound('steps',t);if(S.route!=='foco'&&S.settings.sons&&t.notify)toast('Passos no corredor.','O tempo acabou e eu estou chegando.');}
    if(r.phase==='work'){
      /* 14 · lembrete de pausa: só avisa, não pausa */
      if(r.remindAt!=null&&w>=r.remindAt){
        if(left>0){const mins=Math.max(1,Math.round((w-(r.focusFrom||0))/MIN));S.ui.remind={t0:Date.now(),n:mins};sound('bip',t);notify('pausa',`${mins} min de foco`,'Quer pausar? Então pede. O relógio não para.',t);if(S.route!=='foco')toast(`${mins} minutos direto.`,'Quer pausar? Então pede.');re=true;}
        while(r.remindAt<=w)r.remindAt+=t.lembrete*MIN;
      }
    }else if(r.pause){
      const p=r.pause;const tot=pauseTot(p);const pl=tot-(n-p.start);
      if(pl>0){
        const slot=beepSlot(pl);if(slot!==p.beep){p.beep=slot;if(slot)sound(beepKind(slot),t);}
        const lm=pl<=MIN;if(lm!==!!p.lastMin){p.lastMin=lm;re=true;if(lm){notify('pausa','Pausa acabando','Último minuto. Volta ou pede mais.',t);if(S.route!=='foco')toast('Pausa acabando.','Último minuto. Volta ou estende lá na aba.');}}
      }else if(!p.excCob){
        p.excCob=addCob({type:'excedente',title:'Pausa · '+p.cat,baseMin:tot/MIN,amountMs:0,taskId:t.id});p.lastMin=false;re=true;sound('alarm',t);
        notify('pausa','A pausa acabou','Cada segundo agora vai para as cobranças.',t);if(S.route!=='foco')toast('A pausa acabou.','Virou cobrança de excedente.');
      }
      if(p.excCob){const x=cob(p.excCob);if(x)x.amountMs=Math.max(0,-pl);}
    }
  }
  if(S.ui.remind&&Date.now()-S.ui.remind.t0>15000){S.ui.remind=null;re=true;}
  if(S.route==='pressao'){const m=hhmm(n);if(m!==lastPmMin){if(lastPmMin)re=true;lastPmMin=m;}}
  if(S.cafe&&!S.closed){
    const c=S.cafe;const len=5*MIN;
    if(!c.excCob&&n-c.start>len){c.excCob=addCob({type:'excedente',title:'Cafezinho entre tarefas',baseMin:5,amountMs:0,taskId:c.taskId});re=true;notify('pausa','O cafezinho acabou','Volte ao trabalho. Cada segundo agora vai para as cobranças.');}
    if(c.excCob){const x=cob(c.excCob);if(x)x.amountMs=n-c.start-len;}
  }
  if(!S.closed&&S.onboarded){
    S.tasks.forEach(t=>{if(t.day===today()&&t.status==='fila'&&t.horario&&!t.called&&n>=atHM(t.horario)){t.called=true;re=true;toast(`${t.horario}. Hora de começar.`,t.title);notify('est',`${t.horario}. Eu disse que chamava.`,t.title,t);sound('alarm',t);}});
    if(!S.day.endAsked&&n>=endOfDay()){S.day.endAsked=true;re=true;notify('ponto',S.pro?'Hora de bater o ponto':'Hora de encerrar o dia',`O expediente acabou às ${S.settings.end}.`);toast(`${S.settings.end}. ${S.pro?'Hora de bater o ponto.':'Hora de encerrar o dia.'}`,'Entrega o que está aberto e fecha o dia.');}
  }
  if(re){save();render();}else updateTicks();
  if(Date.now()-lastSave>3000){lastSave=Date.now();save();}
}

function go(route){S.route=route;S.ui.panel=null;S.ui.modal=null;S.ui._top=true;S.qs=(S.qs||0)+1;save();render();}
function setPath(path,v){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}o[ks[ks.length-1]]=v;}
function newPanel(x){const st=S.settings;return Object.assign({kind:'nova',editId:null,title:'',desc:'',showDesc:true,h:0,m:45,imp:'media',hor:false,horario:nextHalf(),lemb:!!st.lembrete,every:st.lembrete||25,notify:true,signed:null,t0:Date.now()},x||{});}
function panelFromTask(t,x){const est=t.est;return newPanel(Object.assign({title:t.title,desc:t.desc||'',h:Math.floor(est/60),m:Math.round((est%60)/5)*5,imp:t.imp,hor:!!t.horario,horario:t.horario||nextHalf(),lemb:!!t.lembrete,every:t.lembrete||S.settings.lembrete||25,notify:t.notify},x||{}));}
function fieldsFromPanel(p){return {title:p.title.trim(),desc:(p.desc||'').trim(),est:panelEst(p),imp:p.imp,horario:p.hor?p.horario:null,lembrete:p.lemb?Number(p.every):null,notify:!!p.notify};}
function startExcuse(id,ret){S.ui.exc={cobId:id,step:1,cat:null,relato:'',se:'',faco:'',returnTo:ret||null};S.ui.pip=null;go('desculpa');}
function finishExcuse(skip){
  const e=S.ui.exc;const c=cob(e.cobId);if(!c)return;
  if(skip){e.se='';e.faco='';}
  const v=verdictOf(c,e);
  c.status='explicada';c.excuse={cat:e.cat,relato:e.relato.trim(),se:(e.se||'').trim(),faco:(e.faco||'').trim()};c.verdict=v.v;c._rep=v.rep;c.explainedAt=now();
  let applied='';
  if(c.encMove){const t=task(c.taskId);if(t)t.status='amanha';if(S.enc)S.enc.decisions[c.taskId]='amanha';applied='Tarefa levada para a fila de amanhã.';}
  S.ui.verd={cobId:c.id,t0:Date.now(),returnTo:e.returnTo,applied};S.ui.exc=null;
  if(S.ui.returnEnc&&!openCobs().length&&S.enc){S.enc.step=3;}
  go('veredito');
}
function openEnc(){
  if(S.closed){go('encerrado');return;}
  if(S.cafe)endCafe();
  if(S.run){const t=suspendTask('Suspensa no encerramento do dia');if(t)toast('Tarefa suspensa.','Estava rodando. Volta pra prancheta e espera horário novo.');}
  if(!S.enc)S.enc={step:1,decisions:{},pendCob:{},refl:'',openedAt:now()};
  else if(S.enc.step==='bloqueio'&&!openCobs().length)S.enc.step=3;
  S.ui.returnEnc=false;S.ui.pip=null;
  go('encerrar');
}
function stampWeekRisk(){S.notes.push({at:now(),tag:'Risco assumido',text:'Assinou o plano da semana com dia acima do expediente.'});}
function signWeek(){
  const tk=today();let n=0;
  weekDays().forEach(d=>{if(d.key<tk)return;(S.week[d.key]||[]).forEach(x=>{if(!x.signed){n++;if(d.key===tk){createTask({title:x.title,est:x.est});x.signed=true;x.converted=true;}else x.signed=true;}});
    if(d.key===tk)S.week[d.key]=(S.week[d.key]||[]).filter(x=>!x.converted);});
  return n;
}

  },
  assumirRisco(){const n=signWeek();stampWeekRisk();S.ui.modal=null;save();render();toast('Risco assumido.',`${cap(extF(n))} ${pl(n,'tarefa')} ${pl(n,'assinada')}. Anotado no Dossiê.`);},
  editRow(k){if(S.ui.erow===k){S.ui.erow=null;render();return;}const st=S.settings,p=S.pending||{};S.ui.erow=k;S.ui.edit={start:p.start||st.start,end:p.end||st.end,pausaSug:p.pausaSug||st.pausaSug,sons:(p.sons!=null?p.sons:st.sons)?'ligados':'desligados',lembrete:p.lembrete!=null?p.lembrete:(st.lembrete||0)};render();},
  cancelRow(){S.ui.erow=null;render();},
  saveRow(k){const e=S.ui.edit;const p=S.pending=S.pending||{};
    if(k==='horario'){if(hm2min(e.end)-hm2min(e.start)<240){toast('Expediente curto demais.','Mínimo de 4 horas.');return;}p.start=e.start;p.end=e.end;}
    if(k==='pausa')p.pausaSug=Number(e.pausaSug);if(k==='sons')p.sons=e.sons==='ligados';if(k==='lemb')p.lembrete=Number(e.lembrete)||0;
    S.ui.erow=null;save();render();toast('Anotado para amanhã.','No meio do jogo, não.');},
  notifToggle(k){S.notif[k]=!S.notif[k];save();render();},
  demo(){S.ui.demo={t0:Date.now()};render();},
  demoClose(){S.ui.demo=null;render();},
  speed(v){S.clock.sim=now();S.clock.real=Date.now();S.clock.speed=Number(v);save();render();},
  skip(m){S.clock.sim=now()+Number(m)*MIN;S.clock.real=Date.now();tick();render();},
  skip18(){const e=endOfDay();if(now()<e){S.clock.sim=e+5000;S.clock.real=Date.now();}tick();render();},
  reset(){const pmLay=S.pmLayout;S=seed();S.pmLayout=pmLay||'2a';S.ui={demo:{t0:0}};save();render();},
  stage(id){stage(id);},
  conhecerRegras(){go('regras');},
  pularRegras(){S.onboarded=true;go('prancheta');},
  concordo(){if(S.ui.signing)return;S.ui.signing=Date.now();render();setTimeout(()=>{if(S.route==='regras')A.okRegras();},1400);},
  okRegras(){S.onboarded=true;S.ui.signing=null;go('prancheta');toast('Assinado. Bora trabalhar.','Começa pela Prancheta: promete uma tarefa.');}
};

/* ================= roteiro: montar estados ================= */
function setClockMs(ms){S.clock.sim=ms;S.clock.real=Date.now();}
function atS(h,m,s){return at(h,m)+(s||0)*1000;}
const PZ_CAFE=()=>({at:at(11,27),cat:'Café',kind:'desculpa',seal:'justa',note:'',ms:5*MIN,reqMin:5,extMin:0,taskId:'t3'});
const PZ_OUT=()=>({at:atS(11,36,10),cat:'Outro',kind:'desculpa',seal:'justa',note:'Cliente ligou',ms:5*MIN,reqMin:5,extMin:0,taskId:'t3'});
/* v4: o relógio da tarefa inclui as pausas. workMs = tempo desde o Iniciar (11:02). */
function runMoraes(workMs,pzs){
  const t=task('t3');t.status='exec';t.startedAt=at(11,2);t.called=true;t.workMs=workMs;t.ideas=[{at:at(11,20),text:'Pedir referência de preço ao Rafael'}];
  pzs.forEach(p=>S.pauses.push(p));
  setClockMs(at(11,2)+workMs);
  const left=combMin(t)*MIN-workMs;
  S.run={taskId:'t3',phase:'work',phaseStart:now(),lateAt:left<0?now():null,warn5:left<=5*MIN,stepsAt:now(),beep:beepSlot(left),lastMin:left>0&&left<=MIN,pause:null,focusFrom:0,remindAt:null};
  armRemind(t);
  return t;
}
function pauseMoraes(workMs,elapsedMs,o){
  runMoraes(workMs,[PZ_CAFE()]);const r=S.run;const req=(o&&o.req)||5;
  r.phase='pause';r.pause={start:now()-elapsedMs,cat:'Outro',note:'Cliente ligou',reqMin:req,extMin:0,excCob:null,beep:'',lastMin:false};
  const pl=pauseTot(r.pause)-elapsedMs;r.pause.beep=beepSlot(pl);r.pause.lastMin=pl>0&&pl<=MIN;
  if(pl<=0)r.pause.excCob=addCob({type:'excedente',title:'Pausa · Outro',baseMin:req,amountMs:-pl,taskId:'t3',at:now()+pl});
  S.route='foco';
}
function moraesDone(){
  const t=task('t3');Object.assign(t,{status:'entregue',startedAt:at(11,2),workMs:41*MIN+12000,deliveredAt:atS(11,43,12),verdict:'prazo',cafeTaken:true,ideas:[{at:at(11,20),text:'Pedir referência de preço ao Rafael'}]});
  S.pauses.push(PZ_CAFE(),PZ_OUT());flushIdeas(t);
}
function relatorioLate(explained){
  const t=task('t1');Object.assign(t,{status:'entregue',startedAt:at(11,55),workMs:192*MIN,extraMin:15,extraN:1,extraReqs:[{at:at(14,0),min:15,why:'A diretoria pediu mais um recorte.'}],deliveredAt:at(15,7),verdict:'muito',cafeTaken:true});
  S.pauses.push({at:at(12,45),cat:'Banheiro',kind:'desculpa',seal:'justa',note:'',ms:4*MIN,reqMin:5,extMin:0,taskId:'t1'},{at:at(13,40),cat:'Café',kind:'desculpa',seal:'boba',note:'',ms:10*MIN,reqMin:10,extMin:0,taskId:'t1'},{at:at(14,35),cat:'Problemas técnicos',kind:'desculpa',seal:'justa',note:'Planilha travou',ms:12*MIN,reqMin:10,extMin:2,taskId:'t1'},{at:at(14,50),cat:'Cochilo',kind:'desculpa',seal:'boba',note:'',ms:6*MIN,reqMin:5,extMin:0,taskId:'t1'});
  const id=addCob({type:'atraso',taskId:'t1',title:t.title,at:at(15,7)});t.cobId=id;
  if(explained){const c=cob(id);Object.assign(c,{status:'explicada',verdict:'tolerada',explainedAt:at(15,40),excuse:{cat:'Interrupção externa',relato:'O cliente ligou duas vezes pedindo ajuste no escopo e precisei refazer a seção 3 antes de seguir com o relatório.',se:'',faco:''}});}
  return id;
}
function stage(id){
  const pmLay=S&&S.pmLayout;S=seed();S.pmLayout=pmLay||'2a';S.onboarded=true;S.route='prancheta';S.ui={};
  const setClock=(h,m)=>setClockMs(at(h,m));
  let after=null;
  switch(id){
    case '5·1':S.onboarded=false;S.route='welcome';break;
    case '5·2':S.onboarded=false;S.route='regras';break;
    case '1·5':break;
    case '1·6':S.ui.panel=newPanel({title:'Preparar pauta da reunião',desc:'Orçamento, prazos do Moraes e quem apresenta o quê.',imp:'alta'});S.notifPerm='granted';break;
    case '1·6n':S.ui.panel=newPanel({title:'Preparar pauta da reunião',imp:'alta',hor:true,horario:'14:00'});S.ui.browserPrompt=true;break;
    case '1·8':{const t=createTask({title:'Preparar pauta da reunião',est:45,imp:'alta',desc:'Orçamento, prazos do Moraes e quem apresenta o quê.'});S.ui.panel={kind:'nova',signed:t.id,st0:Date.now()};break;}
    case '1·9':S.ui.panel={kind:'tarefa',id:'t2',t0:Date.now()};break;
    case '1·9e':{const t=task('t2');S.ui.panel=panelFromTask(t,{editId:'t2',hor:true,horario:'15:30',t0:Date.now()});break;}
    case '1·5p':S.ui.modal={kind:'paywall',t0:Date.now()};break;
    case '1·5s':S.pro=true;S.route='semana';break;
    case '1·7':{S.pro=true;S.route='semana';const k=today();S.ui.modal={kind:'naocabe',key:k,total:sum(dayItems(k),x=>x.est),t0:Date.now()};break;}
    case '2A·10':S.route='pressao';S.ui.sel='t3';Object.assign(task('t3'),{horario:'11:00',pausaLen:10});setClock(11,2);task('t3').called=true;break;
    case '2A·10c':S.route='pressao';S.ui.sel='t3';task('t3').pausaLen=10;setClock(11,2);S.ui.modal={kind:'iniciar',id:'t3',t0:Date.now()};break;
    case '2A·12':runMoraes(31*MIN+51000,[PZ_CAFE()]);S.route='foco';break;
    case '2A·12b':runMoraes(44*MIN+8000,[PZ_CAFE(),PZ_OUT()]);S.route='foco';break;
    case '2A·13':runMoraes(51*MIN+12000,[PZ_CAFE(),PZ_OUT()]);S.route='foco';break;
    case '2A·11':runMoraes(51*MIN+12000,[PZ_CAFE(),PZ_OUT()]);S.route='foco';S.ui.modal={kind:'mais',v:15,custom:'',why:'O cliente mandou mais 3 anexos.',t0:Date.now()};break;
    case '2A·14':runMoraes(25*MIN,[]);S.route='foco';S.ui.remind={t0:Date.now()+45000,n:25};break;
    case '2A·15':runMoraes(31*MIN+51000,[PZ_CAFE()]);S.route='foco';S.ui.modal={kind:'pausar',cat:'Outro',note:'Cliente ligou',min:'outra',custom:'5',t0:Date.now()};break;
    case '2A·16':case '2C·16p':pauseMoraes(35*MIN+27000,3*MIN+36000);if(id==='2C·16p')S.ui.pip={t0:Date.now()};break;
    case '2A·16e':pauseMoraes(36*MIN+3000,4*MIN+12000);break;
    case '2A·14b':pauseMoraes(38*MIN+41000,7*MIN+14000);break;
    case '2C·12p':runMoraes(31*MIN+51000,[PZ_CAFE()]);S.route='foco';S.ui.pip={t0:Date.now()};break;
    case '2B·17':runMoraes(41*MIN+12000,[PZ_CAFE(),PZ_OUT()]);S.route='foco';S.ui.modal={kind:'entregar',t0:Date.now()};break;
    case '2B·18':case '2B·18b':{runMoraes(41*MIN+12000,[PZ_CAFE(),PZ_OUT()]);deliver();S.route='entrega';
      if(id==='2B·18b'){task('t3').cafeTaken=true;S.cafe={start:now()-48000,free:true,taskId:'t3',excCob:null};S.route='cafe';}break;}
    case '2B·18x':{const t=task('t3');Object.assign(t,{status:'exec',startedAt:at(11,2),called:true,workMs:112*MIN,extraMin:15,extraN:1,extraReqs:[{at:at(11,58),min:15,why:'O cliente mandou mais 3 anexos.'}],ideas:[{at:at(11,20),text:'Pedir referência de preço ao Rafael'}]});
      S.pauses.push(PZ_CAFE(),{at:at(11,40),cat:'Problemas técnicos',kind:'desculpa',seal:'justa',note:'',ms:12*MIN,reqMin:10,extMin:2,taskId:'t3'},{at:at(12,10),cat:'Banheiro',kind:'desculpa',seal:'justa',note:'',ms:4*MIN,reqMin:5,extMin:0,taskId:'t3'},{at:at(12,22),cat:'Cochilo',kind:'desculpa',seal:'boba',note:'',ms:6*MIN,reqMin:5,extMin:0,taskId:'t3'},{at:at(12,35),cat:'Outro',kind:'desculpa',seal:'boba',note:'celular',ms:9*MIN,reqMin:5,extMin:0,taskId:'t3'});
      setClockMs(at(11,2)+112*MIN);S.run={taskId:'t3',phase:'work',phaseStart:now(),lateAt:now(),warn5:true,stepsAt:now(),beep:'',lastMin:false,pause:null,focusFrom:0,remindAt:null};deliver();S.route='entrega';break;}
    case '2B·19':runMoraes(31*MIN+51000,[PZ_CAFE()]);S.route='pressao';after=()=>A.umaDeCada();break;
    case '2B·10z':{moraesDone();relatorioLate(true);
      Object.assign(task('t2'),{status:'entregue',startedAt:at(13,40),workMs:84*MIN,deliveredAt:at(15,4),verdict:'prazo',cafeTaken:true});
      Object.assign(task('t4'),{status:'entregue',startedAt:at(14,45),workMs:28*MIN,deliveredAt:at(15,13),verdict:'prazo',cafeTaken:true});
      setClock(15,20);S.route='pressao';break;}
    case '2D·30':runMoraes(31*MIN+51000,[PZ_CAFE()]);S.route='foco';S.ui.modal={kind:'suspender',note:'O cliente pediu pra esperar o retorno dele.',t0:Date.now()};break;
    case '2D·31':case '2D·32':case '2D·33':{runMoraes(31*MIN+51000,[PZ_CAFE()]);suspendTask('O cliente pediu pra esperar o retorno dele.');setClockMs(now()+60000);S.route='prancheta';
      if(id==='2D·32')S.ui.panel={kind:'reativar',id:'t3',h:0,m:13,horario:'14:00',t0:Date.now()};
      if(id==='2D·33'){S.route='pressao';S.ui.sel='t3';S.ui.modal={kind:'susp',id:'t3',t0:Date.now()};}break;}
    case '2D·34':runMoraes(31*MIN+51000,[PZ_CAFE()]);S.route='foco';S.ui.modal={kind:'desistir',t0:Date.now()};break;
    case '3·20':case '3·21a':case '3·21b':case '3·22':{
      moraesDone();const atr=relatorioLate(false);setClock(17,20);
      S.route='cobrancas';S.ui.cobSel=atr;
      if(id!=='3·20'){S.ui.exc={cobId:atr,step:1,cat:id==='3·21a'?null:'Interrupção externa',relato:'',se:'',faco:'',returnTo:null};S.route='desculpa';}
      if(id==='3·21b'||id==='3·22'){S.ui.exc.step=2;S.ui.exc.relato='O cliente ligou duas vezes pedindo ajuste no escopo e precisei refazer a seção 3 antes de seguir com o relatório.';}
      if(id==='3·22'){save();finishExcuse(true);return;}
      break;}
    case '3·23':S.route='historico';break;
    case '4·24':case '4·25':case '4·26':case '4·27':case '4·27b':{
      moraesDone();relatorioLate(true);
      const t2=task('t2');Object.assign(t2,{status:'suspensa',startedAt:at(15,55),workMs:40*MIN,suspendedAt:at(16,35),suspendNote:'Faltou o extrato do banco.'});
      S.pauses.push({at:at(16,10),cat:'Café',kind:'desculpa',seal:'boba',note:'',ms:5*MIN,reqMin:5,extMin:0,taskId:'t2'});
      setClock(18,4);S.day.endAsked=true;
      S.enc={step:1,decisions:{},pendCob:{},refl:'',openedAt:now()};S.route='encerrar';
      if(id==='4·25')S.enc.step=2;
      if(id==='4·26'||id==='4·27'||id==='4·27b'){const t4=task('t4');t4.status='amanha';S.enc.decisions.t4='amanha';S.cobs.push({id:'m1',type:'mudanca',taskId:'t4',title:t4.title,detail:'Levou a tarefa para amanhã',encMove:true,at:at(18,6),status:'explicada',verdict:'suspeita',explainedAt:at(18,8),excuse:{cat:'Prioridade mudou',relato:'O relatório tomou a tarde inteira e o jurídico pode esperar até amanhã cedo.',se:'',faco:''}});S.enc.step='bloqueio';}
      if(id==='4·27'||id==='4·27b'){const c=cob('c1');Object.assign(c,{status:'explicada',verdict:'suspeita',explainedAt:at(18,10),excuse:{cat:'Imprevisto pessoal',relato:'A fila do café do andar estava enorme.',se:'',faco:''}});S.enc.step=3;S.enc.refl='Manhã perdida com o cliente. A tarde rendeu. Amanhã começo pelo jurídico.';}
      if(id==='4·27b'){setClock(18,11);const st=statsToday();S.closed={at:now(),p:st.p,e:st.e,verdict:dayVerdict(st).v,pro:false,first:at(8,22)};S.reflections.push({at:now(),text:S.enc.refl});S.ui.punchT0=Date.now();S.route='encerrado';}
      break;}
    case '28':{moraesDone();const t=task('t4');t.status='excluida';t.excludedAt=at(10,15);S.notes.push({at:at(10,15),tag:'Excluída',text:t.title});setClock(12,10);S.route='dossie';break;}
    case '29':S.pro=true;S.route='expediente';break;
  }
  S.ui._top=true;save();render();if(after)after();
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();else if(AC.state==='suspended')AC.resume();}catch(x){}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.disabled||el.getAttribute('aria-disabled')==='true')return;
  const fn=A[el.dataset.act];if(!fn)return;
  e.preventDefault();fn(el.dataset.arg,el,e);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.actChange){const fn=A[el.dataset.actChange];if(fn)fn(el.value,el);return;}
  const path=el.dataset&&el.dataset.model;if(!path)return;
  let v=el.value;if(el.hasAttribute('data-num'))v=Number(v);
  setPath(path,v);render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.ui.browserPrompt){A.perm('denied');return;}
    if(S.ui.remind&&!S.ui.modal){A.lembreteNao();return;}
    if(S.ui.demo){A.demoClose();return;}
    if(S.ui.pip){A.pipClose();return;}
    if(S.ui.modal){A.closeModal();return;}
    if(S.ui.panel){A.fecharPainel();return;}
    return;
  }
  const t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();const fn=A[t.dataset.enter];if(fn)fn();return;}
  if(e.key==='Enter'&&t.matches&&t.matches('tr[data-act]')){e.preventDefault();A[t.dataset.act](t.dataset.arg,t);return;}
  if(t.closest&&t.closest('input,textarea,select'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const m=S.ui.modal;
  if(e.key==='Enter'&&m&&(m.kind==='iniciar'||m.kind==='entregar')&&!(t.closest&&t.closest('button,input'))){e.preventDefault();m.kind==='iniciar'?A.iniciarOk():A.entregarOk();return;}
  if(S.route==='foco'&&S.run&&S.run.phase==='work'&&!m&&!S.ui.panel&&!S.ui.pip){
    const k=e.key.toLowerCase();
    if(k==='e'){e.preventDefault();A.entregar();}else if(k==='p'){e.preventDefault();A.pausar();}else if(k==='s'){e.preventDefault();A.suspender();}else if(k==='i'){e.preventDefault();const i=$('#idea-in');if(i)i.focus();}
  }
});

/* ================= início ================= */
load();
if(!S.pmLayout)S.pmLayout='2a';
if(!S.onboarded&&S.route!=='regras')S.route='welcome';
if(S.route==='foco'&&!S.run)S.route='pressao';
if(S.route==='cafe'&&!S.cafe)S.route='pressao';
function stageFromHash(){const hash=decodeURIComponent((location.hash||'').replace('#',''));if(!hash)return false;
  if(/^2[abc]$/i.test(hash)){S.pmLayout=hash.toLowerCase();stage('2A·10');return true;}const all=SCREENS.flatMap(g=>g[1].map(x=>x[0]));const id=all.find(x=>x.replace('·','-').toLowerCase()===hash.toLowerCase()||x===hash);if(id){stage(id);return true;}return false;}
stageFromHash();
window.addEventListener('hashchange',stageFromHash);
render();
setInterval(tick,250);
})();
</script>
